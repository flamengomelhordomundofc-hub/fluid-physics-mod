name: Build Fluid Physics Mod (1.20.1 Forge)

on:
  push:
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Xmx3G"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Generate Mod Project & Source Code
        run: |
          mkdir -p src/main/java/com/fluidphysics/physics
          mkdir -p src/main/java/com/fluidphysics/entity
          mkdir -p src/main/java/com/fluidphysics/network
          mkdir -p src/main/java/com/fluidphysics/events
          mkdir -p src/main/java/com/fluidphysics/client
          mkdir -p src/main/resources/META-INF
          mkdir -p src/main/resources/assets/fluidphysics/lang

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3G
          org.gradle.daemon=false
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  maven {
                      name = 'MinecraftForge'
                      url = 'https://maven.minecraftforge.net/'
                  }
              }
          }
          rootProject.name = 'FluidPhysicsMod'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
          }

          version = '1.0.0'
          group = 'com.fluidphysics'

          base {
              archivesName = 'fluidphysics'
          }

          java.toolchain.languageVersion = JavaLanguageVersion.of(17)

          minecraft {
              mappings channel: 'official', version: '1.20.1'
          }

          dependencies {
              minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
          }

          jar {
              manifest {
                  attributes([
                      'Specification-Title'     : 'fluidphysics',
                      'Specification-Vendor'    : 'FluidPhysicsDev',
                      'Specification-Version'   : '1',
                      'Implementation-Title'    : project.name,
                      'Implementation-Version'  : '1.0.0',
                      'Implementation-Vendor'   : 'FluidPhysicsDev'
                  ])
              }
              finalizedBy 'reobfJar'
          }

          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
          }
          EOF

          cat << 'EOF' > src/main/resources/pack.mcmeta
          {
            "pack": {
              "description": "Fluid Physics Mod Resources",
              "pack_format": 15
            }
          }
          EOF

          cat << 'EOF' > src/main/resources/META-INF/mods.toml
          modLoader="javafml"
          loaderVersion="[47,)"
          license="MIT"

          [[mods]]
          modId="fluidphysics"
          version="1.0.0"
          displayName="Fluid Physics"
          authors="FluidPhysicsDev"
          description='''
          Real-time 3D rigid-body block physics, free-angle tumbling falling blocks, placement impact physics, explosions, water buoyancy, and player-interactive 3D particles for Minecraft 1.20.1 Forge.
          '''

          [[dependencies.fluidphysics]]
              modId="forge"
              mandatory=true
              versionRange="[47,)"
              ordering="NONE"
              side="BOTH"

          [[dependencies.fluidphysics]]
              modId="minecraft"
              mandatory=true
              versionRange="[1.20.1,1.21)"
              ordering="NONE"
              side="BOTH"
          EOF

          cat << 'EOF' > src/main/resources/assets/fluidphysics/lang/en_us.json
          {
            "entity.fluidphysics.fluid_block": "Physics Block"
          }
          EOF

          cat << 'EOF' > src/main/resources/assets/fluidphysics/lang/pt_br.json
          {
            "entity.fluidphysics.fluid_block": "Bloco Físico"
          }
          EOF

          cat << 'EOF' > src/main/java/com/fluidphysics/FluidPhysicsMod.java
          package com.fluidphysics;

          import com.fluidphysics.entity.FluidBlockEntity;
          import com.fluidphysics.events.ServerPhysicsEvents;
          import com.fluidphysics.network.ModNetwork;
          import net.minecraft.world.entity.EntityType;
          import net.minecraft.world.entity.MobCategory;
          import net.minecraftforge.common.MinecraftForge;
          import net.minecraftforge.eventbus.api.IEventBus;
          import net.minecraftforge.fml.common.Mod;
          import net.minecraftforge.fml.event.lifecycle.FMLCommonSetupEvent;
          import net.minecraftforge.fml.javafmlmod.FMLJavaModLoadingContext;
          import net.minecraftforge.registries.DeferredRegister;
          import net.minecraftforge.registries.ForgeRegistries;
          import net.minecraftforge.registries.RegistryObject;

          @Mod(FluidPhysicsMod.MODID)
          public class FluidPhysicsMod {
              public static final String MODID = "fluidphysics";

              public static final DeferredRegister<EntityType<?>> ENTITIES =
                  DeferredRegister.create(ForgeRegistries.ENTITY_TYPES, MODID);

              public static final RegistryObject<EntityType<FluidBlockEntity>> FLUID_BLOCK =
                  ENTITIES.register("fluid_block", () ->
                      EntityType.Builder.<FluidBlockEntity>of(FluidBlockEntity::new, MobCategory.MISC)
                          .sized(0.98F, 0.98F)
                          .clientTrackingRange(10)
                          .updateInterval(1)
                          .build("fluid_block")
                  );

              public FluidPhysicsMod() {
                  IEventBus modBus = FMLJavaModLoadingContext.get().getModEventBus();
                  ENTITIES.register(modBus);
                  modBus.addListener(this::commonSetup);
                  MinecraftForge.EVENT_BUS.register(new ServerPhysicsEvents());
              }

              private void commonSetup(final FMLCommonSetupEvent event) {
                  event.enqueueWork(ModNetwork::register);
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/fluidphysics/physics/PhysicsConfig.java
          package com.fluidphysics.physics;

          import net.minecraft.core.BlockPos;
          import net.minecraft.tags.BlockTags;
          import net.minecraft.world.level.BlockGetter;
          import net.minecraft.world.level.block.Blocks;
          import net.minecraft.world.level.block.FallingBlock;
          import net.minecraft.world.level.block.SoundType;
          import net.minecraft.world.level.block.TntBlock;
          import net.minecraft.world.level.block.state.BlockState;

          public final class PhysicsConfig {
              public static volatile boolean fullGravity = false;
              public static volatile boolean placementPhysics = true;
              // 0 = low, 1 = medium, 2 = high
              public static volatile int qualityLevel = 1;

              public static int getMaxFragments() {
                  return switch (qualityLevel) {
                      case 0 -> 120;
                      case 2 -> 520;
                      default -> 260;
                  };
              }

              public static int getMaxParticles() {
                  return switch (qualityLevel) {
                      case 0 -> 450;
                      case 2 -> 2400;
                      default -> 1150;
                  };
              }

              public static boolean isNaturalGravity(BlockState state) {
                  return state.getBlock() instanceof FallingBlock;
              }

              public static boolean isSafePhysicsBlock(BlockState state, BlockGetter level, BlockPos pos) {
                  if (state == null || state.isAir() || state.hasBlockEntity()) return false;
                  if (!state.getFluidState().isEmpty()) return false;
                  if (state.getDestroySpeed(level, pos) < 0.0F) return false;
                  if (state.getBlock() instanceof TntBlock) return false;
                  return state.isCollisionShapeFullBlock(level, pos);
              }

              public static float getRestitution(BlockState state) {
                  SoundType sound = state.getSoundType();
                  if (sound == SoundType.SLIME_BLOCK || state.is(Blocks.SLIME_BLOCK)) return 0.84F;
                  if (sound == SoundType.HONEY_BLOCK || state.is(Blocks.HONEY_BLOCK)) return 0.05F;
                  if (sound == SoundType.SAND || sound == SoundType.GRAVEL || sound == SoundType.SNOW) return 0.14F;
                  if (sound == SoundType.GRASS || state.is(BlockTags.DIRT)) return 0.18F;
                  if (sound == SoundType.WOOL) return 0.22F;
                  if (sound == SoundType.WOOD) return 0.34F;
                  if (sound == SoundType.GLASS) return 0.30F;
                  if (sound == SoundType.METAL || sound == SoundType.ANVIL) return 0.36F;
                  return 0.28F;
              }

              public static float getFriction(BlockState state) {
                  if (state.is(BlockTags.ICE)) return 0.04F;
                  SoundType sound = state.getSoundType();
                  if (sound == SoundType.HONEY_BLOCK) return 0.96F;
                  if (sound == SoundType.SLIME_BLOCK) return 0.50F;
                  if (sound == SoundType.GLASS) return 0.32F;
                  if (sound == SoundType.METAL) return 0.42F;
                  if (sound == SoundType.SAND || sound == SoundType.GRAVEL) return 0.68F;
                  return 0.56F;
              }

              public static float getBuoyancy(BlockState state) {
                  SoundType sound = state.getSoundType();
                  if (state.is(BlockTags.LOGS) || state.is(BlockTags.PLANKS) ||
                      state.is(BlockTags.LEAVES) || state.is(BlockTags.WOOL) ||
                      sound == SoundType.WOOD || sound == SoundType.WOOL ||
                      state.is(Blocks.SPONGE) || state.is(Blocks.HAY_BLOCK) ||
                      state.is(BlockTags.ICE)) {
                      return 1.65F;
                  }
                  if (sound == SoundType.SLIME_BLOCK || sound == SoundType.SNOW) return 1.25F;
                  if (sound == SoundType.METAL || sound == SoundType.ANVIL || state.is(Blocks.OBSIDIAN)) return 0.30F;
                  if (sound == SoundType.STONE) return 0.45F;
                  return 0.65F;
              }

              public static float getMass(BlockState state) {
                  SoundType sound = state.getSoundType();
                  if (sound == SoundType.ANVIL || state.is(BlockTags.ANVIL) || state.is(Blocks.OBSIDIAN)) return 3.2F;
                  if (sound == SoundType.METAL) return 2.4F;
                  if (sound == SoundType.STONE) return 1.8F;
                  if (sound == SoundType.WOOD) return 0.9F;
                  if (sound == SoundType.WOOL || state.is(BlockTags.LEAVES) || sound == SoundType.SNOW) return 0.55F;
                  return 1.2F;
              }

              public static boolean isTintedParticleBlock(BlockState state) {
                  return state.is(BlockTags.LEAVES)
                      || state.is(Blocks.GRASS)
                      || state.is(Blocks.TALL_GRASS)
                      || state.is(Blocks.FERN)
                      || state.is(Blocks.LARGE_FERN)
                      || state.is(Blocks.VINE)
                      || state.is(Blocks.LILY_PAD)
                      || state.is(Blocks.SUGAR_CANE);
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/fluidphysics/physics/OBBPhysicsSolver.java
          package com.fluidphysics.physics;

          import net.minecraft.core.BlockPos;
          import net.minecraft.util.Mth;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.level.block.state.BlockState;
          import net.minecraft.world.level.material.FluidState;
          import net.minecraft.world.phys.AABB;
          import net.minecraft.world.phys.Vec3;
          import net.minecraft.world.phys.shapes.Shapes;
          import net.minecraft.world.phys.shapes.VoxelShape;
          import org.joml.Quaternionf;
          import org.joml.Vector3f;

          import java.util.List;

          public final class OBBPhysicsSolver {

              public static class RigidBody {
                  public double x, y, z;
                  public float vx, vy, vz;
                  public final Quaternionf rot = new Quaternionf();
                  public float wx, wy, wz;
                  public float hx = 0.5F, hy = 0.5F, hz = 0.5F;
                  public float mass = 1.0F;
                  public float restitution = 0.28F;
                  public float friction = 0.55F;
                  public float buoyancy = 0.65F;
                  public boolean onGround = false;
                  public boolean inWater = false;
                  public float lastImpactSpeed = 0.0F;
                  public boolean highPrecision = false;

                  public void applyImpulse(float ix, float iy, float iz, float rx, float ry, float rz) {
                      float invMass = 1.0F / Math.max(0.2F, mass);
                      float invI = 3.2F / (Math.max(0.2F, mass) * (hx * hx + hy * hy + hz * hz));
                      vx += ix * invMass;
                      vy += iy * invMass;
                      vz += iz * invMass;
                      wx += (ry * iz - rz * iy) * invI;
                      wy += (rz * ix - rx * iz) * invI;
                      wz += (rx * iy - ry * ix) * invI;
                  }
              }

              private static final int MAX_CONTACTS = 24;

              public static void step(Level level, RigidBody body, float dt) {
                  body.lastImpactSpeed = 0.0F;
                  body.onGround = false;

                  int subSteps = 2;
                  float subDt = dt / (float) subSteps;

                  BlockPos.MutableBlockPos mPos = new BlockPos.MutableBlockPos();
                  BlockPos.MutableBlockPos nPos = new BlockPos.MutableBlockPos();

                  float[] cRx = new float[MAX_CONTACTS];
                  float[] cRy = new float[MAX_CONTACTS];
                  float[] cRz = new float[MAX_CONTACTS];
                  float[] cNx = new float[MAX_CONTACTS];
                  float[] cNy = new float[MAX_CONTACTS];
                  float[] cNz = new float[MAX_CONTACTS];
                  float[] cPen = new float[MAX_CONTACTS];

                  Vector3f localVec = new Vector3f();
                  Quaternionf dq = new Quaternionf();
                  Quaternionf nextQ = new Quaternionf();

                  float invMass = 1.0F / Math.max(0.2F, body.mass);
                  float invI = 3.2F / (Math.max(0.2F, body.mass) * (body.hx * body.hx + body.hy * body.hy + body.hz * body.hz));

                  for (int step = 0; step < subSteps; step++) {
                      mPos.set(Mth.floor(body.x), Mth.floor(body.y), Mth.floor(body.z));
                      FluidState fluid = level.getFluidState(mPos);
                      if (!fluid.isEmpty()) {
                          body.inWater = true;
                          float fluidHeight = fluid.getHeight(level, mPos);
                          double surfaceY = mPos.getY() + fluidHeight;
                          float sub = Mth.clamp((float) (surfaceY - (body.y - body.hy)) / (2.0F * body.hy), 0.0F, 1.0F);
                          float ay = -0.04F + (0.04F * body.buoyancy * sub);
                          body.vy += ay * subDt;

                          Vec3 flow = fluid.getFlow(level, mPos);
                          body.vx += (float) flow.x * 0.018F * subDt;
                          body.vz += (float) flow.z * 0.018F * subDt;

                          if (sub > 0.1F && sub < 0.95F) {
                              float wave = (float) Math.sin((body.x * 1.7 + body.z * 1.3 + level.getGameTime() * 0.12)) * 0.008F;
                              body.wx += wave * subDt;
                              body.wz -= wave * 0.7F * subDt;
                          }

                          float linDrag = (float) Math.pow(0.84, subDt);
                          float angDrag = (float) Math.pow(0.80, subDt);
                          body.vx *= linDrag;
                          body.vy *= linDrag;
                          body.vz *= linDrag;
                          body.wx *= angDrag;
                          body.wy *= angDrag;
                          body.wz *= angDrag;
                      } else {
                          body.inWater = false;
                          body.vy -= 0.04F * subDt;
                          float linDrag = (float) Math.pow(0.993, subDt);
                          float angDrag = (float) Math.pow(0.986, subDt);
                          body.vx *= linDrag;
                          body.vy *= linDrag;
                          body.vz *= linDrag;
                          body.wx *= angDrag;
                          body.wy *= angDrag;
                          body.wz *= angDrag;
                      }

                      body.x += body.vx * subDt;
                      body.y += body.vy * subDt;
                      body.z += body.vz * subDt;

                      float wMag = (float) Math.sqrt(body.wx * body.wx + body.wy * body.wy + body.wz * body.wz);
                      if (wMag > 1.0e-5F) {
                          float angle = wMag * subDt;
                          dq.fromAxisAngleRad(body.wx / wMag, body.wy / wMag, body.wz / wMag, angle);
                          dq.mul(body.rot, nextQ);
                          body.rot.set(nextQ).normalize();
                      }

                      int numContacts = 0;
                      float maxPushPosX = 0, maxPushNegX = 0;
                      float maxPushPosY = 0, maxPushNegY = 0;
                      float maxPushPosZ = 0, maxPushNegZ = 0;

                      int sampleCount = body.highPrecision ? 14 : 8;
                      for (int i = 0; i < sampleCount && numContacts < MAX_CONTACTS; i++) {
                          float lx, ly, lz;
                          if (i < 8) {
                              lx = ((i & 1) == 0 ? -body.hx : body.hx);
                              ly = ((i & 2) == 0 ? -body.hy : body.hy);
                              lz = ((i & 4) == 0 ? -body.hz : body.hz);
                          } else {
                              int f = i - 8;
                              lx = (f == 0 ? body.hx : (f == 1 ? -body.hx : 0));
                              ly = (f == 2 ? body.hy : (f == 3 ? -body.hy : 0));
                              lz = (f == 4 ? body.hz : (f == 5 ? -body.hz : 0));
                          }

                          localVec.set(lx, ly, lz);
                          body.rot.transform(localVec);

                          double px = body.x + localVec.x;
                          double py = body.y + localVec.y;
                          double pz = body.z + localVec.z;

                          int bx = Mth.floor(px);
                          int by = Mth.floor(py);
                          int bz = Mth.floor(pz);
                          mPos.set(bx, by, bz);

                          BlockState bs = level.getBlockState(mPos);
                          if (bs.isAir()) continue;

                          VoxelShape shape = bs.getCollisionShape(level, mPos);
                          if (shape.isEmpty()) continue;

                          if (shape == Shapes.block()) {
                              numContacts = testBoxContact(
                                  level, nPos, bx, by, bz,
                                  bx, by, bz, bx + 1.0, by + 1.0, bz + 1.0,
                                  px, py, pz, localVec.x, localVec.y, localVec.z,
                                  cRx, cRy, cRz, cNx, cNy, cNz, cPen, numContacts
                              );
                          } else {
                              List<AABB> boxes = shape.toAabbs();
                              for (int b = 0; b < boxes.size() && numContacts < MAX_CONTACTS; b++) {
                                  AABB box = boxes.get(b);
                                  numContacts = testBoxContact(
                                      level, nPos, bx, by, bz,
                                      bx + box.minX, by + box.minY, bz + box.minZ,
                                      bx + box.maxX, by + box.maxY, bz + box.maxZ,
                                      px, py, pz, localVec.x, localVec.y, localVec.z,
                                      cRx, cRy, cRz, cNx, cNy, cNz, cPen, numContacts
                                  );
                              }
                          }
                      }

                      if (numContacts > 0) {
                          for (int c = 0; c < numContacts; c++) {
                              float pen = cPen[c];
                              float nx = cNx[c], ny = cNy[c], nz = cNz[c];
                              if (nx > 0.5F) maxPushPosX = Math.max(maxPushPosX, pen);
                              else if (nx < -0.5F) maxPushNegX = Math.max(maxPushNegX, pen);
                              if (ny > 0.5F) {
                                  maxPushPosY = Math.max(maxPushPosY, pen);
                                  body.onGround = true;
                              } else if (ny < -0.5F) {
                                  maxPushNegY = Math.max(maxPushNegY, pen);
                              }
                              if (nz > 0.5F) maxPushPosZ = Math.max(maxPushPosZ, pen);
                              else if (nz < -0.5F) maxPushNegZ = Math.max(maxPushNegZ, pen);
                          }

                          body.x += (maxPushPosX - maxPushNegX) * 0.82;
                          body.y += (maxPushPosY - maxPushNegY) * 0.85;
                          body.z += (maxPushPosZ - maxPushNegZ) * 0.82;

                          int iterations = numContacts > 1 ? 2 : 1;
                          float relax = numContacts > 3 ? 0.62F : 0.85F;

                          for (int iter = 0; iter < iterations; iter++) {
                              for (int c = 0; c < numContacts; c++) {
                                  float rx = cRx[c], ry = cRy[c], rz = cRz[c];
                                  float nx = cNx[c], ny = cNy[c], nz = cNz[c];

                                  float vcx = body.vx + (body.wy * rz - body.wz * ry);
                                  float vcy = body.vy + (body.wz * rx - body.wx * rz);
                                  float vcz = body.vz + (body.wx * ry - body.wy * rx);

                                  float vn = vcx * nx + vcy * ny + vcz * nz;
                                  if (vn >= 0.0F) continue;

                                  if (-vn > body.lastImpactSpeed) {
                                      body.lastImpactSpeed = -vn;
                                  }

                                  float e = (-vn > 0.09F) ? body.restitution : 0.0F;

                                  float rcnX = ry * nz - rz * ny;
                                  float rcnY = rz * nx - rx * nz;
                                  float rcnZ = rx * ny - ry * nx;
                                  float rcnSq = rcnX * rcnX + rcnY * rcnY + rcnZ * rcnZ;

                                  float denom = invMass + rcnSq * invI;
                                  float j = (-(1.0F + e) * vn / denom) * relax;

                                  float jx = nx * j;
                                  float jy = ny * j;
                                  float jz = nz * j;

                                  body.vx += jx * invMass;
                                  body.vy += jy * invMass;
                                  body.vz += jz * invMass;
                                  body.wx += (ry * jz - rz * jy) * invI;
                                  body.wy += (rz * jx - rx * jz) * invI;
                                  body.wz += (rx * jy - ry * jx) * invI;

                                  vcx = body.vx + (body.wy * rz - body.wz * ry);
                                  vcy = body.vy + (body.wz * rx - body.wx * rz);
                                  vcz = body.vz + (body.wx * ry - body.wy * rx);
                                  float vn2 = vcx * nx + vcy * ny + vcz * nz;

                                  float vtx = vcx - nx * vn2;
                                  float vty = vcy - ny * vn2;
                                  float vtz = vcz - nz * vn2;
                                  float vtSq = vtx * vtx + vty * vty + vtz * vtz;

                                  if (vtSq > 1.0e-6F) {
                                      float vtMag = (float) Math.sqrt(vtSq);
                                      float tx = vtx / vtMag;
                                      float ty = vty / vtMag;
                                      float tz = vtz / vtMag;

                                      float rctX = ry * tz - rz * ty;
                                      float rctY = rz * tx - rx * tz;
                                      float rctZ = rx * ty - ry * tx;
                                      float rctSq = rctX * rctX + rctY * rctY + rctZ * rctZ;

                                      float denomT = invMass + rctSq * invI;
                                      float jt = (-vtMag / denomT) * relax;
                                      float maxF = j * body.friction;
                                      jt = Mth.clamp(jt, -maxF, maxF);

                                      float fjx = tx * jt;
                                      float fjy = ty * jt;
                                      float fjz = tz * jt;

                                      body.vx += fjx * invMass;
                                      body.vy += fjy * invMass;
                                      body.vz += fjz * invMass;
                                      body.wx += (ry * fjz - rz * fjy) * invI;
                                      body.wy += (rz * fjx - rx * fjz) * invI;
                                      body.wz += (rx * fjy - ry * fjx) * invI;
                                  }
                              }
                          }
                      }

                      if (body.onGround) {
                          float linSq = body.vx * body.vx + body.vy * body.vy + body.vz * body.vz;
                          float angSq = body.wx * body.wx + body.wy * body.wy + body.wz * body.wz;
                          if (linSq < 0.0012F && angSq < 0.0025F) {
                              body.vx *= 0.80F;
                              body.vz *= 0.80F;
                              body.wx *= 0.78F;
                              body.wy *= 0.78F;
                              body.wz *= 0.78F;
                          }
                      }

                      sanitize(body);
                  }
              }

              private static int testBoxContact(
                  Level level, BlockPos.MutableBlockPos nPos, int bx, int by, int bz,
                  double minX, double minY, double minZ, double maxX, double maxY, double maxZ,
                  double px, double py, double pz, float rx, float ry, float rz,
                  float[] cRx, float[] cRy, float[] cRz,
                  float[] cNx, float[] cNy, float[] cNz, float[] cPen,
                  int numContacts
              ) {
                  if (px <= minX || px >= maxX || py <= minY || py >= maxY || pz <= minZ || pz >= maxZ) {
                      return numContacts;
                  }

                  float dPosY = (float) (maxY - py);
                  float dNegY = (float) (py - minY);
                  float dPosX = (float) (maxX - px);
                  float dNegX = (float) (px - minX);
                  float dPosZ = (float) (maxZ - pz);
                  float dNegZ = (float) (pz - minZ);

                  float bestPen = Float.MAX_VALUE;
                  float bestNx = 0, bestNy = 1, bestNz = 0;

                  if (dPosY < bestPen && !isFullSolid(level, nPos, bx, by + 1, bz)) {
                      bestPen = dPosY; bestNx = 0; bestNy = 1; bestNz = 0;
                  }
                  if (dNegY < bestPen && !isFullSolid(level, nPos, bx, by - 1, bz)) {
                      bestPen = dNegY; bestNx = 0; bestNy = -1; bestNz = 0;
                  }
                  if (dPosX < bestPen && !isFullSolid(level, nPos, bx + 1, by, bz)) {
                      bestPen = dPosX; bestNx = 1; bestNy = 0; bestNz = 0;
                  }
                  if (dNegX < bestPen && !isFullSolid(level, nPos, bx - 1, by, bz)) {
                      bestPen = dNegX; bestNx = -1; bestNy = 0; bestNz = 0;
                  }
                  if (dPosZ < bestPen && !isFullSolid(level, nPos, bx, by, bz + 1)) {
                      bestPen = dPosZ; bestNx = 0; bestNy = 0; bestNz = 1;
                  }
                  if (dNegZ < bestPen && !isFullSolid(level, nPos, bx, by, bz - 1)) {
                      bestPen = dNegZ; bestNx = 0; bestNy = 0; bestNz = -1;
                  }

                  if (bestPen == Float.MAX_VALUE) {
                      bestPen = dPosY;
                      bestNx = 0; bestNy = 1; bestNz = 0;
                  }

                  cRx[numContacts] = rx;
                  cRy[numContacts] = ry;
                  cRz[numContacts] = rz;
                  cNx[numContacts] = bestNx;
                  cNy[numContacts] = bestNy;
                  cNz[numContacts] = bestNz;
                  cPen[numContacts] = Math.min(bestPen, 0.35F);
                  return numContacts + 1;
              }

              private static boolean isFullSolid(Level level, BlockPos.MutableBlockPos pos, int x, int y, int z) {
                  pos.set(x, y, z);
                  BlockState bs = level.getBlockState(pos);
                  return !bs.isAir() && bs.getCollisionShape(level, pos) == Shapes.block();
              }

              private static void sanitize(RigidBody b) {
                  float maxLin = 2.6F;
                  float maxAng = 1.15F;
                  if (!Float.isFinite(b.vx)) b.vx = 0;
                  if (!Float.isFinite(b.vy)) b.vy = 0;
                  if (!Float.isFinite(b.vz)) b.vz = 0;
                  if (!Float.isFinite(b.wx)) b.wx = 0;
                  if (!Float.isFinite(b.wy)) b.wy = 0;
                  if (!Float.isFinite(b.wz)) b.wz = 0;
                  b.vx = Mth.clamp(b.vx, -maxLin, maxLin);
                  b.vy = Mth.clamp(b.vy, -maxLin, maxLin);
                  b.vz = Mth.clamp(b.vz, -maxLin, maxLin);
                  b.wx = Mth.clamp(b.wx, -maxAng, maxAng);
                  b.wy = Mth.clamp(b.wy, -maxAng, maxAng);
                  b.wz = Mth.clamp(b.wz, -maxAng, maxAng);
                  if (!Float.isFinite(b.rot.x) || !Float.isFinite(b.rot.y) || !Float.isFinite(b.rot.z) || !Float.isFinite(b.rot.w)) {
                      b.rot.identity();
                  }
              }
          }
