                  CHANNEL.registerMessage(id++, BlockBreakPacket.class, BlockBreakPacket::encode, BlockBreakPacket::decode, BlockBreakPacket::handle, Optional.of(NetworkDirection.PLAY_TO_CLIENT));
                  CHANNEL.registerMessage(id++, BlockPlaceImpactPacket.class, BlockPlaceImpactPacket::encode, BlockPlaceImpactPacket::decode, BlockPlaceImpactPacket::handle, Optional.of(NetworkDirection.PLAY_TO_CLIENT));
                  CHANNEL.registerMessage(id++, BounceParticlesPacket.class, BounceParticlesPacket::encode, BounceParticlesPacket::decode, BounceParticlesPacket::handle, Optional.of(NetworkDirection.PLAY_TO_CLIENT));
                  CHANNEL.registerMessage(id++, ExplosionPhysicsPacket.class, ExplosionPhysicsPacket::encode, ExplosionPhysicsPacket::decode, ExplosionPhysicsPacket::handle, Optional.of(NetworkDirection.PLAY_TO_CLIENT));
                  CHANNEL.registerMessage(id++, SyncSettingsPacket.class, SyncSettingsPacket::encode, SyncSettingsPacket::decode, SyncSettingsPacket::handle, Optional.of(NetworkDirection.PLAY_TO_CLIENT));
              }

              public static void sendBlockBreak(ServerLevel level, BlockPos pos, BlockState state, float dx, float dy, float dz) {
                  CHANNEL.send(
                      PacketDistributor.NEAR.with(() -> new PacketDistributor.TargetPoint(pos.getX() + 0.5, pos.getY() + 0.5, pos.getZ() + 0.5, 48.0, level.dimension())),
                      new BlockBreakPacket(pos, Block.getId(state), dx, dy, dz)
                  );
              }

              public static void sendPlaceImpact(ServerLevel level, BlockPos pos, BlockState state) {
                  CHANNEL.send(
                      PacketDistributor.NEAR.with(() -> new PacketDistributor.TargetPoint(pos.getX() + 0.5, pos.getY() + 0.5, pos.getZ() + 0.5, 40.0, level.dimension())),
