name: Build Fluid Physics Mod (1.20.1 Forge)

on:
  push:
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Xmx3G"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Generate Mod Files
        run: |
          mkdir -p src/main/java/com/fluidphysics/physics
          mkdir -p src/main/java/com/fluidphysics/entity
          mkdir -p src/main/java/com/fluidphysics/network
          mkdir -p src/main/java/com/fluidphysics/events
          mkdir -p src/main/java/com/fluidphysics/client
          mkdir -p src/main/resources/META-INF
          mkdir -p src/main/resources/assets/fluidphysics/lang

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3G
          org.gradle.daemon=false
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
            repositories {
              gradlePluginPortal()
              maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
            }
          }
          rootProject.name = 'FluidPhysicsMod'
          EOF

          cat << 'EOF' > build.gradle
          plugins { id 'net.minecraftforge.gradle' version '[6.0.24,6.2)' }
          version = '1.0.0'
          group = 'com.fluidphysics'
          base { archivesName = 'fluidphysics' }
          java.toolchain.languageVersion = JavaLanguageVersion.of(17)
          minecraft { mappings channel: 'official', version: '1.20.1' }
          dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.2.0' }
          jar {
            manifest {
              attributes([
                'Specification-Title': 'fluidphysics',
                'Specification-Vendor': 'FluidPhysicsDev',
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': '1.0.0',
                'Implementation-Vendor': 'FluidPhysicsDev'
              ])
            }
            finalizedBy 'reobfJar'
          }
          tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
          EOF

          cat << 'EOF' > src/main/resources/pack.mcmeta
          {"pack":{"description":"Fluid Physics Mod","pack_format":15}}
          EOF

          cat << 'EOF' > src/main/resources/META-INF/mods.toml
          modLoader="javafml"
          loaderVersion="[47,)"
          license="MIT"
          [[mods]]
          modId="fluidphysics"
          version="1.0.0"
          displayName="Fluid Physics"
          authors="FluidPhysicsDev"
          description='''Real-time 3D rigid-body block physics, free-angle falling blocks, placement impact physics, 3D dropped items, water buoyancy, explosions and player-interactive 3D particles.'''
          [[dependencies.fluidphysics]]
          modId="forge"
          mandatory=true
          versionRange="[47,)"
          ordering="NONE"
          side="BOTH"
          [[dependencies.fluidphysics]]
          modId="minecraft"
          mandatory=true
          versionRange="[1.20.1,1.21)"
          ordering="NONE"
          side="BOTH"
          EOF

          cat << 'EOF' > src/main/resources/assets/fluidphysics/lang/en_us.json
          {"entity.fluidphysics.fluid_block":"Physics Block"}
          EOF

          cat << 'EOF' > src/main/resources/assets/fluidphysics/lang/pt_br.json
          {"entity.fluidphysics.fluid_block":"Bloco Fisico"}
          EOF

          cat << 'EOF' > src/main/java/com/fluidphysics/FluidPhysicsMod.java
          package com.fluidphysics;

          import com.fluidphysics.entity.FluidBlockEntity;
          import com.fluidphysics.events.ServerPhysicsEvents;
          import com.fluidphysics.network.ModNetwork;
          import net.minecraft.world.entity.EntityType;
          import net.minecraft.world.entity.MobCategory;
          import net.minecraftforge.common.MinecraftForge;
          import net.minecraftforge.eventbus.api.IEventBus;
          import net.minecraftforge.fml.common.Mod;
          import net.minecraftforge.fml.event.lifecycle.FMLCommonSetupEvent;
          import net.minecraftforge.fml.javafmlmod.FMLJavaModLoadingContext;
          import net.minecraftforge.registries.DeferredRegister;
          import net.minecraftforge.registries.ForgeRegistries;
          import net.minecraftforge.registries.RegistryObject;

          @Mod(FluidPhysicsMod.MODID)
          public class FluidPhysicsMod {
            public static final String MODID = "fluidphysics";
            public static final DeferredRegister<EntityType<?>> ENTITIES =
              DeferredRegister.create(ForgeRegistries.ENTITY_TYPES, MODID);
            public static final RegistryObject<EntityType<FluidBlockEntity>> FLUID_BLOCK =
              ENTITIES.register("fluid_block", () ->
                EntityType.Builder.<FluidBlockEntity>of(FluidBlockEntity::new, MobCategory.MISC)
                  .sized(0.98F, 0.98F).clientTrackingRange(10).updateInterval(1).build("fluid_block"));

            public FluidPhysicsMod() {
              IEventBus modBus = FMLJavaModLoadingContext.get().getModEventBus();
              ENTITIES.register(modBus);
              modBus.addListener((FMLCommonSetupEvent e) -> e.enqueueWork(ModNetwork::register));
              MinecraftForge.EVENT_BUS.register(new ServerPhysicsEvents());
            }
          }
          EOF

          cat << 'EOF' > src/main/java/com/fluidphysics/physics/PhysicsConfig.java
          package com.fluidphysics.physics;

          import net.minecraft.core.BlockPos;
          import net.minecraft.tags.BlockTags;
          import net.minecraft.world.level.BlockGetter;
          import net.minecraft.world.level.block.Blocks;
          import net.minecraft.world.level.block.FallingBlock;
          import net.minecraft.world.level.block.SoundType;
          import net.minecraft.world.level.block.TntBlock;
          import net.minecraft.world.level.block.state.BlockState;

          public final class PhysicsConfig {
            public static volatile boolean fullGravity = false;
            public static volatile boolean placementPhysics = true;
            public static volatile int qualityLevel = 1; // 0=low, 1=medium, 2=high

            public static int getMaxFragments() { return qualityLevel == 0 ? 110 : (qualityLevel == 2 ? 500 : 250); }
            public static int getMaxParticles() { return qualityLevel == 0 ? 420 : (qualityLevel == 2 ? 2200 : 1100); }
            public static boolean isNaturalGravity(BlockState s) { return s.getBlock() instanceof FallingBlock; }

            public static boolean isSafePhysicsBlock(BlockState s, BlockGetter level, BlockPos pos) {
              if (s == null || s.isAir() || s.hasBlockEntity() || !s.getFluidState().isEmpty()) return false;
              if (s.getDestroySpeed(level, pos) < 0.0F || s.getBlock() instanceof TntBlock) return false;
              return s.isCollisionShapeFullBlock(level, pos);
            }

            public static float getRestitution(BlockState s) {
              SoundType st = s.getSoundType();
              if (st == SoundType.SLIME_BLOCK || s.is(Blocks.SLIME_BLOCK)) return 0.85F;
              if (st == SoundType.HONEY_BLOCK || s.is(Blocks.HONEY_BLOCK)) return 0.05F;
              if (st == SoundType.SAND || st == SoundType.GRAVEL || st == SoundType.SNOW) return 0.14F;
              if (st == SoundType.GRASS || s.is(BlockTags.DIRT)) return 0.18F;
              if (st == SoundType.WOOL) return 0.22F;
              if (st == SoundType.WOOD) return 0.34F;
              if (st == SoundType.METAL || st == SoundType.ANVIL) return 0.36F;
              return 0.28F;
            }

            public static float getFriction(BlockState s) {
              if (s.is(BlockTags.ICE)) return 0.04F;
              SoundType st = s.getSoundType();
              if (st == SoundType.HONEY_BLOCK) return 0.96F;
              if (st == SoundType.GLASS) return 0.32F;
              if (st == SoundType.SAND || st == SoundType.GRAVEL) return 0.68F;
              return 0.56F;
            }

            public static float getBuoyancy(BlockState s) {
              SoundType st = s.getSoundType();
              if (s.is(BlockTags.LOGS) || s.is(BlockTags.PLANKS) || s.is(BlockTags.LEAVES) ||
                  s.is(BlockTags.WOOL) || s.is(BlockTags.ICE) || st == SoundType.WOOD ||
                  st == SoundType.WOOL || s.is(Blocks.SPONGE) || s.is(Blocks.HAY_BLOCK)) return 1.65F;
              if (st == SoundType.SLIME_BLOCK || st == SoundType.SNOW) return 1.25F;
              if (st == SoundType.METAL || st == SoundType.ANVIL || s.is(Blocks.OBSIDIAN)) return 0.30F;
              return 0.55F;
            }

            public static float getMass(BlockState s) {
              SoundType st = s.getSoundType();
              if (st == SoundType.ANVIL || s.is(BlockTags.ANVIL) || s.is(Blocks.OBSIDIAN)) return 3.2F;
              if (st == SoundType.METAL) return 2.4F;
              if (st == SoundType.STONE) return 1.8F;
              if (st == SoundType.WOOD) return 0.9F;
              if (st == SoundType.WOOL || s.is(BlockTags.LEAVES) || st == SoundType.SNOW) return 0.55F;
              return 1.2F;
            }

            public static boolean isTintedParticleBlock(BlockState s) {
              return s.is(BlockTags.LEAVES) || s.is(Blocks.GRASS) || s.is(Blocks.TALL_GRASS) ||
                s.is(Blocks.FERN) || s.is(Blocks.LARGE_FERN) || s.is(Blocks.VINE) || s.is(Blocks.LILY_PAD);
            }
          }
          EOF

          cat << 'EOF' > src/main/java/com/fluidphysics/physics/OBBPhysicsSolver.java
          package com.fluidphysics.physics;

          import net.minecraft.core.BlockPos;
          import net.minecraft.util.Mth;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.level.block.state.BlockState;
          import net.minecraft.world.level.material.FluidState;
          import net.minecraft.world.phys.AABB;
          import net.minecraft.world.phys.Vec3;
          import net.minecraft.world.phys.shapes.Shapes;
          import net.minecraft.world.phys.shapes.VoxelShape;
          import org.joml.Quaternionf;
          import org.joml.Vector3f;
          import java.util.List;

          public final class OBBPhysicsSolver {
            public static class RigidBody {
              public double x, y, z;
              public float vx, vy, vz, wx, wy, wz;
              public final Quaternionf rot = new Quaternionf();
              public float hx = 0.5F, hy = 0.5F, hz = 0.5F;
              public float mass = 1.0F, restitution = 0.28F, friction = 0.55F, buoyancy = 0.6F;
              public boolean onGround = false, inWater = false, highPrecision = false;
              public float lastImpactSpeed = 0.0F;
            }

            private static final int MAX_C = 24;

            public static void step(Level level, RigidBody b, float dt) {
              b.lastImpactSpeed = 0.0F;
              b.onGround = false;
              float subDt = dt * 0.5F;
              BlockPos.MutableBlockPos mp = new BlockPos.MutableBlockPos();
              BlockPos.MutableBlockPos np = new BlockPos.MutableBlockPos();
              float[] cRx = new float[MAX_C], cRy = new float[MAX_C], cRz = new float[MAX_C];
              float[] cNx = new float[MAX_C], cNy = new float[MAX_C], cNz = new float[MAX_C], cPen = new float[MAX_C];
              Vector3f lv = new Vector3f();
              Quaternionf dq = new Quaternionf(), nq = new Quaternionf();
              float invM = 1.0F / Math.max(0.2F, b.mass);
              float invI = 3.2F / (Math.max(0.2F, b.mass) * (b.hx * b.hx + b.hy * b.hy + b.hz * b.hz));

              for (int s = 0; s < 2; s++) {
                mp.set(Mth.floor(b.x), Mth.floor(b.y), Mth.floor(b.z));
                FluidState fl = level.getFluidState(mp);
                if (!fl.isEmpty()) {
                  b.inWater = true;
                  double surfY = mp.getY() + fl.getHeight(level, mp);
                  float sub = Mth.clamp((float) (surfY - (b.y - b.hy)) / (2.0F * b.hy), 0.0F, 1.0F);
                  b.vy += (-0.04F + 0.04F * b.buoyancy * sub) * subDt;
                  Vec3 flow = fl.getFlow(level, mp);
                  b.vx += (float) flow.x * 0.018F * subDt;
                  b.vz += (float) flow.z * 0.018F * subDt;
                  if (sub > 0.1F && sub < 0.95F) {
                    float w = (float) Math.sin(b.x * 1.7 + b.z * 1.3 + level.getGameTime() * 0.12) * 0.008F;
                    b.wx += w * subDt;
                    b.wz -= w * 0.7F * subDt;
                  }
                  float ld = (float) Math.pow(0.84, subDt), ad = (float) Math.pow(0.80, subDt);
                  b.vx *= ld; b.vy *= ld; b.vz *= ld; b.wx *= ad; b.wy *= ad; b.wz *= ad;
                } else {
                  b.inWater = false;
                  b.vy -= 0.04F * subDt;
                  float ld = (float) Math.pow(0.993, subDt), ad = (float) Math.pow(0.986, subDt);
                  b.vx *= ld; b.vy *= ld; b.vz *= ld; b.wx *= ad; b.wy *= ad; b.wz *= ad;
                }

                b.x += b.vx * subDt; b.y += b.vy * subDt; b.z += b.vz * subDt;

                float wMag = (float) Math.sqrt(b.wx * b.wx + b.wy * b.wy + b.wz * b.wz);
                if (wMag > 1e-5F) {
                  dq.fromAxisAngleRad(b.wx / wMag, b.wy / wMag, b.wz / wMag, wMag * subDt);
                  dq.mul(b.rot, nq);
                  b.rot.set(nq).normalize();
                }

                int nc = 0;
                int pts = b.highPrecision ? 14 : 8;
                for (int i = 0; i < pts && nc < MAX_C; i++) {
                  float lx, ly, lz;
                  if (i < 8) {
                    lx = (i & 1) == 0 ? -b.hx : b.hx;
                    ly = (i & 2) == 0 ? -b.hy : b.hy;
                    lz = (i & 4) == 0 ? -b.hz : b.hz;
                  } else {
                    int f = i - 8;
                    lx = f == 0 ? b.hx : (f == 1 ? -b.hx : 0);
                    ly = f == 2 ? b.hy : (f == 3 ? -b.hy : 0);
                    lz = f == 4 ? b.hz : (f == 5 ? -b.hz : 0);
                  }
                  lv.set(lx, ly, lz);
                  b.rot.transform(lv);
                  double px = b.x + lv.x, py = b.y + lv.y, pz = b.z + lv.z;
                  int bx = Mth.floor(px), by = Mth.floor(py), bz = Mth.floor(pz);
                  mp.set(bx, by, bz);
                  BlockState bs = level.getBlockState(mp);
                  if (bs.isAir()) continue;
                  VoxelShape sh = bs.getCollisionShape(level, mp);
                  if (sh.isEmpty()) continue;
                  if (sh == Shapes.block()) {
                    nc = testBox(level, np, bx, by, bz, bx, by, bz, bx + 1.0, by + 1.0, bz + 1.0,
                      px, py, pz, lv.x, lv.y, lv.z, cRx, cRy, cRz, cNx, cNy, cNz, cPen, nc);
                  } else {
                    List<AABB> boxes = sh.toAabbs();
                    for (int k = 0; k < boxes.size() && nc < MAX_C; k++) {
                      AABB a = boxes.get(k);
                      nc = testBox(level, np, bx, by, bz, bx + a.minX, by + a.minY, bz + a.minZ,
                        bx + a.maxX, by + a.maxY, bz + a.maxZ, px, py, pz, lv.x, lv.y, lv.z,
                        cRx, cRy, cRz, cNx, cNy, cNz, cPen, nc);
                    }
                  }
                }

                if (nc > 0) {
                  float pPX = 0, pNX = 0, pPY = 0, pNY = 0, pPZ = 0, pNZ = 0;
                  for (int c = 0; c < nc; c++) {
                    float pen = cPen[c], nx = cNx[c], ny = cNy[c], nz = cNz[c];
                    if (nx > 0.5F) pPX = Math.max(pPX, pen); else if (nx < -0.5F) pNX = Math.max(pNX, pen);
                    if (ny > 0.5F) { pPY = Math.max(pPY, pen); b.onGround = true; } else if (ny < -0.5F) pNY = Math.max(pNY, pen);
                    if (nz > 0.5F) pPZ = Math.max(pPZ, pen); else if (nz < -0.5F) pNZ = Math.max(pNZ, pen);
                  }
                  b.x += (pPX - pNX) * 0.82;
                  b.y += (pPY - pNY) * 0.85;
                  b.z += (pPZ - pNZ) * 0.82;

                  int iters = nc > 1 ? 2 : 1;
                  float relax = nc > 3 ? 0.62F : 0.85F;
                  for (int it = 0; it < iters; it++) {
                    for (int c = 0; c < nc; c++) {
                      float rx = cRx[c], ry = cRy[c], rz = cRz[c], nx = cNx[c], ny = cNy[c], nz = cNz[c];
                      float vcx = b.vx + (b.wy * rz - b.wz * ry);
                      float vcy = b.vy + (b.wz * rx - b.wx * rz);
                      float vcz = b.vz + (b.wx * ry - b.wy * rx);
                      float vn = vcx * nx + vcy * ny + vcz * nz;
                      if (vn >= 0.0F) continue;
                      if (-vn > b.lastImpactSpeed) b.lastImpactSpeed = -vn;

                      float e = (-vn > 0.09F) ? b.restitution : 0.0F;
                      float rcnX = ry * nz - rz * ny, rcnY = rz * nx - rx * nz, rcnZ = rx * ny - ry * nx;
                      float denom = invM + (rcnX * rcnX + rcnY * rcnY + rcnZ * rcnZ) * invI;
                      float j = (-(1.0F + e) * vn / denom) * relax;
                      float jx = nx * j, jy = ny * j, jz = nz * j;
                      b.vx += jx * invM; b.vy += jy * invM; b.vz += jz * invM;
                      b.wx += (ry * jz - rz * jy) * invI;
                      b.wy += (rz * jx - rx * jz) * invI;
                      b.wz += (rx * jy - ry * jx) * invI;

                      vcx = b.vx + (b.wy * rz - b.wz * ry);
                      vcy = b.vy + (b.wz * rx - b.wx * rz);
                      vcz = b.vz + (b.wx * ry - b.wy * rx);
                      float vn2 = vcx * nx + vcy * ny + vcz * nz;
                      float vtx = vcx - nx * vn2, vty = vcy - ny * vn2, vtz = vcz - nz * vn2;
                      float vtSq = vtx * vtx + vty * vty + vtz * vtz;
                      if (vtSq > 1e-6F) {
                        float vtM = (float) Math.sqrt(vtSq);
                        float tx = vtx / vtM, ty = vty / vtM, tz = vtz / vtM;
                        float rctX = ry * tz - rz * ty, rctY = rz * tx - rx * tz, rctZ = rx * ty - ry * tx;
                        float denomT = invM + (rctX * rctX + rctY * rctY + rctZ * rctZ) * invI;
                        float jt = Mth.clamp((-vtM / denomT) * relax, -j * b.friction, j * b.friction);
                        float fx = tx * jt, fy = ty * jt, fz = tz * jt;
                        b.vx += fx * invM; b.vy += fy * invM; b.vz += fz * invM;
                        b.wx += (ry * fz - rz * fy) * invI;
                        b.wy += (rz * fx - rx * fz) * invI;
                        b.wz += (rx * fy - ry * fx) * invI;
                      }
                    }
                  }
                }

                if (b.onGround && (b.vx * b.vx + b.vy * b.vy + b.vz * b.vz) < 0.0012F &&
                    (b.wx * b.wx + b.wy * b.wy + b.wz * b.wz) < 0.0025F) {
                  b.vx *= 0.80F; b.vz *= 0.80F; b.wx *= 0.78F; b.wy *= 0.78F; b.wz *= 0.78F;
                }
                sanitize(b);
              }
            }

            private static int testBox(Level lvl, BlockPos.MutableBlockPos np, int bx, int by, int bz,
                double minX, double minY, double minZ, double maxX, double maxY, double maxZ,
                double px, double py, double pz, float rx, float ry, float rz,
                float[] cRx, float[] cRy, float[] cRz, float[] cNx, float[] cNy, float[] cNz, float[] cPen, int nc) {
              if (px <= minX || px >= maxX || py <= minY || py >= maxY || pz <= minZ || pz >= maxZ) return nc;
              float best = Float.MAX_VALUE, nx = 0, ny = 1, nz = 0;
              float d = (float) (maxY - py); if (d < best && !solid(lvl, np, bx, by + 1, bz)) { best = d; nx = 0; ny = 1; nz = 0; }
              d = (float) (py - minY); if (d < best && !solid(lvl, np, bx, by - 1, bz)) { best = d; nx = 0; ny = -1; nz = 0; }
              d = (float) (maxX - px); if (d < best && !solid(lvl, np, bx + 1, by, bz)) { best = d; nx = 1; ny = 0; nz = 0; }
              d = (float) (px - minX); if (d < best && !solid(lvl, np, bx - 1, by, bz)) { best = d; nx = -1; ny = 0; nz = 0; }
              d = (float) (maxZ - pz); if (d < best && !solid(lvl, np, bx, by, bz + 1)) { best = d; nx = 0; ny = 0; nz = 1; }
              d = (float) (pz - minZ); if (d < best && !solid(lvl, np, bx, by, bz - 1)) { best = d; nx = 0; ny = 0; nz = -1; }
              if (best == Float.MAX_VALUE) { best = (float) (maxY - py); nx = 0; ny = 1; nz = 0; }
              cRx[nc] = rx; cRy[nc] = ry; cRz[nc] = rz;
              cNx[nc] = nx; cNy[nc] = ny; cNz[nc] = nz;
              cPen[nc] = Math.min(best, 0.35F);
              return nc + 1;
            }

            private static boolean solid(Level lvl, BlockPos.MutableBlockPos p, int x, int y, int z) {
              p.set(x, y, z);
              BlockState s = lvl.getBlockState(p);
              return !s.isAir() && s.getCollisionShape(lvl, p) == Shapes.block();
            }

            private static void sanitize(RigidBody b) {
              if (!Float.isFinite(b.vx)) b.vx = 0; if (!Float.isFinite(b.vy)) b.vy = 0; if (!Float.isFinite(b.vz)) b.vz = 0;
              if (!Float.isFinite(b.wx)) b.wx = 0; if (!Float.isFinite(b.wy)) b.wy = 0; if (!Float.isFinite(b.wz)) b.wz = 0;
              b.vx = Mth.clamp(b.vx, -2.5F, 2.5F); b.vy = Mth.clamp(b.vy, -2.5F, 2.5F); b.vz = Mth.clamp(b.vz, -2.5F, 2.5F);
              b.wx = Mth.clamp(b.wx, -1.15F, 1.15F); b.wy = Mth.clamp(b.wy, -1.15F, 1.15F); b.wz = Mth.clamp(b.wz, -1.15F, 1.15F);
              if (!Float.isFinite(b.rot.w)) b.rot.identity();
            }
          }
          EOF

          cat << 'EOF' > src/main/java/com/fluidphysics/entity/FluidBlockEntity.java
          package com.fluidphysics.entity;

          import com.fluidphysics.FluidPhysicsMod;
          import com.fluidphysics.network.ModNetwork;
          import com.fluidphysics.physics.OBBPhysicsSolver;
          import com.fluidphysics.physics.PhysicsConfig;
          import net.minecraft.core.BlockPos;
          import net.minecraft.core.registries.Registries;
          import net.minecraft.nbt.CompoundTag;
          import net.minecraft.nbt.NbtUtils;
          import net.minecraft.network.protocol.Packet;
          import net.minecraft.network.protocol.game.ClientGamePacketListener;
          import net.minecraft.network.syncher.EntityDataAccessor;
          import net.minecraft.network.syncher.EntityDataSerializers;
          import net.minecraft.network.syncher.SynchedEntityData;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.sounds.SoundSource;
          import net.minecraft.util.Mth;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.entity.EntityType;
          import net.minecraft.world.entity.LivingEntity;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.level.block.Block;
          import net.minecraft.world.level.block.Blocks;
          import net.minecraft.world.level.block.SoundType;
          import net.minecraft.world.level.block.state.BlockState;
          import net.minecraft.world.phys.Vec3;
          import net.minecraftforge.network.NetworkHooks;
          import org.joml.Quaternionf;
          import java.util.List;

          public class FluidBlockEntity extends Entity {
            public static final int MODE_FALLING = 0;
            public static final int MODE_PLACEMENT_SETTLE = 1;
            public static final int MODE_EXPLOSION_DEBRIS = 2;

            private static final EntityDataAccessor<Integer> D_BLOCK = SynchedEntityData.defineId(FluidBlockEntity.class, EntityDataSerializers.INT);
            private static final EntityDataAccessor<Float> D_QX = SynchedEntityData.defineId(FluidBlockEntity.class, EntityDataSerializers.FLOAT);
            private static final EntityDataAccessor<Float> D_QY = SynchedEntityData.defineId(FluidBlockEntity.class, EntityDataSerializers.FLOAT);
            private static final EntityDataAccessor<Float> D_QZ = SynchedEntityData.defineId(FluidBlockEntity.class, EntityDataSerializers.FLOAT);
            private static final EntityDataAccessor<Float> D_QW = SynchedEntityData.defineId(FluidBlockEntity.class, EntityDataSerializers.FLOAT);
            private static final EntityDataAccessor<Integer> D_MODE = SynchedEntityData.defineId(FluidBlockEntity.class, EntityDataSerializers.INT);
            private static final EntityDataAccessor<BlockPos> D_TARGET = SynchedEntityData.defineId(FluidBlockEntity.class, EntityDataSerializers.BLOCK_POS);

            public final OBBPhysicsSolver.RigidBody body = new OBBPhysicsSolver.RigidBody();
            private boolean dropItem = true, settleAsBlock = true;
            private int age = 0, restTicks = 0, bounceCd = 0;
            private double sOffX, sOffY, sOffZ;
            private float tiltAx = 1.0F, tiltAz = 0.0F, startTilt = 0.35F;

            private final Quaternionf prevQ = new Quaternionf(), currQ = new Quaternionf();
            private boolean qInit = false;
            private double lX, lY, lZ;
            private int lSteps = 0;

            public FluidBlockEntity(EntityType<? extends FluidBlockEntity> type, Level level) {
              super(type, level);
              this.body.hx = 0.50F; this.body.hy = 0.50F; this.body.hz = 0.50F;
              this.body.highPrecision = true;
            }

            public static FluidBlockEntity createFalling(ServerLevel lvl, double cx, double cy, double cz, BlockState st, Vec3 vel, Vec3 ang, boolean drop) {
              FluidBlockEntity e = new FluidBlockEntity(FluidPhysicsMod.FLUID_BLOCK.get(), lvl);
              e.setBlockState(st); e.setMode(MODE_FALLING); e.dropItem = drop; e.settleAsBlock = true;
              e.initBody(cx, cy, cz, vel, ang, st); e.syncBody();
              return e;
            }

            public static FluidBlockEntity createPlacementSettle(ServerLevel lvl, BlockPos target, BlockState st, Vec3 offset) {
              FluidBlockEntity e = new FluidBlockEntity(FluidPhysicsMod.FLUID_BLOCK.get(), lvl);
              e.setBlockState(st); e.setMode(MODE_PLACEMENT_SETTLE); e.setTargetPos(target);
              e.dropItem = true; e.settleAsBlock = true;
              e.sOffX = offset.x; e.sOffY = offset.y; e.sOffZ = offset.z;
              float dir = lvl.random.nextFloat() * ((float) Math.PI * 2.0F);
              e.tiltAx = Mth.cos(dir); e.tiltAz = Mth.sin(dir);
              e.startTilt = 0.24F + lvl.random.nextFloat() * 0.22F;
              e.body.x = target.getX() + 0.5 + e.sOffX;
              e.body.y = target.getY() + 0.5 + e.sOffY;
              e.body.z = target.getZ() + 0.5 + e.sOffZ;
              e.body.rot.fromAxisAngleRad(e.tiltAx, 0.12F, e.tiltAz, e.startTilt).normalize();
              e.syncBody();
              return e;
            }

            public static FluidBlockEntity createExplosionDebris(ServerLevel lvl, double cx, double cy, double cz, BlockState st, Vec3 vel, Vec3 ang, boolean settle) {
              FluidBlockEntity e = new FluidBlockEntity(FluidPhysicsMod.FLUID_BLOCK.get(), lvl);
              e.setBlockState(st); e.setMode(MODE_EXPLOSION_DEBRIS); e.dropItem = false; e.settleAsBlock = settle;
              e.initBody(cx, cy, cz, vel, ang, st); e.syncBody();
              return e;
            }

            private void initBody(double cx, double cy, double cz, Vec3 vel, Vec3 ang, BlockState st) {
              body.x = cx; body.y = cy; body.z = cz;
              body.vx = (float) vel.x; body.vy = (float) vel.y; body.vz = (float) vel.z;
              body.wx = (float) ang.x; body.wy = (float) ang.y; body.wz = (float) ang.z;
              body.mass = PhysicsConfig.getMass(st);
              body.restitution = PhysicsConfig.getRestitution(st);
              body.friction = PhysicsConfig.getFriction(st);
              body.buoyancy = PhysicsConfig.getBuoyancy(st);
              body.rot.identity();
            }

            private void syncBody() {
              this.setPos(body.x, body.y - 0.5, body.z);
              this.setDeltaMovement(body.vx, body.vy, body.vz);
              this.entityData.set(D_QX, body.rot.x);
              this.entityData.set(D_QY, body.rot.y);
              this.entityData.set(D_QZ, body.rot.z);
              this.entityData.set(D_QW, body.rot.w);
            }

            @Override
            protected void defineSynchedData() {
              this.entityData.define(D_BLOCK, Block.getId(Blocks.SAND.defaultBlockState()));
              this.entityData.define(D_QX, 0.0F); this.entityData.define(D_QY, 0.0F);
              this.entityData.define(D_QZ, 0.0F); this.entityData.define(D_QW, 1.0F);
              this.entityData.define(D_MODE, MODE_FALLING);
              this.entityData.define(D_TARGET, BlockPos.ZERO);
            }

            public BlockState getBlockState() {
              BlockState s = Block.stateById(this.entityData.get(D_BLOCK));
              return s.isAir() ? Blocks.SAND.defaultBlockState() : s;
            }
            public void setBlockState(BlockState s) { this.entityData.set(D_BLOCK, Block.getId(s)); }
            public int getMode() { return this.entityData.get(D_MODE); }
            public void setMode(int m) { this.entityData.set(D_MODE, m); }
            public BlockPos getTargetPos() { return this.entityData.get(D_TARGET); }
            public void setTargetPos(BlockPos p) { this.entityData.set(D_TARGET, p); }

            public Quaternionf getInterpolatedOrientation(float pt) {
              return prevQ.slerp(currQ, pt, new Quaternionf()).normalize();
            }

            @Override
            public void lerpTo(double x, double y, double z, float yRot, float xRot, int steps, boolean tp) {
              this.lX = x; this.lY = y; this.lZ = z; this.lSteps = Math.max(1, Math.min(steps, 3));
            }

            @Override
            public void tick() {
              super.tick();
              this.age++;
              if (this.level().isClientSide()) {
                this.xo = this.getX(); this.yo = this.getY(); this.zo = this.getZ();
                if (this.lSteps > 0) {
                  this.setPos(getX() + (lX - getX()) / lSteps, getY() + (lY - getY()) / lSteps, getZ() + (lZ - getZ()) / lSteps);
                  this.lSteps--;
                }
                this.prevQ.set(this.currQ);
                this.currQ.set(entityData.get(D_QX), entityData.get(D_QY), entityData.get(D_QZ), entityData.get(D_QW)).normalize();
                if (!this.qInit) { this.prevQ.set(this.currQ); this.qInit = true; }
                return;
              }
              ServerLevel sLvl = (ServerLevel) this.level();
              if (this.getY() < sLvl.getMinBuildHeight() - 16) { this.discard(); return; }
              if (getMode() == MODE_PLACEMENT_SETTLE) tickPlace(sLvl); else tickPhysics(sLvl, getMode());
            }

            private void tickPlace(ServerLevel sLvl) {
              BlockPos target = getTargetPos();
              float t = Mth.clamp(this.age / 5.0F, 0.0F, 1.0F);
              float rem = (1.0F - t) * (1.0F - t) * (1.0F - t);
              float wobble = (float) Math.exp(-t * 3.5) * Mth.cos(t * 9.0F);
              body.x = target.getX() + 0.5 + sOffX * rem;
              body.y = target.getY() + 0.5 + sOffY * rem;
              body.z = target.getZ() + 0.5 + sOffZ * rem;
              float ang = startTilt * wobble;
              if (Math.abs(ang) > 0.002F) body.rot.fromAxisAngleRad(tiltAx, 0.1F, tiltAz, ang).normalize();
              else body.rot.identity();
              syncBody();
              if (this.age >= 5) {
                BlockState st = getBlockState();
                if (sLvl.getBlockState(target).canBeReplaced()) {
                  sLvl.setBlock(target, st, 3);
                  sLvl.playSound(null, target.getX() + 0.5, target.getY() + 0.5, target.getZ() + 0.5,
                    st.getSoundType().getPlaceSound(), SoundSource.BLOCKS, 0.85F, 0.92F + sLvl.random.nextFloat() * 0.16F);
                  ModNetwork.sendPlaceImpact(sLvl, target, st);
                } else if (dropItem) {
                  Block.popResource(sLvl, target, new ItemStack(st.getBlock()));
                }
                this.discard();
              }
            }

            private void tickPhysics(ServerLevel sLvl, int mode) {
              BlockState st = getBlockState();
              if (bounceCd > 0) bounceCd--;
              body.mass = PhysicsConfig.getMass(st);
              body.restitution = PhysicsConfig.getRestitution(st);
              body.friction = PhysicsConfig.getFriction(st);
              body.buoyancy = PhysicsConfig.getBuoyancy(st);

              OBBPhysicsSolver.step(sLvl, body, 1.0F);

              if (body.lastImpactSpeed > 0.22F && bounceCd == 0) {
                bounceCd = 3;
                sLvl.playSound(null, body.x, body.y, body.z, st.getSoundType().getFallSound(), SoundSource.BLOCKS,
                  Mth.clamp(body.lastImpactSpeed * 1.1F, 0.25F, 1.1F), 0.82F + sLvl.random.nextFloat() * 0.28F);
                ModNetwork.sendBounce(sLvl, body.x, body.y - 0.35, body.z, st, body.lastImpactSpeed);
                if (mode == MODE_EXPLOSION_DEBRIS && !settleAsBlock && body.lastImpactSpeed > 0.52F) {
                  ModNetwork.sendBreak(sLvl, BlockPos.containing(body.x, body.y, body.z), st, body.vx, body.vy, body.vz);
                  this.discard();
                  return;
                }
              }

              List<Entity> near = sLvl.getEntities(this, this.getBoundingBox().inflate(0.28), e -> e instanceof LivingEntity && e.isAlive());
              float speed = (float) Math.sqrt(body.vx * body.vx + body.vy * body.vy + body.vz * body.vz);
              for (Entity ent : near) {
                Vec3 ev = ent.getDeltaMovement();
                double dx = body.x - ent.getX(), dy = body.y - (ent.getY() + ent.getBbHeight() * 0.5), dz = body.z - ent.getZ();
                double d2 = dx * dx + dy * dy + dz * dz;
                if (d2 < 0.001) continue;
                double dist = Math.sqrt(d2);
                if (speed > 0.45F && body.vy < -0.25F && body.mass >= 1.5F && age > 4) {
                  float dmg = Mth.clamp(speed * body.mass * 3.8F, 2.0F, 18.0F);
                  ent.hurt(st.getSoundType() == SoundType.ANVIL ? damageSources().anvil(this) : damageSources().fallingBlock(this), dmg);
                  body.vy = Math.abs(body.vy) * 0.35F + 0.12F;
                  body.wx += (sLvl.random.nextFloat() - 0.5F) * 0.5F;
                  body.wz += (sLvl.random.nextFloat() - 0.5F) * 0.5F;
                } else if (ev.length() > 0.04) {
                  float push = (float) Math.min(0.45, ev.length() * 0.85 + 0.08);
                  body.vx += (float) ((dx / dist) * push + ev.x * 0.55);
                  body.vy += 0.06F;
                  body.vz += (float) ((dz / dist) * push + ev.z * 0.55);
                  body.wx += (float) (-(dz / dist) * push * 0.9);
                  body.wz += (float) ((dx / dist) * push * 0.9);
                  restTicks = 0;
                }
              }

              float angSp = (float) Math.sqrt(body.wx * body.wx + body.wy * body.wy + body.wz * body.wz);
              if (body.onGround && speed < 0.055F && angSp < 0.065F) {
                restTicks++;
                if (settleAsBlock && restTicks >= 9) body.rot.slerp(new Quaternionf(), 0.32F).normalize();
              } else {
                restTicks = 0;
              }
              syncBody();

              if (restTicks >= 15 || age >= (mode == MODE_EXPLOSION_DEBRIS ? 140 : 220)) {
                BlockPos bp = BlockPos.containing(body.x, body.y, body.z);
                if (settleAsBlock) {
                  if (!sLvl.getBlockState(bp).canBeReplaced() && sLvl.getBlockState(bp.above()).canBeReplaced()) bp = bp.above();
                  if (sLvl.getBlockState(bp).canBeReplaced()) {
                    sLvl.setBlock(bp, st, 3);
                    sLvl.playSound(null, bp.getX() + 0.5, bp.getY() + 0.5, bp.getZ() + 0.5, st.getSoundType().getPlaceSound(), SoundSource.BLOCKS, 0.8F, 0.95F);
                    ModNetwork.sendPlaceImpact(sLvl, bp, st);
                  } else if (dropItem) {
                    Block.popResource(sLvl, bp, new ItemStack(st.getBlock()));
                  } else {
                    ModNetwork.sendBreak(sLvl, bp, st, 0, 0.1F, 0);
                  }
                } else {
                  ModNetwork.sendBreak(sLvl, bp, st, body.vx, 0.15F, body.vz);
                }
                this.discard();
              }
            }

            public void wakeUp() { this.restTicks = 0; this.body.onGround = false; }
            @Override public boolean isPickable() { return false; }
            @Override public boolean isAttackable() { return false; }
            @Override public boolean shouldRenderAtSqrDistance(double d) { return d < 128.0 * 128.0; }

            @Override
            protected void readAdditionalSaveData(CompoundTag tag) {
              if (tag.contains("BlockState")) setBlockState(NbtUtils.readBlockState(this.level().holderLookup(Registries.BLOCK), tag.getCompound("BlockState")));
              setMode(tag.getInt("Mode"));
              if (tag.contains("TargetPos")) setTargetPos(NbtUtils.readBlockPos(tag.getCompound("TargetPos")));
              dropItem = !tag.contains("DropItem") || tag.getBoolean("DropItem");
              settleAsBlock = !tag.contains("Settle") || tag.getBoolean("Settle");
              age = tag.getInt("Age");
              body.x = getX(); body.y = getY() + 0.5; body.z = getZ();
              body.vx = (float) getDeltaMovement().x; body.vy = (float) getDeltaMovement().y; body.vz = (float) getDeltaMovement().z;
              body.wx = tag.getFloat("Wx"); body.wy = tag.getFloat("Wy"); body.wz = tag.getFloat("Wz");
              if (tag.contains("Qw")) body.rot.set(tag.getFloat("Qx"), tag.getFloat("Qy"), tag.getFloat("Qz"), tag.getFloat("Qw")).normalize();
              syncBody();
            }

            @Override
            protected void addAdditionalSaveData(CompoundTag tag) {
              tag.put("BlockState", NbtUtils.writeBlockState(getBlockState()));
              tag.putInt("Mode", getMode());
              tag.put("TargetPos", NbtUtils.writeBlockPos(getTargetPos()));
              tag.putBoolean("DropItem", dropItem); tag.putBoolean("Settle", settleAsBlock);
              tag.putInt("Age", age);
              tag.putFloat("Wx", body.wx); tag.putFloat("Wy", body.wy); tag.putFloat("Wz", body.wz);
              tag.putFloat("Qx", body.rot.x); tag.putFloat("Qy", body.rot.y); tag.putFloat("Qz", body.rot.z); tag.putFloat("Qw", body.rot.w);
            }

            @Override public Packet<ClientGamePacketListener> getAddEntityPacket() { return NetworkHooks.getEntitySpawningPacket(this); }
          }
