                  body.y = cy;
                  body.z = cz;
                  body.vx = (float) vel.x;
                  body.vy = (float) vel.y;
                  body.vz = (float) vel.z;
                  body.wx = (float) angVel.x;
                  body.wy = (float) angVel.y;
                  body.wz = (float) angVel.z;
                  body.mass = PhysicsConfig.getMass(state);
                  body.restitution = PhysicsConfig.getRestitution(state);
                  body.friction = PhysicsConfig.getFriction(state);
                  body.buoyancy = PhysicsConfig.getBuoyancy(state);
                  body.rot.identity();
              }

              private void syncBodyToEntity() {
                  this.setPos(body.x, body.y - 0.5, body.z);
                  this.setDeltaMovement(body.vx, body.vy, body.vz);
                  this.entityData.set(DATA_QX, body.rot.x);
                  this.entityData.set(DATA_QY, body.rot.y);
                  this.entityData.set(DATA_QZ, body.rot.z);
                  this.entityData.set(DATA_QW, body.rot.w);
