          cat << 'EOF' > src/main/java/com/fluidphysics/client/FluidBlockRenderer.java
          package com.fluidphysics.client;

          import com.fluidphysics.entity.FluidBlockEntity;
          import com.mojang.blaze3d.vertex.PoseStack;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.renderer.MultiBufferSource;
          import net.minecraft.client.renderer.block.BlockRenderDispatcher;
          import net.minecraft.client.renderer.entity.EntityRenderer;
          import net.minecraft.client.renderer.entity.EntityRendererProvider;
          import net.minecraft.client.renderer.texture.OverlayTexture;
          import net.minecraft.client.renderer.texture.TextureAtlas;
          import net.minecraft.resources.ResourceLocation;
          import net.minecraft.world.level.block.state.BlockState;
          import org.joml.Quaternionf;

          public class FluidBlockRenderer extends EntityRenderer<FluidBlockEntity> {

              public FluidBlockRenderer(EntityRendererProvider.Context context) {
                  super(context);
                  this.shadowRadius = 0.45F;
              }

              @Override
              public void render(
                  FluidBlockEntity entity, float entityYaw, float partialTick,
                  PoseStack poseStack, MultiBufferSource buffer, int packedLight
              ) {
                  BlockState state = entity.getBlockState();
                  if (state.isAir()) return;

                  poseStack.pushPose();
                  poseStack.translate(0.0, 0.5, 0.0);
                  Quaternionf orientation = entity.getInterpolatedOrientation(partialTick);
                  poseStack.mulPose(orientation);
                  poseStack.translate(-0.5, -0.5, -0.5);

                  BlockRenderDispatcher dispatcher = Minecraft.getInstance().getBlockRenderer();
                  dispatcher.renderSingleBlock(state, poseStack, buffer, packedLight, OverlayTexture.NO_OVERLAY);
                  poseStack.popPose();

                  super.render(entity, entityYaw, partialTick, poseStack, buffer, packedLight);
              }

              @Override
              public ResourceLocation getTextureLocation(FluidBlockEntity entity) {
                  return TextureAtlas.LOCATION_BLOCKS;
              }
          }
