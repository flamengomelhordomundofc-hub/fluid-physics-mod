                  this.entityData.define(DATA_QY, 0.0F);
                  this.entityData.define(DATA_QZ, 0.0F);
                  this.entityData.define(DATA_QW, 1.0F);
                  this.entityData.define(DATA_MODE, MODE_FALLING);
