              public static class PhysicalItem extends Item {
                  public PhysicalItem(Properties p) {
                      super(p);
                  }

                  @Override
                  public InteractionResult useOn(UseOnContext ctx) {
                      Level l = ctx.getLevel();
                      if (l.isClientSide()) return InteractionResult.SUCCESS;
                      ServerLevel s = (ServerLevel) l;
                      BlockPos pos = ctx.getClickedPos();
                      BlockState st = s.getBlockState(pos);
                      if (!FPMod.safe(st, s, pos)) return InteractionResult.FAIL;
                      s.setBlock(pos, Blocks.AIR.defaultBlockState(), 3);
                      Direction f = ctx.getClickedFace().getOpposite();
                      Vec3 vel = new Vec3(
                          f.getStepX() * 0.06 + (s.random.nextDouble() - 0.5) * 0.08,
                          -0.02 + (s.random.nextDouble() * 0.05),
                          f.getStepZ() * 0.06 + (s.random.nextDouble() - 0.5) * 0.08
                      );
                      Vec3 ang = new Vec3(
                          (s.random.nextDouble() - 0.5) * 0.42,
                          (s.random.nextDouble() - 0.5) * 0.30,
                          (s.random.nextDouble() - 0.5) * 0.42
                      );
                      List<FPBlockEntity.Part> one = List.of(new FPBlockEntity.Part(0, 0, 0, st));
                      s.addFreshEntity(FPBlockEntity.spawn(s, pos.getX() + 0.5, pos.getY() + 0.5, pos.getZ() + 0.5, one, vel, ang, true, true, false));
                      s.playSound(null, pos.getX() + 0.5, pos.getY() + 0.5, pos.getZ() + 0.5, SoundEvents.AMETHYST_BLOCK_CHIME, SoundSource.PLAYERS, 1.0F, 1.15F);
                      FPMod.sendBnc(s, pos.getX() + 0.5, pos.getY() + 0.5, pos.getZ() + 0.5, st, 0.85F, 1);
                      if (ctx.getPlayer() != null) {
                          ctx.getPlayer().displayClientMessage(Component.literal("Physical: Fisica real ativada! (Bata para lancar, Agache+Bata para quebrar)"), true);
                      }
                      return InteractionResult.CONSUME;
                  }
              }

              public static class SuperGlueItem extends Item {
                  public SuperGlueItem(Properties p) {
                      super(p);
                  }

                  @Override
                  public InteractionResult useOn(UseOnContext ctx) {
                      Level l = ctx.getLevel();
                      Player pl = ctx.getPlayer();
                      if (pl == null) return InteractionResult.PASS;
                      if (pl.isShiftKeyDown()) {
                          if (!l.isClientSide()) activate((ServerLevel) l, pl, ctx.getItemInHand());
                          return InteractionResult.sidedSuccess(l.isClientSide());
                      }
                      if (l.isClientSide()) return InteractionResult.SUCCESS;
                      ServerLevel s = (ServerLevel) l;
                      BlockPos pos = ctx.getClickedPos();
                      BlockState st = s.getBlockState(pos);
                      if (!FPMod.safe(st, s, pos)) {
                          pl.displayClientMessage(Component.literal("Super Glue: Este bloco nao pode ser colado!"), true);
                          return InteractionResult.FAIL;
                      }
                      CompoundTag tag = ctx.getItemInHand().getOrCreateTag();
                      long[] old = tag.getLongArray("Glued");
                      List<Long> list = new ArrayList<>();
                      long target = pos.asLong();
                      boolean removed = false;
                      for (long v : old) {
                          if (v == target) removed = true;
                          else list.add(v);
                      }
                      if (!removed) {
                          if (list.size() >= 48) {
                              pl.displayClientMessage(Component.literal("Super Glue: Limite maximo de 48 blocos atingido!"), true);
                              return InteractionResult.FAIL;
                          }
                          list.add(target);
                      }
                      long[] next = new long[list.size()];
                      for (int i = 0; i < list.size(); i++) next[i] = list.get(i);
                      tag.putLongArray("Glued", next);
                      s.playSound(null, pos.getX() + 0.5, pos.getY() + 0.5, pos.getZ() + 0.5, removed ? SoundEvents.SLIME_BLOCK_STEP : SoundEvents.SLIME_BLOCK_PLACE, SoundSource.PLAYERS, 0.9F, removed ? 0.7F : 1.15F);
                      FPMod.sendBnc(s, pos.getX() + 0.5, pos.getY() + 0.5, pos.getZ() + 0.5, st, 0.55F, 2);
                      pl.displayClientMessage(Component.literal("Super Glue: " + next.length + " bloco(s) colado(s) | Agache + Clique para aplicar fisica!"), true);
                      return InteractionResult.CONSUME;
                  }

                  @Override
                  public InteractionResultHolder<ItemStack> use(Level l, Player pl, InteractionHand h) {
                      ItemStack stack = pl.getItemInHand(h);
                      if (pl.isShiftKeyDown()) {
                          if (!l.isClientSide()) activate((ServerLevel) l, pl, stack);
                          return InteractionResultHolder.sidedSuccess(stack, l.isClientSide());
                      }
                      return InteractionResultHolder.pass(stack);
                  }

                  private void activate(ServerLevel s, Player pl, ItemStack stack) {
                      CompoundTag tag = stack.getOrCreateTag();
                      long[] raw = tag.getLongArray("Glued");
                      List<BlockPos> validPos = new ArrayList<>();
                      List<BlockState> validSt = new ArrayList<>();
                      for (long v : raw) {
                          BlockPos bp = BlockPos.of(v);
                          BlockState st = s.getBlockState(bp);
                          if (FPMod.safe(st, s, bp)) {
                              validPos.add(bp);
                              validSt.add(st);
                          }
                      }
                      tag.remove("Glued");
                      if (validPos.isEmpty()) {
                          pl.displayClientMessage(Component.literal("Super Glue: Clique em alguns blocos primeiro!"), true);
                          return;
                      }
                      double cx = 0, cy = 0, cz = 0;
                      for (BlockPos bp : validPos) {
                          cx += bp.getX() + 0.5;
                          cy += bp.getY() + 0.5;
                          cz += bp.getZ() + 0.5;
                      }
                      cx /= validPos.size();
                      cy /= validPos.size();
                      cz /= validPos.size();
                      List<FPBlockEntity.Part> parts = new ArrayList<>();
                      for (int i = 0; i < validPos.size(); i++) {
                          BlockPos bp = validPos.get(i);
                          BlockState st = validSt.get(i);
                          s.setBlock(bp, Blocks.AIR.defaultBlockState(), 3);
                          parts.add(new FPBlockEntity.Part((float) (bp.getX() + 0.5 - cx), (float) (bp.getY() + 0.5 - cy), (float) (bp.getZ() + 0.5 - cz), st));
                      }
                      Vec3 vel = new Vec3((s.random.nextDouble() - 0.5) * 0.08, -0.02, (s.random.nextDouble() - 0.5) * 0.08);
                      Vec3 ang = new Vec3((s.random.nextDouble() - 0.5) * 0.32, (s.random.nextDouble() - 0.5) * 0.22, (s.random.nextDouble() - 0.5) * 0.32);
                      s.addFreshEntity(FPBlockEntity.spawn(s, cx, cy, cz, parts, vel, ang, true, true, false));
                      s.playSound(null, cx, cy, cz, SoundEvents.SLIME_BLOCK_BREAK, SoundSource.PLAYERS, 1.1F, 0.85F);
                      FPMod.sendBnc(s, cx, cy, cz, validSt.get(0), 1.0F, 2);
                      pl.displayClientMessage(Component.literal("Super Glue: Fisica real aplicada em " + parts.size() + " bloco(s)!"), true);
                  }
              }

              public static class Events {
                  @SubscribeEvent
                  public void onBreak(BlockEvent.BreakEvent e) {
                      if (!(e.getLevel() instanceof ServerLevel l)) return;
                      BlockPos p = e.getPos();
                      BlockState s = e.getState();
                      if (s.isAir()) return;
                      Vec3 d = e.getPlayer() != null ? e.getPlayer().getLookAngle().scale(0.15) : Vec3.ZERO;
                      FPMod.sendBrk(l, p, s, (float) d.x, (float) d.y, (float) d.z);
                      for (FPBlockEntity f : l.getEntitiesOfClass(FPBlockEntity.class, new AABB(p).inflate(2.5))) f.wake();
                      if (FPMod.fullGrav) l.getServer().execute(() -> dropAbove(l, p.above(), 0));
                  }

                  private void dropAbove(ServerLevel l, BlockPos p, int depth) {
                      if (depth > 14) return;
                      BlockState s = l.getBlockState(p);
                      if (!FPMod.safe(s, l, p) || !l.getBlockState(p.below()).getCollisionShape(l, p.below()).isEmpty()) return;
                      l.setBlock(p, Blocks.AIR.defaultBlockState(), 3);
                      l.addFreshEntity(FPBlockEntity.spawn(
                          l, p.getX() + 0.5, p.getY() + 0.5, p.getZ() + 0.5,
                          List.of(new FPBlockEntity.Part(0, 0, 0, s)),
                          new Vec3((l.random.nextDouble() - 0.5) * 0.08, -0.02, (l.random.nextDouble() - 0.5) * 0.08),
                          new Vec3((l.random.nextDouble() - 0.5) * 0.35, (l.random.nextDouble() - 0.5) * 0.2, (l.random.nextDouble() - 0.5) * 0.35),
                          false, true, true
                      ));
                      dropAbove(l, p.above(), depth + 1);
                  }

                  @SubscribeEvent
                  public void onPlace(BlockEvent.EntityPlaceEvent e) {
                      if (!(e.getLevel() instanceof ServerLevel l)) return;
                      BlockPos p = e.getPos();
                      BlockState s = e.getPlacedBlock();
                      FPMod.sendPlc(l, p, s);
                      double cx = p.getX() + 0.5, cz = p.getZ() + 0.5;
                      for (FPBlockEntity f : l.getEntitiesOfClass(FPBlockEntity.class, new AABB(p).inflate(3.5))) {
                          double dx = f.px - cx, dz = f.pz - cz, d = Math.max(0.25, Math.sqrt(dx * dx + dz * dz));
                          float k = (float) Math.max(0.0, (1.0 - d / 3.8) * 0.22);
                          f.vx += (float) ((dx / d) * k);
                          f.vy += k * 0.75F + 0.05F;
                          f.vz += (float) ((dz / d) * k);
                          f.wx += (l.random.nextFloat() - 0.5F) * 0.25F;
                          f.wz += (l.random.nextFloat() - 0.5F) * 0.25F;
                          f.wake();
                      }
                  }

                  @SubscribeEvent
                  public void onJoin(EntityJoinLevelEvent e) {
                      if (!(e.getLevel() instanceof ServerLevel l)) return;
                      if (e.getEntity() instanceof FallingBlockEntity fbe) {
                          BlockState s = fbe.getBlockState();
                          if (s.isAir()) return;
                          e.setCanceled(true);
                          double x = fbe.getX(), y = fbe.getY() + 0.5, z = fbe.getZ();
                          Vec3 bv = fbe.getDeltaMovement();
                          boolean drop = fbe.dropItem;
                          l.getServer().execute(() -> l.addFreshEntity(FPBlockEntity.spawn(
                              l, x, y, z,
                              List.of(new FPBlockEntity.Part(0, 0, 0, s)),
                              new Vec3(bv.x + (l.random.nextDouble() - 0.5) * 0.09, bv.y, bv.z + (l.random.nextDouble() - 0.5) * 0.09),
                              new Vec3((l.random.nextDouble() - 0.5) * 0.4, (l.random.nextDouble() - 0.5) * 0.25, (l.random.nextDouble() - 0.5) * 0.4),
                              false, drop, true
                          )));
                      }
                  }

                  @SubscribeEvent
                  public void onExplode(ExplosionEvent.Detonate e) {
                      if (!(e.getLevel() instanceof ServerLevel l)) return;
                      Vec3 c = e.getExplosion().getPosition();
                      List<BlockPos> aff = e.getAffectedBlocks();
                      if (aff.isEmpty()) return;
                      float rad = Math.max(2.5F, (float) Math.cbrt(aff.size()) * 1.15F);
                      List<BlockPos> cands = new ArrayList<>();
                      List<Integer> samps = new ArrayList<>();
                      for (BlockPos bp : aff) {
                          BlockState s = l.getBlockState(bp);
                          if (s.isAir() || s.getBlock() instanceof TntBlock || s.hasBlockEntity()) continue;
                          if (samps.size() < 24) samps.add(Block.getId(s));
                          if (s.isCollisionShapeFullBlock(l, bp) && s.getDestroySpeed(l, bp) >= 0) cands.add(bp);
                      }
                      Collections.shuffle(cands, new Random(l.random.nextLong()));
                      int maxF = Math.min(cands.size(), FPMod.qual == 0 ? 12 : (FPMod.qual == 2 ? 30 : 20));
                      List<BlockPos> conv = new ArrayList<>(maxF);
                      for (int i = 0; i < maxF; i++) {
                          BlockPos bp = cands.get(i);
                          BlockState s = l.getBlockState(bp);
                          conv.add(bp);
                          l.setBlock(bp, Blocks.AIR.defaultBlockState(), 3);
                          double dx = bp.getX() + 0.5 - c.x, dy = bp.getY() + 0.5 - c.y, dz = bp.getZ() + 0.5 - c.z, d = Math.max(0.5, Math.sqrt(dx * dx + dy * dy + dz * dz));
                          double pw = Math.min(1.35, (rad / d) * 0.42 + 0.25);
                          l.addFreshEntity(FPBlockEntity.spawn(
                              l, bp.getX() + 0.5, bp.getY() + 0.5, bp.getZ() + 0.5,
                              List.of(new FPBlockEntity.Part(0, 0, 0, s)),
                              new Vec3((dx / d) * pw + (l.random.nextDouble() - 0.5) * 0.2, Math.max(0.28, (dy / d) * pw + 0.36), (dz / d) * pw + (l.random.nextDouble() - 0.5) * 0.2),
                              new Vec3((l.random.nextDouble() - 0.5) * 0.95, (l.random.nextDouble() - 0.5) * 0.75, (l.random.nextDouble() - 0.5) * 0.95),
                              false, false, i % 2 == 0
                          ));
                      }
                      aff.removeAll(conv);
                      for (FPBlockEntity f : l.getEntitiesOfClass(FPBlockEntity.class, new AABB(c, c).inflate(rad * 2.5))) {
                          Vec3 df = f.position().subtract(c);
                          double d = Math.max(0.5, df.length());
                          float imp = (float) Math.min(1.6, (rad / d) * 0.75);
                          f.vx += (float) ((df.x / d) * imp);
                          f.vy += (float) ((df.y / d) * imp + 0.35F);
                          f.vz += (float) ((df.z / d) * imp);
                          f.wx += (l.random.nextFloat() - 0.5F) * 0.9F;
                          f.wz += (l.random.nextFloat() - 0.5F) * 0.9F;
                          f.wake();
                      }
                      FPMod.sendExp(l, c.x, c.y, c.z, rad, samps.stream().mapToInt(Integer::intValue).toArray());
                  }

                  @SubscribeEvent
                  public void onDeath(LivingDeathEvent e) {
                      if (!(e.getEntity().level() instanceof ServerLevel l)) return;
                      Entity ent = e.getEntity();
                      BlockState fl = l.getBlockState(ent.blockPosition().below());
                      if (fl.isAir()) fl = Blocks.RED_CONCRETE.defaultBlockState();
                      FPMod.sendBnc(l, ent.getX(), ent.getY() + ent.getBbHeight() * 0.5, ent.getZ(), fl, 0.85F, 0);
                  }

                  @SubscribeEvent
                  public void onPlayerTick(TickEvent.PlayerTickEvent e) {
                      if (e.phase != TickEvent.Phase.END || e.player.level().isClientSide()) return;
                      Player p = e.player;
                      Vec3 cur = p.position(), prev = P_PREV.getOrDefault(p.getUUID(), cur), vel = cur.subtract(prev);
                      P_PREV.put(p.getUUID(), cur);
                      P_VEL.put(p.getUUID(), vel);
                      if ((p.tickCount & 1) == 0 && vel.horizontalDistanceSqr() > 0.002) {
                          for (ItemEntity it : p.level().getEntitiesOfClass(ItemEntity.class, p.getBoundingBox().inflate(0.4))) {
                              it.setDeltaMovement(it.getDeltaMovement().add(vel.x * 0.75, 0.07, vel.z * 0.75));
                          }
                      }
                  }

                  @SubscribeEvent
                  public void onCmd(RegisterCommandsEvent e) {
                      for (String nm : new String[]{"physics", "fluidphysics"}) {
                          LiteralArgumentBuilder<CommandSourceStack> c = Commands.literal(nm)
                              .requires(s -> s.hasPermission(0))
                              .then(Commands.literal("items").executes(x -> {
                                  Player p = x.getSource().getPlayerOrException();
                                  p.addItem(new ItemStack(FPMod.PHYSICAL.get()));
                                  p.addItem(new ItemStack(FPMod.SUPER_GLUE.get()));
                                  x.getSource().sendSuccess(() -> Component.literal("FluidPhysics: Itens Physical e Super Glue entregues!"), false);
                                  return 1;
                              }))
                              .then(Commands.literal("gravity")
                                  .then(Commands.literal("natural").executes(x -> {
                                      FPMod.fullGrav = false;
                                      FPMod.sendSync(false, FPMod.qual, false);
                                      x.getSource().sendSuccess(() -> Component.literal("Gravidade NATURAL."), false);
                                      return 1;
                                  }))
                                  .then(Commands.literal("full").executes(x -> {
                                      FPMod.fullGrav = true;
                                      FPMod.sendSync(true, FPMod.qual, false);
                                      x.getSource().sendSuccess(() -> Component.literal("Gravidade TOTAL ativada!"), false);
                                      return 1;
                                  })))
                              .then(Commands.literal("quality")
                                  .then(Commands.literal("low").executes(x -> q(x.getSource(), 0)))
                                  .then(Commands.literal("medium").executes(x -> q(x.getSource(), 1)))
                                  .then(Commands.literal("high").executes(x -> q(x.getSource(), 2))))
                              .then(Commands.literal("clear").executes(x -> {
                                  List<FPBlockEntity> rem = new ArrayList<>();
                                  for (Entity ent : x.getSource().getLevel().getAllEntities()) {
                                      if (ent instanceof FPBlockEntity f) rem.add(f);
                                  }
                                  for (FPBlockEntity f : rem) f.discard();
                                  FPMod.sendSync(FPMod.fullGrav, FPMod.qual, true);
                                  x.getSource().sendSuccess(() -> Component.literal("Blocos fisicos e particulas limpos!"), false);
                                  return 1;
                              }));
                          e.getDispatcher().register(c);
                      }
                  }

                  private int q(CommandSourceStack s, int lv) {
                      FPMod.qual = lv;
                      FPMod.sendSync(FPMod.fullGrav, lv, false);
                      s.sendSuccess(() -> Component.literal("Qualidade ajustada!"), false);
                      return 1;
                  }
              }
          }
