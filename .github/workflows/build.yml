          package com.fluidphysics.network;

          import com.fluidphysics.FluidPhysicsMod;
          import com.fluidphysics.client.ClientPhysicsWorld;
          import net.minecraft.core.BlockPos;
          import net.minecraft.network.FriendlyByteBuf;
          import net.minecraft.resources.ResourceLocation;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.world.level.block.Block;
          import net.minecraft.world.level.block.state.BlockState;
          import net.minecraftforge.api.distmarker.Dist;
          import net.minecraftforge.fml.DistExecutor;
          import net.minecraftforge.network.NetworkDirection;
          import net.minecraftforge.network.NetworkEvent;
          import net.minecraftforge.network.NetworkRegistry;
          import net.minecraftforge.network.PacketDistributor;
          import net.minecraftforge.network.simple.SimpleChannel;
          import java.util.Optional;
          import java.util.function.Supplier;

          public final class ModNetwork {
            private static final String V = "1";
            public static final SimpleChannel CH = NetworkRegistry.newSimpleChannel(
              new ResourceLocation(FluidPhysicsMod.MODID, "main"), () -> V, V::equals, V::equals);

            public static void register() {
              int id = 0;
              CH.registerMessage(id++, BreakPkt.class, BreakPkt::enc, BreakPkt::dec, BreakPkt::handle, Optional.of(NetworkDirection.PLAY_TO_CLIENT));
              CH.registerMessage(id++, PlacePkt.class, PlacePkt::enc, PlacePkt::dec, PlacePkt::handle, Optional.of(NetworkDirection.PLAY_TO_CLIENT));
              CH.registerMessage(id++, BouncePkt.class, BouncePkt::enc, BouncePkt::dec, BouncePkt::handle, Optional.of(NetworkDirection.PLAY_TO_CLIENT));
              CH.registerMessage(id++, ExplodePkt.class, ExplodePkt::enc, ExplodePkt::dec, ExplodePkt::handle, Optional.of(NetworkDirection.PLAY_TO_CLIENT));
              CH.registerMessage(id++, SyncPkt.class, SyncPkt::enc, SyncPkt::dec, SyncPkt::handle, Optional.of(NetworkDirection.PLAY_TO_CLIENT));
            }

            public static void sendBreak(ServerLevel l, BlockPos p, BlockState s, float dx, float dy, float dz) {
              CH.send(PacketDistributor.NEAR.with(() -> new PacketDistributor.TargetPoint(p.getX() + 0.5, p.getY() + 0.5, p.getZ() + 0.5, 48, l.dimension())),
                new BreakPkt(p, Block.getId(s), dx, dy, dz));
            }
            public static void sendPlaceImpact(ServerLevel l, BlockPos p, BlockState s) {
              CH.send(PacketDistributor.NEAR.with(() -> new PacketDistributor.TargetPoint(p.getX() + 0.5, p.getY() + 0.5, p.getZ() + 0.5, 40, l.dimension())),
                new PlacePkt(p, Block.getId(s)));
            }
            public static void sendBounce(ServerLevel l, double x, double y, double z, BlockState s, float i) {
              CH.send(PacketDistributor.NEAR.with(() -> new PacketDistributor.TargetPoint(x, y, z, 44, l.dimension())),
                new BouncePkt(x, y, z, Block.getId(s), i));
            }
            public static void sendExplode(ServerLevel l, double x, double y, double z, float r, int[] ids) {
              CH.send(PacketDistributor.NEAR.with(() -> new PacketDistributor.TargetPoint(x, y, z, 72, l.dimension())),
                new ExplodePkt(x, y, z, r, ids));
            }
            public static void sendSync(boolean fg, boolean pp, int q, boolean clr) {
              CH.send(PacketDistributor.ALL.noArg(), new SyncPkt(fg, pp, q, clr));
            }

            public record BreakPkt(BlockPos pos, int id, float dx, float dy, float dz) {
              static void enc(BreakPkt m, FriendlyByteBuf b) { b.writeBlockPos(m.pos); b.writeInt(m.id); b.writeFloat(m.dx); b.writeFloat(m.dy); b.writeFloat(m.dz); }
              static BreakPkt dec(FriendlyByteBuf b) { return new BreakPkt(b.readBlockPos(), b.readInt(), b.readFloat(), b.readFloat(), b.readFloat()); }
              static void handle(BreakPkt m, Supplier<NetworkEvent.Context> c) {
                c.get().enqueueWork(() -> DistExecutor.unsafeRunWhenOn(Dist.CLIENT, () -> () -> ClientPhysicsWorld.onBreak(m)));
                c.get().setPacketHandled(true);
              }
            }
            public record PlacePkt(BlockPos pos, int id) {
              static void enc(PlacePkt m, FriendlyByteBuf b) { b.writeBlockPos(m.pos); b.writeInt(m.id); }
              static PlacePkt dec(FriendlyByteBuf b) { return new PlacePkt(b.readBlockPos(), b.readInt()); }
              static void handle(PlacePkt m, Supplier<NetworkEvent.Context> c) {
                c.get().enqueueWork(() -> DistExecutor.unsafeRunWhenOn(Dist.CLIENT, () -> () -> ClientPhysicsWorld.onPlace(m)));
                c.get().setPacketHandled(true);
              }
            }
            public record BouncePkt(double x, double y, double z, int id, float intensity) {
              static void enc(BouncePkt m, FriendlyByteBuf b) { b.writeDouble(m.x); b.writeDouble(m.y); b.writeDouble(m.z); b.writeInt(m.id); b.writeFloat(m.intensity); }
              static BouncePkt dec(FriendlyByteBuf b) { return new BouncePkt(b.readDouble(), b.readDouble(), b.readDouble(), b.readInt(), b.readFloat()); }
              static void handle(BouncePkt m, Supplier<NetworkEvent.Context> c) {
                c.get().enqueueWork(() -> DistExecutor.unsafeRunWhenOn(Dist.CLIENT, () -> () -> ClientPhysicsWorld.onBounce(m)));
                c.get().setPacketHandled(true);
              }
            }
            public record ExplodePkt(double x, double y, double z, float radius, int[] ids) {
              static void enc(ExplodePkt m, FriendlyByteBuf b) { b.writeDouble(m.x); b.writeDouble(m.y); b.writeDouble(m.z); b.writeFloat(m.radius); b.writeVarIntArray(m.ids); }
              static ExplodePkt dec(FriendlyByteBuf b) { return new ExplodePkt(b.readDouble(), b.readDouble(), b.readDouble(), b.readFloat(), b.readVarIntArray(64)); }
              static void handle(ExplodePkt m, Supplier<NetworkEvent.Context> c) {
                c.get().enqueueWork(() -> DistExecutor.unsafeRunWhenOn(Dist.CLIENT, () -> () -> ClientPhysicsWorld.onExplode(m)));
                c.get().setPacketHandled(true);
              }
            }
            public record SyncPkt(boolean fullGrav, boolean placePhys, int qual, boolean clear) {
              static void enc(SyncPkt m, FriendlyByteBuf b) { b.writeBoolean(m.fullGrav); b.writeBoolean(m.placePhys); b.writeInt(m.qual); b.writeBoolean(m.clear); }
              static SyncPkt dec(FriendlyByteBuf b) { return new SyncPkt(b.readBoolean(), b.readBoolean(), b.readInt(), b.readBoolean()); }
              static void handle(SyncPkt m, Supplier<NetworkEvent.Context> c) {
                c.get().enqueueWork(() -> DistExecutor.unsafeRunWhenOn(Dist.CLIENT, () -> () -> ClientPhysicsWorld.onSync(m)));
                c.get().setPacketHandled(true);
              }
            }
          }
