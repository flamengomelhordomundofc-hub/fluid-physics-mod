                                  vx += (float) (nx * j);
                                  vy += (float) (ny * j);
                                  vz += (float) (nz * j);
                                  other.vx -= (float) (nx * j);
                                  other.vy -= (float) (ny * j);
                                  other.vz -= (float) (nz * j);
                                  wx += (sLvl.random.nextFloat() - 0.5F) * 0.18F;
                                  wz += (sLvl.random.nextFloat() - 0.5F) * 0.18F;
                                  other.wx -= (sLvl.random.nextFloat() - 0.5F) * 0.18F;
                              }
