              private boolean hasNoBottomSupport(ServerLevel level, BlockPos pos) {
                  BlockPos below = pos.below();
                  BlockState belowState = level.getBlockState(below);
                  return belowState.isAir() || belowState.getCollisionShape(level, below).isEmpty();
              }

              @SubscribeEvent
              public void onBlockBreak(BlockEvent.BreakEvent event) {
                  if (!(event.getLevel() instanceof ServerLevel level)) return;
                  BlockPos pos = event.getPos();
                  BlockState state = event.getState();
                  if (state.isAir()) return;

                  Vec3 hitDir = Vec3.ZERO;
                  Player player = event.getPlayer();
                  if (player != null) {
                      hitDir = player.getLookAngle().scale(0.14);
                  }
                  ModNetwork.sendBlockBreak(level, pos, state, (float) hitDir.x, (float) hitDir.y, (float) hitDir.z);

                  AABB wakeBox = new AABB(pos).inflate(2.0);
                  for (FluidBlockEntity fbe : level.getEntitiesOfClass(FluidBlockEntity.class, wakeBox)) {
                      fbe.wakeUp();
                  }

                  if (PhysicsConfig.fullGravity) {
                      level.getServer().execute(() -> triggerUnsupportedCollapse(level, pos.above(), 0));
                  }
              }

              private void triggerUnsupportedCollapse(ServerLevel level, BlockPos pos, int depth) {
                  if (depth > 14) return;
                  BlockState state = level.getBlockState(pos);
                  if (!PhysicsConfig.isSafePhysicsBlock(state, level, pos)) return;
                  if (!hasNoBottomSupport(level, pos)) return;

                  level.setBlock(pos, Blocks.AIR.defaultBlockState(), 3);
                  Vec3 randVel = new Vec3(
                      (level.random.nextDouble() - 0.5) * 0.08,
                      -0.02,
                      (level.random.nextDouble() - 0.5) * 0.08
                  );
                  Vec3 randAng = new Vec3(
                      (level.random.nextDouble() - 0.5) * 0.25,
                      (level.random.nextDouble() - 0.5) * 0.14,
                      (level.random.nextDouble() - 0.5) * 0.25
                  );
                  FluidBlockEntity fbe = FluidBlockEntity.createFalling(
                      level, pos.getX() + 0.5, pos.getY() + 0.5, pos.getZ() + 0.5,
                      state, randVel, randAng, true
                  );
                  level.addFreshEntity(fbe);

                  triggerUnsupportedCollapse(level, pos.above(), depth + 1);
              }

              @SubscribeEvent
              public void onBlockPlace(BlockEvent.EntityPlaceEvent event) {
                  if (!(event.getLevel() instanceof ServerLevel level)) return;
                  BlockPos pos = event.getPos();
                  BlockState state = event.getPlacedBlock();
                  Entity placer = event.getEntity();
                  boolean sneaking = placer != null && placer.isShiftKeyDown();

                  if (!PhysicsConfig.isSafePhysicsBlock(state, level, pos)) {
                      ModNetwork.sendPlaceImpact(level, pos, state);
                      return;
                  }

                  boolean unsupportedBelow = hasNoBottomSupport(level, pos);

                  if (unsupportedBelow && (PhysicsConfig.isNaturalGravity(state) || (PhysicsConfig.fullGravity && !sneaking))) {
                      level.setBlock(pos, Blocks.AIR.defaultBlockState(), 3);

                      double tipX = 0, tipZ = 0;
                      for (Direction dir : Direction.Plane.HORIZONTAL) {
                          BlockPos adj = pos.relative(dir);
                          if (!level.getBlockState(adj).getCollisionShape(level, adj).isEmpty()) {
                              tipX -= dir.getStepX();
                              tipZ -= dir.getStepZ();
                          }
                      }
                      if (tipX == 0 && tipZ == 0) {
                          tipX = (level.random.nextDouble() - 0.5) * 0.6;
                          tipZ = (level.random.nextDouble() - 0.5) * 0.6;
                      } else {
                          double len = Math.sqrt(tipX * tipX + tipZ * tipZ);
                          tipX /= len;
                          tipZ /= len;
                      }

                      Vec3 vel = new Vec3(tipX * 0.08, -0.02, tipZ * 0.08);
                      Vec3 ang = new Vec3(tipZ * 0.28 + (level.random.nextDouble() - 0.5) * 0.1, (level.random.nextDouble() - 0.5) * 0.15, -tipX * 0.28 + (level.random.nextDouble() - 0.5) * 0.1);

                      FluidBlockEntity falling = FluidBlockEntity.createFalling(
                          level, pos.getX() + 0.5, pos.getY() + 0.5, pos.getZ() + 0.5,
                          state, vel, ang, true
                      );
                      level.addFreshEntity(falling);
                      ModNetwork.sendPlaceImpact(level, pos, state);
                      return;
                  }

                  if (PhysicsConfig.placementPhysics && !sneaking) {
                      level.setBlock(pos, Blocks.AIR.defaultBlockState(), 3);
                      Vec3 approach = new Vec3(0, 0.34, 0);
                      if (placer != null) {
                          Vec3 fromPlacer = placer.getEyePosition().subtract(pos.getX() + 0.5, pos.getY() + 0.5, pos.getZ() + 0.5);
                          if (fromPlacer.lengthSqr() > 0.01) {
                              Vec3 dir = fromPlacer.normalize();
                              approach = new Vec3(dir.x * 0.14, Math.max(0.24, dir.y * 0.22 + 0.18), dir.z * 0.14);
                          }
                      }
                      FluidBlockEntity settle = FluidBlockEntity.createPlacementSettle(level, pos, state, approach);
                      level.addFreshEntity(settle);
                  } else {
                      ModNetwork.sendPlaceImpact(level, pos, state);
                  }
              }

              @SubscribeEvent
              public void onEntityJoin(EntityJoinLevelEvent event) {
                  if (!(event.getLevel() instanceof ServerLevel level)) return;
                  if (event.getEntity() instanceof FallingBlockEntity fbe) {
                      BlockState state = fbe.getBlockState();
                      if (state.isAir()) return;

                      event.setCanceled(true);

                      double cx = fbe.getX();
                      double cy = fbe.getY() + 0.5;
                      double cz = fbe.getZ();
                      Vec3 baseVel = fbe.getDeltaMovement();
                      Vec3 vel = new Vec3(
                          baseVel.x + (level.random.nextDouble() - 0.5) * 0.075,
                          baseVel.y,
                          baseVel.z + (level.random.nextDouble() - 0.5) * 0.075
                      );
                      Vec3 ang = new Vec3(
                          (level.random.nextDouble() - 0.5) * 0.32,
                          (level.random.nextDouble() - 0.5) * 0.22,
                          (level.random.nextDouble() - 0.5) * 0.32
                      );
                      boolean shouldDrop = fbe.dropItem;

                      level.getServer().execute(() -> {
                          FluidBlockEntity fluidBlock = FluidBlockEntity.createFalling(level, cx, cy, cz, state, vel, ang, shouldDrop);
                          level.addFreshEntity(fluidBlock);
                      });
                  }
              }

              @SubscribeEvent
              public void onExplosionDetonate(ExplosionEvent.Detonate event) {
                  if (!(event.getLevel() instanceof ServerLevel level)) return;
                  Vec3 center = event.getExplosion().getPosition();
                  List<BlockPos> affected = event.getAffectedBlocks();
                  if (affected.isEmpty()) return;

                  float radius = Math.max(2.5F, (float) Math.cbrt(affected.size()) * 1.15F);

                  List<BlockPos> candidates = new ArrayList<>();
                  List<Integer> sampleIds = new ArrayList<>();

                  for (BlockPos bp : affected) {
                      BlockState st = level.getBlockState(bp);
                      if (st.isAir() || st.getBlock() instanceof TntBlock || st.hasBlockEntity()) continue;
                      if (sampleIds.size() < 24) {
                          sampleIds.add(Block.getId(st));
                      }
                      if (st.isCollisionShapeFullBlock(level, bp) && st.getDestroySpeed(level, bp) >= 0) {
                          candidates.add(bp);
                      }
                  }

                  Collections.shuffle(candidates, new java.util.Random(level.random.nextLong()));
                  int maxFlying = Math.min(candidates.size(), PhysicsConfig.qualityLevel == 0 ? 12 : (PhysicsConfig.qualityLevel == 2 ? 34 : 22));
                  List<BlockPos> converted = new ArrayList<>(maxFlying);

                  for (int i = 0; i < maxFlying; i++) {
                      BlockPos bp = candidates.get(i);
                      BlockState st = level.getBlockState(bp);
                      converted.add(bp);
                      level.setBlock(bp, Blocks.AIR.defaultBlockState(), 3);

                      double dx = (bp.getX() + 0.5) - center.x;
                      double dy = (bp.getY() + 0.5) - center.y;
                      double dz = (bp.getZ() + 0.5) - center.z;
                      double dist = Math.max(0.5, Math.sqrt(dx * dx + dy * dy + dz * dz));
                      double power = Math.min(1.35, (radius / dist) * 0.42 + 0.25);

                      Vec3 vel = new Vec3(
                          (dx / dist) * power + (level.random.nextDouble() - 0.5) * 0.22,
                          Math.max(0.28, (dy / dist) * power + 0.38 + level.random.nextDouble() * 0.28),
                          (dz / dist) * power + (level.random.nextDouble() - 0.5) * 0.22
                      );
                      Vec3 ang = new Vec3(
                          (level.random.nextDouble() - 0.5) * 0.95,
                          (level.random.nextDouble() - 0.5) * 0.75,
                          (level.random.nextDouble() - 0.5) * 0.95
                      );

                      boolean settleIntoWorld = (i % 2 == 0);
                      FluidBlockEntity debris = FluidBlockEntity.createExplosionDebris(
                          level, bp.getX() + 0.5, bp.getY() + 0.5, bp.getZ() + 0.5,
                          st, vel, ang, settleIntoWorld
                      );
                      level.addFreshEntity(debris);
                  }

                  affected.removeAll(converted);

                  AABB blastBox = new AABB(center, center).inflate(radius * 2.5);
                  for (FluidBlockEntity fbe : level.getEntitiesOfClass(FluidBlockEntity.class, blastBox)) {
                      if (fbe.getMode() == FluidBlockEntity.MODE_PLACEMENT_SETTLE) continue;
                      Vec3 diff = fbe.position().subtract(center);
                      double dist = Math.max(0.5, diff.length());
                      float impulse = (float) Math.min(1.6, (radius / dist) * 0.75);
                      fbe.body.vx += (float) ((diff.x / dist) * impulse);
                      fbe.body.vy += (float) ((diff.y / dist) * impulse + 0.35);
                      fbe.body.vz += (float) ((diff.z / dist) * impulse);
                      fbe.body.wx += (level.random.nextFloat() - 0.5F) * 0.9F;
                      fbe.body.wz += (level.random.nextFloat() - 0.5F) * 0.9F;
                      fbe.wakeUp();
                  }

                  int[] sampleArray = sampleIds.stream().mapToInt(Integer::intValue).toArray();
                  ModNetwork.sendExplosion(level, center.x, center.y, center.z, radius, sampleArray);
              }

              @SubscribeEvent
              public void onMobDeath(LivingDeathEvent event) {
                  if (!(event.getEntity().level() instanceof ServerLevel level)) return;
                  Entity e = event.getEntity();
                  BlockPos below = e.blockPosition().below();
                  BlockState floor = level.getBlockState(below);
                  if (floor.isAir()) floor = Blocks.RED_CONCRETE.defaultBlockState();
                  ModNetwork.sendBounceParticles(level, e.getX(), e.getY() + e.getBbHeight() * 0.4, e.getZ(), floor, 0.55F);
              }

              @SubscribeEvent
              public void onRegisterCommands(RegisterCommandsEvent event) {
                  CommandDispatcher<CommandSourceStack> dispatcher = event.getDispatcher();
                  dispatcher.register(Commands.literal("fluidphysics")
                      .requires(src -> src.hasPermission(2))
                      .then(Commands.literal("gravity")
                          .then(Commands.argument("enabled", BoolArgumentType.bool())
                              .executes(ctx -> {
                                  PhysicsConfig.fullGravity = BoolArgumentType.getBool(ctx, "enabled");
                                  ModNetwork.broadcastSettings(PhysicsConfig.fullGravity, PhysicsConfig.placementPhysics, PhysicsConfig.qualityLevel, false);
                                  ctx.getSource().sendSuccess(() -> Component.literal("Fluid Physics fullGravity: " + PhysicsConfig.fullGravity), true);
                                  return 1;
                              })))
                      .then(Commands.literal("placement")
                          .then(Commands.argument("enabled", BoolArgumentType.bool())
                              .executes(ctx -> {
                                  PhysicsConfig.placementPhysics = BoolArgumentType.getBool(ctx, "enabled");
                                  ModNetwork.broadcastSettings(PhysicsConfig.fullGravity, PhysicsConfig.placementPhysics, PhysicsConfig.qualityLevel, false);
                                  ctx.getSource().sendSuccess(() -> Component.literal("Fluid Physics placementPhysics: " + PhysicsConfig.placementPhysics), true);
                                  return 1;
                              })))
                      .then(Commands.literal("quality")
                          .then(Commands.argument("level", IntegerArgumentType.integer(0, 2))
                              .executes(ctx -> {
                                  PhysicsConfig.qualityLevel = IntegerArgumentType.getInteger(ctx, "level");
                                  ModNetwork.broadcastSettings(PhysicsConfig.fullGravity, PhysicsConfig.placementPhysics, PhysicsConfig.qualityLevel, false);
                                  ctx.getSource().sendSuccess(() -> Component.literal("Fluid Physics quality: " + PhysicsConfig.qualityLevel), true);
                                  return 1;
                              })))
                      .then(Commands.literal("clear")
                          .executes(ctx -> {
                              ServerLevel level = ctx.getSource().getLevel();
                              List<FluidBlockEntity> toRemove = new ArrayList<>();
                              for (Entity entity : level.getAllEntities()) {
                                  if (entity instanceof FluidBlockEntity fbe) {
                                      toRemove.add(fbe);
                                  }
                              }
                              for (FluidBlockEntity fbe : toRemove) {
                                  fbe.discard();
                              }
                              ModNetwork.broadcastSettings(PhysicsConfig.fullGravity, PhysicsConfig.placementPhysics, PhysicsConfig.qualityLevel, true);
                              ctx.getSource().sendSuccess(() -> Component.literal("Cleared " + toRemove.size() + " physics blocks and client fragments."), true);
                              return 1;
                          }))
                  );
              }
          }
