name: FluidPhysics V2

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Xmx3G"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Generate V2 Mod
        run: |
          mkdir -p src/main/java/com/fp
          mkdir -p src/main/resources/META-INF
          mkdir -p src/main/resources/assets/fluidphysics/lang
          mkdir -p src/main/resources/assets/fluidphysics/models/item

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3G
          org.gradle.daemon=false
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  maven {
                      name = "MinecraftForge"
                      url = "https://maven.minecraftforge.net/"
                  }
              }
          }
          rootProject.name = "FluidPhysics"
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id "net.minecraftforge.gradle" version "6.0.24"
          }

          version = "2.0.0"
          group = "com.fp"

          base {
              archivesName = "fluidphysics"
          }

          java.toolchain.languageVersion = JavaLanguageVersion.of(17)

          minecraft {
              mappings channel: "official", version: "1.20.1"
          }

          dependencies {
              minecraft "net.minecraftforge:forge:1.20.1-47.2.0"
          }

          tasks.named("jar") {
              finalizedBy "reobfJar"
          }

          tasks.withType(JavaCompile).configureEach {
              options.encoding = "UTF-8"
          }
          EOF

          cat << 'EOF' > src/main/resources/pack.mcmeta
          {
            "pack": {
              "description": "Fluid Physics V2",
              "pack_format": 15
            }
          }
          EOF

          cat << 'EOF' > src/main/resources/META-INF/mods.toml
          modLoader="javafml"
          loaderVersion="[47,)"
          license="MIT"

          [[mods]]
          modId="fluidphysics"
          version="2.0.0"
          displayName="Fluid Physics V2"
          description="3D Rigid Body Physics, Physical Tool, Super Glue and Interactive Particles"

          [[dependencies.fluidphysics]]
              modId="forge"
              mandatory=true
              versionRange="[47,)"
              ordering="NONE"
              side="BOTH"

          [[dependencies.fluidphysics]]
              modId="minecraft"
              mandatory=true
              versionRange="[1.20.1,1.21)"
              ordering="NONE"
              side="BOTH"
          EOF

          cat << 'EOF' > src/main/resources/assets/fluidphysics/lang/en_us.json
          {
            "entity.fluidphysics.fluid_block": "Physics Block",
            "item.fluidphysics.physical": "Physical",
            "item.fluidphysics.super_glue": "Super Glue"
          }
          EOF

          cat << 'EOF' > src/main/resources/assets/fluidphysics/lang/pt_br.json
          {
            "entity.fluidphysics.fluid_block": "Bloco Fisico",
            "item.fluidphysics.physical": "Physical",
            "item.fluidphysics.super_glue": "Super Glue"
          }
          EOF

          cat << 'EOF' > src/main/resources/assets/fluidphysics/models/item/physical.json
          {
            "parent": "minecraft:item/generated",
            "textures": {
              "layer0": "minecraft:item/amethyst_shard"
            }
          }
          EOF

          cat << 'EOF' > src/main/resources/assets/fluidphysics/models/item/super_glue.json
          {
            "parent": "minecraft:item/generated",
            "textures": {
              "layer0": "minecraft:item/slime_ball"
            }
          }
          EOF

          cat << 'EOF' > src/main/java/com/fp/FPMod.java
          package com.fp;

          import net.minecraft.core.BlockPos;
          import net.minecraft.network.FriendlyByteBuf;
          import net.minecraft.resources.ResourceLocation;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.tags.BlockTags;
          import net.minecraft.world.entity.EntityType;
          import net.minecraft.world.entity.MobCategory;
          import net.minecraft.world.item.CreativeModeTabs;
          import net.minecraft.world.item.Item;
          import net.minecraft.world.level.BlockGetter;
          import net.minecraft.world.level.block.Block;
          import net.minecraft.world.level.block.Blocks;
          import net.minecraft.world.level.block.FallingBlock;
          import net.minecraft.world.level.block.SoundType;
          import net.minecraft.world.level.block.TntBlock;
          import net.minecraft.world.level.block.state.BlockState;
          import net.minecraftforge.api.distmarker.Dist;
          import net.minecraftforge.common.MinecraftForge;
          import net.minecraftforge.event.BuildCreativeModeTabContentsEvent;
          import net.minecraftforge.eventbus.api.IEventBus;
          import net.minecraftforge.fml.DistExecutor;
          import net.minecraftforge.fml.common.Mod;
          import net.minecraftforge.fml.event.lifecycle.FMLCommonSetupEvent;
          import net.minecraftforge.fml.javafmlmod.FMLJavaModLoadingContext;
          import net.minecraftforge.network.NetworkDirection;
          import net.minecraftforge.network.NetworkEvent;
          import net.minecraftforge.network.NetworkRegistry;
          import net.minecraftforge.network.PacketDistributor;
          import net.minecraftforge.network.simple.SimpleChannel;
          import net.minecraftforge.registries.DeferredRegister;
          import net.minecraftforge.registries.ForgeRegistries;
          import net.minecraftforge.registries.RegistryObject;

          import java.util.Optional;
          import java.util.function.Supplier;

          @Mod(FPMod.MODID)
          public class FPMod {
              public static final String MODID = "fluidphysics";
              public static volatile boolean fullGrav = false;
              public static volatile int qual = 1;

              public static final DeferredRegister<EntityType<?>> ENTITIES =
                  DeferredRegister.create(ForgeRegistries.ENTITY_TYPES, MODID);
              public static final DeferredRegister<Item> ITEMS =
                  DeferredRegister.create(ForgeRegistries.ITEMS, MODID);

              public static final RegistryObject<EntityType<FPBlockEntity>> FLUID_BLOCK =
                  ENTITIES.register("fluid_block", () ->
                      EntityType.Builder.<FPBlockEntity>of(FPBlockEntity::new, MobCategory.MISC)
                          .sized(0.98F, 0.98F)
                          .clientTrackingRange(12)
                          .updateInterval(1)
                          .build("fluid_block")
                  );

              public static final RegistryObject<Item> PHYSICAL =
                  ITEMS.register("physical", () -> new FPTools.PhysicalItem(new Item.Properties().stacksTo(1)));
              public static final RegistryObject<Item> SUPER_GLUE =
                  ITEMS.register("super_glue", () -> new FPTools.SuperGlueItem(new Item.Properties().stacksTo(1)));

              public static final SimpleChannel CH = NetworkRegistry.newSimpleChannel(
                  new ResourceLocation(MODID, "net"),
                  () -> "2",
                  "2"::equals,
                  "2"::equals
              );

              public FPMod() {
                  IEventBus b = FMLJavaModLoadingContext.get().getModEventBus();
                  ENTITIES.register(b);
                  ITEMS.register(b);
                  b.addListener(this::commonSetup);
                  b.addListener(this::addCreative);
                  MinecraftForge.EVENT_BUS.register(new FPTools.Events());
              }

              private void commonSetup(FMLCommonSetupEvent e) {
                  e.enqueueWork(FPMod::regNet);
              }

              private void addCreative(BuildCreativeModeTabContentsEvent e) {
                  if (e.getTabKey() == CreativeModeTabs.TOOLS_AND_UTILITIES) {
                      e.accept(PHYSICAL.get());
                      e.accept(SUPER_GLUE.get());
                  }
              }

              private static void regNet() {
                  int i = 0;
                  CH.registerMessage(i++, Brk.class, Brk::e, Brk::d, Brk::h, Optional.of(NetworkDirection.PLAY_TO_CLIENT));
                  CH.registerMessage(i++, Plc.class, Plc::e, Plc::d, Plc::h, Optional.of(NetworkDirection.PLAY_TO_CLIENT));
                  CH.registerMessage(i++, Bnc.class, Bnc::e, Bnc::d, Bnc::h, Optional.of(NetworkDirection.PLAY_TO_CLIENT));
                  CH.registerMessage(i++, Exp.class, Exp::e, Exp::d, Exp::h, Optional.of(NetworkDirection.PLAY_TO_CLIENT));
                  CH.registerMessage(i++, Sync.class, Sync::e, Sync::d, Sync::h, Optional.of(NetworkDirection.PLAY_TO_CLIENT));
              }

              public static void sendBrk(ServerLevel l, BlockPos p, BlockState s, float x, float y, float z) {
                  CH.send(PacketDistributor.NEAR.with(() -> new PacketDistributor.TargetPoint(p.getX() + 0.5, p.getY() + 0.5, p.getZ() + 0.5, 48, l.dimension())), new Brk(p, Block.getId(s), x, y, z));
              }

              public static void sendPlc(ServerLevel l, BlockPos p, BlockState s) {
                  CH.send(PacketDistributor.NEAR.with(() -> new PacketDistributor.TargetPoint(p.getX() + 0.5, p.getY() + 0.5, p.getZ() + 0.5, 42, l.dimension())), new Plc(p, Block.getId(s)));
              }

              public static void sendBnc(ServerLevel l, double x, double y, double z, BlockState s, float pow, int style) {
                  CH.send(PacketDistributor.NEAR.with(() -> new PacketDistributor.TargetPoint(x, y, z, 48, l.dimension())), new Bnc(x, y, z, Block.getId(s), pow, style));
              }

              public static void sendExp(ServerLevel l, double x, double y, double z, float r, int[] ids) {
                  CH.send(PacketDistributor.NEAR.with(() -> new PacketDistributor.TargetPoint(x, y, z, 72, l.dimension())), new Exp(x, y, z, r, ids));
              }

              public static void sendSync(boolean fg, int q, boolean clr) {
                  CH.send(PacketDistributor.ALL.noArg(), new Sync(fg, q, clr));
              }

              public static int maxFrag() {
                  return qual == 0 ? 120 : (qual == 2 ? 480 : 240);
              }

              public static int maxPart() {
                  return qual == 0 ? 500 : (qual == 2 ? 2600 : 1400);
              }

              public static boolean isFall(BlockState s) {
                  return s.getBlock() instanceof FallingBlock;
              }

              public static boolean safe(BlockState s, BlockGetter l, BlockPos p) {
                  return s != null && !s.isAir() && !s.hasBlockEntity() && s.getFluidState().isEmpty() && s.getDestroySpeed(l, p) >= 0.0F && !(s.getBlock() instanceof TntBlock);
              }

              public static float rest(BlockState s) {
                  SoundType t = s.getSoundType();
                  if (t == SoundType.SLIME_BLOCK || s.is(Blocks.SLIME_BLOCK)) return 0.85F;
                  if (t == SoundType.HONEY_BLOCK) return 0.05F;
                  if (t == SoundType.SAND || t == SoundType.GRAVEL || t == SoundType.SNOW) return 0.16F;
                  if (t == SoundType.WOOD) return 0.36F;
                  if (t == SoundType.METAL || t == SoundType.ANVIL) return 0.38F;
                  return 0.30F;
              }

              public static float fric(BlockState s) {
                  if (s.is(BlockTags.ICE)) return 0.04F;
                  if (s.getSoundType() == SoundType.HONEY_BLOCK) return 0.95F;
                  return 0.52F;
              }

              public static float buoy(BlockState s) {
                  SoundType t = s.getSoundType();
                  if (s.is(BlockTags.LOGS) || s.is(BlockTags.PLANKS) || s.is(BlockTags.LEAVES) || s.is(BlockTags.WOOL) || s.is(BlockTags.ICE) || t == SoundType.WOOD || t == SoundType.WOOL) return 1.65F;
                  if (t == SoundType.METAL || t == SoundType.ANVIL || s.is(Blocks.OBSIDIAN)) return 0.32F;
                  return 0.62F;
              }

              public static float mass(BlockState s) {
                  SoundType t = s.getSoundType();
                  if (t == SoundType.ANVIL || s.is(Blocks.OBSIDIAN)) return 3.0F;
                  if (t == SoundType.METAL) return 2.2F;
                  if (t == SoundType.STONE) return 1.6F;
                  if (t == SoundType.WOOD) return 0.9F;
                  return 1.15F;
              }

              public static boolean tinted(BlockState s) {
                  return s.is(BlockTags.LEAVES) || s.is(Blocks.GRASS) || s.is(Blocks.TALL_GRASS) || s.is(Blocks.FERN) || s.is(Blocks.VINE) || s.is(Blocks.LILY_PAD);
              }

              public record Brk(BlockPos pos, int id, float dx, float dy, float dz) {
                  static void e(Brk m, FriendlyByteBuf b) {
                      b.writeBlockPos(m.pos);
                      b.writeInt(m.id);
                      b.writeFloat(m.dx);
                      b.writeFloat(m.dy);
                      b.writeFloat(m.dz);
                  }
                  static Brk d(FriendlyByteBuf b) {
                      return new Brk(b.readBlockPos(), b.readInt(), b.readFloat(), b.readFloat(), b.readFloat());
                  }
                  static void h(Brk m, Supplier<NetworkEvent.Context> c) {
                      c.get().enqueueWork(() -> DistExecutor.unsafeRunWhenOn(Dist.CLIENT, () -> () -> FPClient.onBrk(m)));
                      c.get().setPacketHandled(true);
                  }
              }

              public record Plc(BlockPos pos, int id) {
                  static void e(Plc m, FriendlyByteBuf b) {
                      b.writeBlockPos(m.pos);
                      b.writeInt(m.id);
                  }
                  static Plc d(FriendlyByteBuf b) {
                      return new Plc(b.readBlockPos(), b.readInt());
                  }
                  static void h(Plc m, Supplier<NetworkEvent.Context> c) {
                      c.get().enqueueWork(() -> DistExecutor.unsafeRunWhenOn(Dist.CLIENT, () -> () -> FPClient.onPlc(m)));
                      c.get().setPacketHandled(true);
                  }
              }

              public record Bnc(double x, double y, double z, int id, float pow, int style) {
                  static void e(Bnc m, FriendlyByteBuf b) {
                      b.writeDouble(m.x);
                      b.writeDouble(m.y);
                      b.writeDouble(m.z);
                      b.writeInt(m.id);
                      b.writeFloat(m.pow);
                      b.writeInt(m.style);
                  }
                  static Bnc d(FriendlyByteBuf b) {
                      return new Bnc(b.readDouble(), b.readDouble(), b.readDouble(), b.readInt(), b.readFloat(), b.readInt());
                  }
                  static void h(Bnc m, Supplier<NetworkEvent.Context> c) {
                      c.get().enqueueWork(() -> DistExecutor.unsafeRunWhenOn(Dist.CLIENT, () -> () -> FPClient.onBnc(m)));
                      c.get().setPacketHandled(true);
                  }
              }

              public record Exp(double x, double y, double z, float r, int[] ids) {
                  static void e(Exp m, FriendlyByteBuf b) {
                      b.writeDouble(m.x);
                      b.writeDouble(m.y);
                      b.writeDouble(m.z);
                      b.writeFloat(m.r);
                      b.writeVarIntArray(m.ids);
                  }
                  static Exp d(FriendlyByteBuf b) {
                      return new Exp(b.readDouble(), b.readDouble(), b.readDouble(), b.readFloat(), b.readVarIntArray(64));
                  }
                  static void h(Exp m, Supplier<NetworkEvent.Context> c) {
                      c.get().enqueueWork(() -> DistExecutor.unsafeRunWhenOn(Dist.CLIENT, () -> () -> FPClient.onExp(m)));
                      c.get().setPacketHandled(true);
                  }
              }

              public record Sync(boolean fg, int q, boolean clr) {
                  static void e(Sync m, FriendlyByteBuf b) {
                      b.writeBoolean(m.fg);
                      b.writeInt(m.q);
                      b.writeBoolean(m.clr);
                  }
                  static Sync d(FriendlyByteBuf b) {
                      return new Sync(b.readBoolean(), b.readInt(), b.readBoolean());
                  }
                  static void h(Sync m, Supplier<NetworkEvent.Context> c) {
                      c.get().enqueueWork(() -> DistExecutor.unsafeRunWhenOn(Dist.CLIENT, () -> () -> FPClient.onSync(m)));
                      c.get().setPacketHandled(true);
                  }
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/fp/FPBlockEntity.java
          package com.fp;

          import net.minecraft.core.BlockPos;
          import net.minecraft.nbt.CompoundTag;
          import net.minecraft.network.protocol.Packet;
          import net.minecraft.network.protocol.game.ClientGamePacketListener;
          import net.minecraft.network.syncher.EntityDataAccessor;
          import net.minecraft.network.syncher.EntityDataSerializers;
          import net.minecraft.network.syncher.SynchedEntityData;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.sounds.SoundSource;
          import net.minecraft.util.Mth;
          import net.minecraft.world.damagesource.DamageSource;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.entity.EntityType;
          import net.minecraft.world.entity.LivingEntity;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.level.block.Block;
          import net.minecraft.world.level.block.Blocks;
          import net.minecraft.world.level.block.SoundType;
          import net.minecraft.world.level.block.state.BlockState;
          import net.minecraft.world.level.material.FluidState;
          import net.minecraft.world.phys.AABB;
          import net.minecraft.world.phys.Vec3;
          import net.minecraft.world.phys.shapes.Shapes;
          import net.minecraft.world.phys.shapes.VoxelShape;
          import net.minecraftforge.network.NetworkHooks;
          import org.joml.Quaternionf;
          import org.joml.Vector3f;

          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.List;

          public class FPBlockEntity extends Entity {
              public static class Part {
                  public final float ox, oy, oz;
                  public final BlockState state;

                  public Part(float x, float y, float z, BlockState s) {
                      ox = x;
                      oy = y;
                      oz = z;
                      state = s;
                  }
              }

              private static final EntityDataAccessor<CompoundTag> D_PARTS = SynchedEntityData.defineId(FPBlockEntity.class, EntityDataSerializers.COMPOUND_TAG);
              private static final EntityDataAccessor<Float> D_QX = SynchedEntityData.defineId(FPBlockEntity.class, EntityDataSerializers.FLOAT);
              private static final EntityDataAccessor<Float> D_QY = SynchedEntityData.defineId(FPBlockEntity.class, EntityDataSerializers.FLOAT);
              private static final EntityDataAccessor<Float> D_QZ = SynchedEntityData.defineId(FPBlockEntity.class, EntityDataSerializers.FLOAT);
              private static final EntityDataAccessor<Float> D_QW = SynchedEntityData.defineId(FPBlockEntity.class, EntityDataSerializers.FLOAT);
              private static final EntityDataAccessor<Boolean> D_PERS = SynchedEntityData.defineId(FPBlockEntity.class, EntityDataSerializers.BOOLEAN);
              private static final EntityDataAccessor<Float> D_RAD = SynchedEntityData.defineId(FPBlockEntity.class, EntityDataSerializers.FLOAT);

              public double px, py, pz;
              public float vx, vy, vz, wx, wy, wz, mass = 1.2F, rest = 0.30F, fric = 0.52F, buoy = 0.65F, lastImp = 0.0F;
              public final Quaternionf rot = new Quaternionf();
              public boolean grounded = false;
              private boolean dropItem = true, settle = true;
              private int age = 0, restTicks = 0, bCd = 0;
              private final List<Part> parts = new ArrayList<>();
              private int lastHash = 0;
              private final Quaternionf prevQ = new Quaternionf(), currQ = new Quaternionf();
              private boolean qInit = false;
              private double lX, lY, lZ;
              private int lSteps = 0;

              public FPBlockEntity(EntityType<? extends FPBlockEntity> t, Level l) {
                  super(t, l);
              }

              public static FPBlockEntity spawn(ServerLevel l, double cx, double cy, double cz, List<Part> list, Vec3 vel, Vec3 ang, boolean persistent, boolean drop, boolean settleBlock) {
                  FPBlockEntity e = new FPBlockEntity(FPMod.FLUID_BLOCK.get(), l);
                  e.px = cx;
                  e.py = cy;
                  e.pz = cz;
                  e.vx = (float) vel.x;
                  e.vy = (float) vel.y;
                  e.vz = (float) vel.z;
                  e.wx = (float) ang.x;
                  e.wy = (float) ang.y;
                  e.wz = (float) ang.z;
                  e.rot.identity();
                  e.dropItem = drop;
                  e.settle = settleBlock;
                  e.entityData.set(D_PERS, persistent);
                  e.setParts(list);
                  e.syncAll();
                  return e;
              }

              public void setParts(List<Part> list) {
                  parts.clear();
                  parts.addAll(list);
                  int[] arr = new int[list.size() * 4];
                  float maxR = 0.5F, mSum = 0, rSum = 0, fSum = 0, bSum = 0;
                  for (int i = 0; i < list.size(); i++) {
                      Part p = list.get(i);
                      arr[i * 4] = Math.round(p.ox * 100.0F);
                      arr[i * 4 + 1] = Math.round(p.oy * 100.0F);
                      arr[i * 4 + 2] = Math.round(p.oz * 100.0F);
                      arr[i * 4 + 3] = Block.getId(p.state);
                      float d = (float) Math.sqrt(p.ox * p.ox + p.oy * p.oy + p.oz * p.oz) + 0.5F;
                      if (d > maxR) maxR = d;
                      mSum += FPMod.mass(p.state);
                      rSum += FPMod.rest(p.state);
                      fSum += FPMod.fric(p.state);
                      bSum += FPMod.buoy(p.state);
                  }
                  int n = Math.max(1, list.size());
                  mass = mSum;
                  rest = rSum / n;
                  fric = fSum / n;
                  buoy = bSum / n;
                  CompoundTag tag = new CompoundTag();
                  tag.putIntArray("p", arr);
                  entityData.set(D_PARTS, tag);
                  entityData.set(D_RAD, Math.min(4.0F, maxR));
              }

              public List<Part> getParts() {
                  int[] arr = entityData.get(D_PARTS).getIntArray("p");
                  int h = Arrays.hashCode(arr);
                  if (h != lastHash || parts.isEmpty()) {
                      lastHash = h;
                      parts.clear();
                      for (int i = 0; i + 3 < arr.length; i += 4) {
                          BlockState s = Block.stateById(arr[i + 3]);
                          if (!s.isAir()) parts.add(new Part(arr[i] / 100.0F, arr[i + 1] / 100.0F, arr[i + 2] / 100.0F, s));
                      }
                      if (parts.isEmpty()) parts.add(new Part(0, 0, 0, Blocks.STONE.defaultBlockState()));
                  }
                  return parts;
              }

              public boolean isPersistent() {
                  return entityData.get(D_PERS);
              }

              public float getRad() {
                  return entityData.get(D_RAD);
              }

              public Quaternionf getInterpQ(float pt) {
                  return prevQ.slerp(currQ, pt, new Quaternionf()).normalize();
              }

              private void syncAll() {
                  this.setPos(px, py - 0.5, pz);
                  float r = Math.max(0.49F, getRad());
                  this.setBoundingBox(new AABB(px - r, py - r, pz - r, px + r, py + r, pz + r));
                  this.setDeltaMovement(vx, vy, vz);
                  entityData.set(D_QX, rot.x);
                  entityData.set(D_QY, rot.y);
                  entityData.set(D_QZ, rot.z);
                  entityData.set(D_QW, rot.w);
              }

              @Override
              protected void defineSynchedData() {
                  CompoundTag t = new CompoundTag();
                  t.putIntArray("p", new int[]{0, 0, 0, Block.getId(Blocks.STONE.defaultBlockState())});
                  entityData.define(D_PARTS, t);
                  entityData.define(D_QX, 0F);
                  entityData.define(D_QY, 0F);
                  entityData.define(D_QZ, 0F);
                  entityData.define(D_QW, 1F);
                  entityData.define(D_PERS, false);
                  entityData.define(D_RAD, 0.5F);
              }

              @Override
              public void lerpTo(double x, double y, double z, float yr, float xr, int st, boolean tp) {
                  lX = x;
                  lY = y;
                  lZ = z;
                  lSteps = Math.max(1, Math.min(st, 3));
              }

              @Override
              public void tick() {
                  super.tick();
                  age++;
                  if (level().isClientSide()) {
                      xo = getX();
                      yo = getY();
                      zo = getZ();
                      if (lSteps > 0) {
                          setPos(getX() + (lX - getX()) / lSteps, getY() + (lY - getY()) / lSteps, getZ() + (lZ - getZ()) / lSteps);
                          lSteps--;
                      }
                      float r = Math.max(0.49F, getRad());
                      double cy = getY() + 0.5;
                      setBoundingBox(new AABB(getX() - r, cy - r, getZ() - r, getX() + r, cy + r, getZ() + r));
                      prevQ.set(currQ);
                      currQ.set(entityData.get(D_QX), entityData.get(D_QY), entityData.get(D_QZ), entityData.get(D_QW)).normalize();
                      if (!qInit) {
                          prevQ.set(currQ);
                          qInit = true;
                      }
                      return;
                  }
                  ServerLevel sLvl = (ServerLevel) level();
                  if (py < sLvl.getMinBuildHeight() - 16) {
                      discard();
                      return;
