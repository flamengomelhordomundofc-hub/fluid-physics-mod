              d.b.vx = vx; d.b.vy = vy; d.b.vz = vz;
              d.b.wx = (RNG.nextFloat() - 0.5F) * 0.72F; d.b.wy = (RNG.nextFloat() - 0.5F) * 0.72F; d.b.wz = (RNG.nextFloat() - 0.5F) * 0.72F;
              d.b.rot.rotationXYZ(RNG.nextFloat() * 6.28F, RNG.nextFloat() * 6.28F, RNG.nextFloat() * 6.28F).normalize();
              d.prevRot.set(d.b.rot);
              d.b.hx = hx; d.b.hy = hy; d.b.hz = hz;
              d.b.mass = PhysicsConfig.getMass(st) * 0.25F;
              d.b.restitution = PhysicsConfig.getRestitution(st);
              d.b.friction = PhysicsConfig.getFriction(st);
              d.b.buoyancy = PhysicsConfig.getBuoyancy(st);
              d.maxAge = 130 + RNG.nextInt(70);
              int col = Minecraft.getInstance().getBlockColors().getColor(st, lvl, BlockPos.containing(x, y, z), 0);
              if (col != -1) { d.r = ((col >> 16) & 255) / 255F; d.g = ((col >> 8) & 255) / 255F; d.bl = (col & 255) / 255F; }
              DEBRIS.add(d);
            }

            private static void spawnParticles(Level lvl, double x, double y, double z, BlockState st, int cnt, float spd, float spread) {
              for (int i = 0; i < cnt; i++) {
                spawnOneParticle(lvl, x + (RNG.nextDouble() - 0.5) * spread, y + (RNG.nextDouble() - 0.5) * spread, z + (RNG.nextDouble() - 0.5) * spread,
                  st, (RNG.nextFloat() - 0.5F) * spd * 2F, RNG.nextFloat() * spd * 1.4F + 0.05F, (RNG.nextFloat() - 0.5F) * spd * 2F,
                  0.032F + RNG.nextFloat() * 0.045F);
              }
            }

            private static void spawnOneParticle(Level lvl, double x, double y, double z, BlockState st, float vx, float vy, float vz, float size) {
              Minecraft mc = Minecraft.getInstance();
              TextureAtlasSprite sp = mc.getBlockRenderer().getBlockModelShaper().getParticleIcon(st);
              if (sp == null) return;
              int max = PhysicsConfig.getMaxParticles();
              while (PARTICLES.size() >= max) PARTICLES.remove(0);
              Particle3D p = new Particle3D();
              p.x = x; p.y = y; p.z = z; p.px = x; p.py = y; p.pz = z;
              p.vx = vx; p.vy = vy; p.vz = vz;
              p.rx = RNG.nextFloat() * 6.28F; p.ry = RNG.nextFloat() * 6.28F; p.rz = RNG.nextFloat() * 6.28F;
              p.prx = p.rx; p.pry = p.ry; p.prz = p.rz;
              p.wrx = (RNG.nextFloat() - 0.5F) * 0.6F; p.wry = (RNG.nextFloat() - 0.5F) * 0.6F; p.wrz = (RNG.nextFloat() - 0.5F) * 0.6F;
              p.size = size;
              p.rest = PhysicsConfig.getRestitution(st) * 0.9F + 0.1F;
              p.fric = PhysicsConfig.getFriction(st);
              p.buoy = PhysicsConfig.getBuoyancy(st);
              p.maxAge = 70 + RNG.nextInt(70);
              float fU = RNG.nextFloat() * 0.75F, fV = RNG.nextFloat() * 0.75F;
              p.u0 = Mth.lerp(fU, sp.getU0(), sp.getU1()); p.u1 = Mth.lerp(fU + 0.25F, sp.getU0(), sp.getU1());
              p.v0 = Mth.lerp(fV, sp.getV0(), sp.getV1()); p.v1 = Mth.lerp(fV + 0.25F, sp.getV0(), sp.getV1());
              if (PhysicsConfig.isTintedParticleBlock(st)) {
                int col = mc.getBlockColors().getColor(st, lvl, BlockPos.containing(x, y, z), 0);
                if (col != -1) { p.r = ((col >> 16) & 255) / 255F; p.g = ((col >> 8) & 255) / 255F; p.bl = (col & 255) / 255F; }
              }
              PARTICLES.add(p);
            }

            public static void tick(Minecraft mc) {
              if (mc.isPaused() || mc.level == null || mc.player == null) return;
              Level lvl = mc.level;
              Player pl = mc.player;

              // Detect player landing stomp & sprint footstep pebbles
              double py = pl.getY();
              double pVy = py - prevPlayerY;
              boolean stomp = pl.onGround() && !prevOnGround && pVy < -0.14;
              prevOnGround = pl.onGround();
              prevPlayerY = py;

              if (pl.onGround() && (pl.isSprinting() || stomp)) {
                BlockPos below = BlockPos.containing(pl.getX(), pl.getY() - 0.15, pl.getZ());
                BlockState floor = lvl.getBlockState(below);
                if (!floor.isAir() && floor.getFluidState().isEmpty()) {
                  if (stomp) {
                    spawnParticles(lvl, pl.getX(), pl.getY() + 0.06, pl.getZ(), floor, 14, 0.22F, 0.5F);
                  } else if ((pl.tickCount & 1) == 0) {
                    Vec3 mv = pl.getDeltaMovement();
                    spawnOneParticle(lvl, pl.getX() + (RNG.nextDouble() - 0.5) * 0.35, pl.getY() + 0.05, pl.getZ() + (RNG.nextDouble() - 0.5) * 0.35,
                      floor, (float) (-mv.x * 0.5) + (RNG.nextFloat() - 0.5F) * 0.08F, 0.09F + RNG.nextFloat() * 0.07F, (float) (-mv.z * 0.5) + (RNG.nextFloat() - 0.5F) * 0.08F,
                      0.028F + RNG.nextFloat() * 0.025F);
                  }
                }
              }

              boolean swung = pl.swinging && pl.swingTime == 1;
              Vec3 eye = pl.getEyePosition(), look = pl.getLookAngle();

              // Gather nearby entities for particle/debris interaction
              List<Entity> interactors = new ArrayList<>();
              for (Entity ent : mc.level.entitiesForRendering()) {
                if (ent.isAlive() && ent.distanceToSqr(pl) < 900.0) interactors.add(ent);
              }

              // Step 3D Rigid-Body Debris
              Iterator<Debris> dit = DEBRIS.iterator();
              while (dit.hasNext()) {
                Debris d = dit.next();
                d.age++;
                if (d.age >= d.maxAge) { dit.remove(); continue; }
                d.px = d.b.x; d.py = d.b.y; d.pz = d.b.z;
                d.prevRot.set(d.b.rot);
                OBBPhysicsSolver.step(lvl, d.b, 1.0F);

                if (d.b.lastImpactSpeed > 0.26F && RNG.nextInt(2) == 0) {
                  spawnParticles(lvl, d.b.x, d.b.y - d.b.hy, d.b.z, d.state, 2, 0.12F, 0.15F);
                }

                // Player stomp & swing interaction on debris
                if (stomp) {
                  double dx = d.b.x - pl.getX(), dy = d.b.y - pl.getY(), dz = d.b.z - pl.getZ();
                  double d2 = dx * dx + dy * dy + dz * dz;
                  if (d2 > 0.01 && d2 < 6.25) {
                    double dist = Math.sqrt(d2);
                    float f = (float) ((1.0 - dist / 2.5) * 0.25);
                    d.b.vx += (dx / dist) * f; d.b.vy += f + 0.09F; d.b.vz += (dz / dist) * f;
                    d.b.wx += (RNG.nextFloat() - 0.5F) * 0.5F; d.b.wz += (RNG.nextFloat() - 0.5F) * 0.5F;
                  }
                }
                if (swung) {
                  double dx = d.b.x - eye.x, dy = d.b.y - eye.y, dz = d.b.z - eye.z;
                  double d2 = dx * dx + dy * dy + dz * dz;
                  if (d2 > 0.04 && d2 < 12.25) {
                    double dist = Math.sqrt(d2);
                    double dot = (dx * look.x + dy * look.y + dz * look.z) / dist;
                    if (dot > 0.65) {
                      float f = (float) ((1.0 - dist / 3.5) * 0.52 + 0.16);
                      d.b.vx += look.x * f + (RNG.nextFloat() - 0.5F) * 0.15F;
                      d.b.vy += look.y * f + 0.14F;
                      d.b.vz += look.z * f + (RNG.nextFloat() - 0.5F) * 0.15F;
                      d.b.wx += (RNG.nextFloat() - 0.5F) * 0.9F; d.b.wz += (RNG.nextFloat() - 0.5F) * 0.9F;
                    }
                  }
                }

                // Direct hitbox push/kick from players & mobs
                for (Entity ent : interactors) {
                  AABB box = ent.getBoundingBox().inflate(0.18);
                  if (box.contains(d.b.x, d.b.y, d.b.z)) {
                    double evx = ent.getX() - ent.xo, evz = ent.getZ() - ent.zo;
                    double dx = d.b.x - ent.getX(), dz = d.b.z - ent.getZ();
                    double dl = Math.max(0.05, Math.sqrt(dx * dx + dz * dz));
                    double sp = Math.sqrt(evx * evx + evz * evz);
                    float kick = (float) Math.min(0.45, sp * 1.4 + 0.07);
                    d.b.vx += (float) ((dx / dl) * kick + evx * 0.8);
                    d.b.vy += 0.06F + (float) Math.min(0.12, sp * 0.4);
                    d.b.vz += (float) ((dz / dl) * kick + evz * 0.8);
                    d.b.wx += (float) (-(dz / dl) * kick * 1.8);
                    d.b.wz += (float) ((dx / dl) * kick * 1.8);
                  }
                }
              }

              // Step Interactive 3D Particles
              BlockPos.MutableBlockPos mp = new BlockPos.MutableBlockPos();
              Iterator<Particle3D> pit = PARTICLES.iterator();
              while (pit.hasNext()) {
                Particle3D p = pit.next();
                p.age++;
                if (p.age >= p.maxAge) { pit.remove(); continue; }
                p.px = p.x; p.py = p.y; p.pz = p.z;
                p.prx = p.rx; p.pry = p.ry; p.prz = p.rz;

                mp.set(Mth.floor(p.x), Mth.floor(p.y), Mth.floor(p.z));
                FluidState fl = lvl.getFluidState(mp);
                if (!fl.isEmpty()) {
                  Vec3 flow = fl.getFlow(lvl, mp);
                  p.vy += (-0.03F + 0.032F * p.buoy);
                  p.vx = (p.vx + (float) flow.x * 0.025F) * 0.85F;
                  p.vy *= 0.85F;
                  p.vz = (p.vz + (float) flow.z * 0.025F) * 0.85F;
                  p.wrx *= 0.88F; p.wry *= 0.88F; p.wrz *= 0.88F;
                } else {
                  p.vy -= 0.032F;
                  p.vx *= 0.985F; p.vy *= 0.985F; p.vz *= 0.985F;
                }

                // World collision per axis
                double nx = p.x + p.vx;
                if (hitsSolid(lvl, mp, nx, p.y, p.z)) { p.vx = -p.vx * p.rest; p.wrz = -p.vy * 4F; } else p.x = nx;
                double ny = p.y + p.vy;
                if (hitsSolid(lvl, mp, p.x, ny, p.z)) {
                  if (p.vy < 0) {
                    p.y = Math.floor(p.y) + p.size + 0.002;
                    p.vy = Math.abs(p.vy) > 0.06F ? -p.vy * p.rest : 0;
                    float drag = 1.0F - p.fric * 0.35F;
                    p.vx *= drag; p.vz *= drag;
                    p.wrx = p.vz * 6.5F; p.wrz = -p.vx * 6.5F; p.wry *= 0.85F;
                  } else {
                    p.vy = -p.vy * p.rest;
                  }
                } else p.y = ny;
                double nz = p.z + p.vz;
                if (hitsSolid(lvl, mp, p.x, p.y, nz)) { p.vz = -p.vz * p.rest; p.wrx = p.vy * 4F; } else p.z = nz;

                p.rx += p.wrx; p.ry += p.wry; p.rz += p.wrz;

                // Intense Player & Mob Particle Interaction (swirl, wake, stomp, sword gust)
                if (stomp) {
                  double dx = p.x - pl.getX(), dy = p.y - pl.getY(), dz = p.z - pl.getZ();
                  double d2 = dx * dx + dy * dy + dz * dz;
                  if (d2 > 0.005 && d2 < 7.5) {
                    double dist = Math.sqrt(d2);
                    float f = (float) ((1.0 - dist / 2.75) * 0.30);
                    p.vx += (dx / dist) * f; p.vy += f * 0.9F + 0.11F; p.vz += (dz / dist) * f;
                  }
                }
                if (swung) {
                  double dx = p.x - eye.x, dy = p.y - eye.y, dz = p.z - eye.z;
                  double d2 = dx * dx + dy * dy + dz * dz;
                  if (d2 > 0.04 && d2 < 14.0) {
                    double dist = Math.sqrt(d2);
                    double dot = (dx * look.x + dy * look.y + dz * look.z) / dist;
                    if (dot > 0.60) {
                      float f = (float) ((1.0 - dist / 3.75) * 0.58 + 0.15);
                      p.vx += look.x * f + (RNG.nextFloat() - 0.5F) * 0.16F;
                      p.vy += look.y * f + 0.10F;
                      p.vz += look.z * f + (RNG.nextFloat() - 0.5F) * 0.16F;
                      p.wrx += (RNG.nextFloat() - 0.5F) * 1.2F; p.wry += (RNG.nextFloat() - 0.5F) * 1.2F;
                    }
                  }
                }
                for (Entity ent : interactors) {
                  AABB box = ent.getBoundingBox().inflate(0.24);
                  if (box.contains(p.x, p.y, p.z)) {
                    double evx = ent.getX() - ent.xo, evy = ent.getY() - ent.yo, evz = ent.getZ() - ent.zo;
                    double dx = p.x - ent.getX(), dz = p.z - ent.getZ();
                    double dl = Math.max(0.04, Math.sqrt(dx * dx + dz * dz));
                    double sp = Math.sqrt(evx * evx + evz * evz);
                    // Push out + turbulent vortex swirl upward around player
                    float push = (float) Math.min(0.42, sp * 1.45 + 0.06);
                    p.vx += (float) ((dx / dl) * push + evx * 1.15 - (dz / dl) * sp * 0.45);
                    p.vy += (float) (0.045 + Math.min(0.14, sp * 0.55) + Math.max(0, evy * 0.5));
                    p.vz += (float) ((dz / dl) * push + evz * 1.15 + (dx / dl) * sp * 0.45);
                    p.wrx += (RNG.nextFloat() - 0.5F) * 0.8F;
                    p.wry += (RNG.nextFloat() - 0.5F) * 0.8F;
                    p.wrz += (RNG.nextFloat() - 0.5F) * 0.8F;
                  }
                }
              }
            }

            private static boolean hitsSolid(Level lvl, BlockPos.MutableBlockPos mp, double x, double y, double z) {
              mp.set(Mth.floor(x), Mth.floor(y), Mth.floor(z));
              BlockState s = lvl.getBlockState(mp);
              if (s.isAir()) return false;
              VoxelShape sh = s.getCollisionShape(lvl, mp);
              if (sh.isEmpty()) return false;
              double lx = x - mp.getX(), ly = y - mp.getY(), lz = z - mp.getZ();
              for (AABB a : sh.toAabbs()) {
                if (lx >= a.minX && lx <= a.maxX && ly >= a.minY && ly <= a.maxY && lz >= a.minZ && lz <= a.maxZ) return true;
              }
              return false;
            }

            @SuppressWarnings("deprecation")
            public static void render(PoseStack ps, Vec3 cam, float pt) {
              Minecraft mc = Minecraft.getInstance();
              if (mc.level == null || (DEBRIS.isEmpty() && PARTICLES.isEmpty())) return;
              MultiBufferSource.BufferSource buf = mc.renderBuffers().bufferSource();
              BlockRenderDispatcher brd = mc.getBlockRenderer();
              BlockPos.MutableBlockPos mp = new BlockPos.MutableBlockPos();
              Quaternionf q = new Quaternionf();

              ps.pushPose();
              ps.translate(-cam.x, -cam.y, -cam.z);

              // Render 3D Fractured Block Chunks
              for (int i = 0; i < DEBRIS.size(); i++) {
                Debris d = DEBRIS.get(i);
                double x = Mth.lerp(pt, d.px, d.b.x), y = Mth.lerp(pt, d.py, d.b.y), z = Mth.lerp(pt, d.pz, d.b.z);
                if (cam.distanceToSqr(x, y, z) > 2304.0) continue;
                float fade = d.age > d.maxAge - 16 ? Math.max(0.01F, (d.maxAge - d.age - pt) / 16.0F) : 1.0F;
                d.prevRot.slerp(d.b.rot, pt, q).normalize();
                mp.set(Mth.floor(x), Mth.floor(y), Mth.floor(z));
                int light = LevelRenderer.getLightColor(mc.level, mp);
                BakedModel model = brd.getBlockModel(d.state);

                ps.pushPose();
                ps.translate(x, y, z);
                ps.mulPose(q);
                ps.scale(d.b.hx * 2.0F * fade, d.b.hy * 2.0F * fade, d.b.hz * 2.0F * fade);
                ps.translate(-0.5, -0.5, -0.5);
                brd.getModelRenderer().renderModel(ps.last(), buf.getBuffer(ItemBlockRenderTypes.getRenderType(d.state, false)),
                  d.state, model, d.r, d.g, d.bl, light, OverlayTexture.NO_OVERLAY);
                ps.popPose();
              }

              // Render Batched 3D Interactive Micro-Cube Particles
              if (!PARTICLES.isEmpty()) {
                VertexConsumer vc = buf.getBuffer(Sheets.cutoutBlockSheet());
                for (int i = 0; i < PARTICLES.size(); i++) {
                  Particle3D p = PARTICLES.get(i);
                  double x = Mth.lerp(pt, p.px, p.x), y = Mth.lerp(pt, p.py, p.y), z = Mth.lerp(pt, p.pz, p.z);
                  if (cam.distanceToSqr(x, y, z) > 1600.0) continue;
                  float fade = p.age > p.maxAge - 12 ? Math.max(0.01F, (p.maxAge - p.age - pt) / 12.0F) : 1.0F;
                  float s = p.size * fade;
                  mp.set(Mth.floor(x), Mth.floor(y), Mth.floor(z));
                  int light = LevelRenderer.getLightColor(mc.level, mp);
                  q.rotationXYZ(Mth.lerp(pt, p.prx, p.rx), Mth.lerp(pt, p.pry, p.ry), Mth.lerp(pt, p.prz, p.rz));

                  ps.pushPose();
                  ps.translate(x, y, z);
                  ps.mulPose(q);
                  drawCube(vc, ps.last(), s, p.u0, p.u1, p.v0, p.v1, p.r, p.g, p.bl, light);
                  ps.popPose();
                }
              }

              ps.popPose();
              buf.endBatch();
            }

            private static void drawCube(VertexConsumer vc, PoseStack.Pose pose, float s, float u0, float u1, float v0, float v1, float r, float g, float b, int l) {
              Matrix4f m = pose.pose();
              Matrix3f n = pose.normal();
              // +Z Front
              q(vc,m,n, -s,-s, s,  s,-s, s,  s, s, s, -s, s, s, u0,u1,v0,v1, r*0.92F,g*0.92F,b*0.92F, 0,0,1, l);
              // -Z Back
              q(vc,m,n,  s,-s,-s, -s,-s,-s, -s, s,-s,  s, s,-s, u0,u1,v0,v1, r*0.92F,g*0.92F,b*0.92F, 0,0,-1, l);
              // +Y Top
              q(vc,m,n, -s, s, s,  s, s, s,  s, s,-s, -s, s,-s, u0,u1,v0,v1, r,g,b, 0,1,0, l);
              // -Y Bottom
              q(vc,m,n, -s,-s,-s,  s,-s,-s,  s,-s, s, -s,-s, s, u0,u1,v0,v1, r*0.65F,g*0.65F,b*0.65F, 0,-1,0, l);
              // +X Right
              q(vc,m,n,  s,-s, s,  s,-s,-s,  s, s,-s,  s, s, s, u0,u1,v0,v1, r*0.80F,g*0.80F,b*0.80F, 1,0,0, l);
              // -X Left
              q(vc,m,n, -s,-s,-s, -s,-s, s, -s, s, s, -s, s,-s, u0,u1,v0,v1, r*0.80F,g*0.80F,b*0.80F, -1,0,0, l);
            }

            private static void q(VertexConsumer vc, Matrix4f m, Matrix3f n,
                float x1,float y1,float z1, float x2,float y2,float z2, float x3,float y3,float z3, float x4,float y4,float z4,
                float u0,float u1,float v0,float v1, float r,float g,float b, float nx,float ny,float nz, int l) {
              vc.vertex(m,x1,y1,z1).color(r,g,b,1F).uv(u0,v1).overlayCoords(OverlayTexture.NO_OVERLAY).uv2(l).normal(n,nx,ny,nz).endVertex();
              vc.vertex(m,x2,y2,z2).color(r,g,b,1F).uv(u1,v1).overlayCoords(OverlayTexture.NO_OVERLAY).uv2(l).normal(n,nx,ny,nz).endVertex();
              vc.vertex(m,x3,y3,z3).color(r,g,b,1F).uv(u1,v0).overlayCoords(OverlayTexture.NO_OVERLAY).uv2(l).normal(n,nx,ny,nz).endVertex();
              vc.vertex(m,x4,y4,z4).color(r,g,b,1F).uv(u0,v0).overlayCoords(OverlayTexture.NO_OVERLAY).uv2(l).normal(n,nx,ny,nz).endVertex();
            }
          }
