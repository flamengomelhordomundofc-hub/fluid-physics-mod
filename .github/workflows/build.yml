              public static void onExp(FPMod.Exp m) {
                  Minecraft mc = Minecraft.getInstance();
                  if (mc.level == null) return;
                  float rad = m.r() * 4.2F;
                  for (Debris d : DEB) {
                      double dx = d.x - m.x(), dy = d.y - m.y(), dz = d.z - m.z(), dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
                      if (dist > 0.05 && dist < rad) {
                          float f = (float) ((1.0 - dist / rad) * 1.15);
                          d.vx += (float) ((dx / dist) * f);
                          d.vy += (float) ((dy / dist) * f + 0.28F * f);
                          d.vz += (float) ((dz / dist) * f);
                      }
                  }
                  for (P3D p : PTS) {
                      double dx = p.x - m.x(), dy = p.y - m.y(), dz = p.z - m.z(), dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
                      if (dist > 0.05 && dist < rad) {
                          float f = (float) ((1.0 - dist / rad) * 1.3);
                          p.vx += (float) ((dx / dist) * f);
                          p.vy += (float) ((dy / dist) * f + 0.32F * f);
                          p.vz += (float) ((dz / dist) * f);
                      }
                  }
                  int[] ids = m.ids();
                  if (ids.length == 0) return;
                  int fc = FPMod.qual == 0 ? 18 : (FPMod.qual == 2 ? 48 : 30);
                  for (int i = 0; i < fc; i++) {
                      BlockState st = Block.stateById(ids[RNG.nextInt(ids.length)]);
                      if (st.isAir()) continue;
                      double ox = (RNG.nextDouble() - 0.5) * m.r(), oy = RNG.nextDouble() * m.r() * 0.7, oz = (RNG.nextDouble() - 0.5) * m.r(), l = Math.max(0.3, Math.sqrt(ox * ox + oy * oy + oz * oz));
                      float spd = 0.4F + RNG.nextFloat() * 0.65F;
                      addDebris(mc.level, m.x() + ox * 0.5, m.y() + oy * 0.5, m.z() + oz * 0.5, st, (float) (ox / l) * spd, Math.max(0.24F, (float) (oy / l) * spd + 0.28F), (float) (oz / l) * spd, 0.24F + RNG.nextFloat() * 0.18F, 0.24F + RNG.nextFloat() * 0.18F, 0.24F + RNG.nextFloat() * 0.18F);
                  }
                  int pc = FPMod.qual == 0 ? 50 : (FPMod.qual == 2 ? 160 : 95);
                  for (int i = 0; i < pc; i++) {
                      BlockState st = Block.stateById(ids[RNG.nextInt(ids.length)]);
                      if (!st.isAir()) spawnRich(mc.level, m.x(), m.y(), m.z(), st, 1, 0.62F, 0.9F, i % 5 == 0 ? 1 : 0);
                  }
              }

              private static void addDebris(Level l, double x, double y, double z, BlockState st, float vx, float vy, float vz, float sx, float sy, float sz) {
                  if (st.getRenderShape() != RenderShape.MODEL) return;
                  while (DEB.size() >= FPMod.maxFrag()) DEB.remove(0);
                  Debris d = new Debris();
                  d.st = st;
                  d.x = x; d.y = y; d.z = z;
                  d.px = x; d.py = y; d.pz = z;
                  d.vx = vx; d.vy = vy; d.vz = vz;
                  d.wx = (RNG.nextFloat() - 0.5F) * 0.65F;
                  d.wy = (RNG.nextFloat() - 0.5F) * 0.65F;
                  d.wz = (RNG.nextFloat() - 0.5F) * 0.65F;
                  d.rot.rotationXYZ(RNG.nextFloat() * 6.28F, RNG.nextFloat() * 6.28F, RNG.nextFloat() * 6.28F).normalize();
                  d.pRot.set(d.rot);
                  d.sx = sx; d.sy = sy; d.sz = sz;
                  d.rest = FPMod.rest(st);
                  d.fric = FPMod.fric(st);
                  d.buoy = FPMod.buoy(st);
                  d.max = 120 + RNG.nextInt(70);
                  int c = Minecraft.getInstance().getBlockColors().getColor(st, l, BlockPos.containing(x, y, z), 0);
                  if (c != -1) {
                      d.r = ((c >> 16) & 255) / 255F;
                      d.g = ((c >> 8) & 255) / 255F;
                      d.b = (c & 255) / 255F;
                  }
                  DEB.add(d);
              }

              private static void spawnRich(Level l, double x, double y, double z, BlockState st, int cnt, float spd, float spr, int style) {
                  for (int i = 0; i < cnt; i++) {
                      int kind = style > 0 ? (i % 2 == 0 ? 3 : 2) : (i % 4 == 0 ? 2 : (i % 4 == 1 ? 1 : 0));
                      addPart(l, x + (RNG.nextDouble() - 0.5) * spr, y + (RNG.nextDouble() - 0.5) * spr, z + (RNG.nextDouble() - 0.5) * spr, st, (RNG.nextFloat() - 0.5F) * spd * 2F, RNG.nextFloat() * spd * 1.4F + 0.05F, (RNG.nextFloat() - 0.5F) * spd * 2F, kind, style);
                  }
              }

              @SuppressWarnings("deprecation")
              private static void addPart(Level l, double x, double y, double z, BlockState st, float vx, float vy, float vz, int kind, int style) {
                  Minecraft mc = Minecraft.getInstance();
                  TextureAtlasSprite sp = mc.getBlockRenderer().getBlockModelShaper().getParticleIcon(st);
                  if (sp == null) return;
                  while (PTS.size() >= FPMod.maxPart()) PTS.remove(0);
                  P3D p = new P3D();
                  p.x = x; p.y = y; p.z = z;
                  p.px = x; p.py = y; p.pz = z;
                  p.vx = vx; p.vy = vy; p.vz = vz;
                  p.rx = RNG.nextFloat() * 6.28F;
                  p.ry = RNG.nextFloat() * 6.28F;
                  p.rz = RNG.nextFloat() * 6.28F;
                  p.prx = p.rx; p.pry = p.ry; p.prz = p.rz;
                  p.wrx = (RNG.nextFloat() - 0.5F) * 0.75F;
                  p.wry = (RNG.nextFloat() - 0.5F) * 0.75F;
                  p.wrz = (RNG.nextFloat() - 0.5F) * 0.75F;
                  p.rest = FPMod.rest(st) * 0.9F + 0.14F;
                  p.fric = FPMod.fric(st);
                  p.buoy = FPMod.buoy(st);
                  if (kind == 1) {
                      p.sx = 0.065F + RNG.nextFloat() * 0.04F;
                      p.sy = 0.018F + RNG.nextFloat() * 0.015F;
                      p.sz = 0.045F + RNG.nextFloat() * 0.03F;
                      p.grav = 0.030F;
                      p.drag = 0.982F;
                      p.max = 85 + RNG.nextInt(55);
                  } else if (kind == 2) {
                      float s = 0.022F + RNG.nextFloat() * 0.024F;
                      p.sx = s; p.sy = s; p.sz = s;
                      p.grav = 0.009F;
                      p.drag = 0.945F;
                      p.max = 75 + RNG.nextInt(50);
                  } else if (kind == 3) {
                      float s = 0.032F + RNG.nextFloat() * 0.026F;
                      p.sx = s; p.sy = s; p.sz = s;
                      p.grav = 0.014F;
                      p.drag = 0.96F;
                      p.glow = true;
                      p.max = 45 + RNG.nextInt(35);
                  } else {
                      float s = 0.040F + RNG.nextFloat() * 0.038F;
                      p.sx = s * (0.8F + RNG.nextFloat() * 0.4F);
                      p.sy = s * (0.7F + RNG.nextFloat() * 0.5F);
                      p.sz = s * (0.8F + RNG.nextFloat() * 0.4F);
                      p.grav = 0.036F;
                      p.drag = 0.986F;
                      p.max = 100 + RNG.nextInt(65);
                  }
                  float fU = RNG.nextFloat() * 0.72F, fV = RNG.nextFloat() * 0.72F;
                  p.u0 = Mth.lerp(fU, sp.getU0(), sp.getU1());
                  p.u1 = Mth.lerp(fU + 0.28F, sp.getU0(), sp.getU1());
                  p.v0 = Mth.lerp(fV, sp.getV0(), sp.getV1());
                  p.v1 = Mth.lerp(fV + 0.28F, sp.getV0(), sp.getV1());
                  if (style == 1 && kind == 3) {
                      p.r = 0.85F; p.g = 0.45F; p.b = 1.0F;
                  } else if (style == 2 && kind == 3) {
                      p.r = 0.35F; p.g = 1.0F; p.b = 0.42F;
                  } else if (FPMod.tinted(st)) {
                      int c = mc.getBlockColors().getColor(st, l, BlockPos.containing(x, y, z), 0);
                      if (c != -1) {
                          p.r = ((c >> 16) & 255) / 255F;
                          p.g = ((c >> 8) & 255) / 255F;
                          p.b = (c & 255) / 255F;
                      }
                  }
                  PTS.add(p);
              }

              private static void tickClient(Minecraft mc) {
                  if (mc.isPaused() || mc.level == null || mc.player == null) return;
                  Level lvl = mc.level;
                  Player pl = mc.player;
                  double py = pl.getY(), pVy = py - prevY;
                  boolean stomp = pl.onGround() && !prevGnd && pVy < -0.14;
                  prevGnd = pl.onGround();
                  prevY = py;
                  if (pl.onGround() && (pl.isSprinting() || stomp)) {
                      BlockPos blw = BlockPos.containing(pl.getX(), pl.getY() - 0.15, pl.getZ());
                      BlockState fl = lvl.getBlockState(blw);
                      if (!fl.isAir() && fl.getFluidState().isEmpty()) {
                          if (stomp) {
                              spawnRich(lvl, pl.getX(), pl.getY() + 0.08, pl.getZ(), fl, 20, 0.26F, 0.6F, 0);
                          } else if ((pl.tickCount & 1) == 0) {
                              Vec3 mv = pl.getDeltaMovement();
                              addPart(lvl, pl.getX() + (RNG.nextDouble() - 0.5) * 0.35, pl.getY() + 0.06, pl.getZ() + (RNG.nextDouble() - 0.5) * 0.35, fl, (float) (-mv.x * 0.55) + (RNG.nextFloat() - 0.5F) * 0.09F, 0.10F + RNG.nextFloat() * 0.08F, (float) (-mv.z * 0.55) + (RNG.nextFloat() - 0.5F) * 0.09F, RNG.nextBoolean() ? 0 : 2, 0);
                          }
                      }
                  }
                  boolean swung = pl.swinging && pl.swingTime == 1;
                  Vec3 eye = pl.getEyePosition(), look = pl.getLookAngle();
                  List<Entity> ents = new ArrayList<>();
                  for (Entity e : mc.level.entitiesForRendering()) {
                      if (e.isAlive() && e.distanceToSqr(pl) < 900.0) ents.add(e);
                  }
                  BlockPos.MutableBlockPos mp = new BlockPos.MutableBlockPos();
                  Quaternionf dq = new Quaternionf(), nq = new Quaternionf();
                  Iterator<Debris> dit = DEB.iterator();
                  while (dit.hasNext()) {
                      Debris d = dit.next();
                      d.age++;
                      if (d.age >= d.max) {
                          dit.remove();
                          continue;
                      }
                      d.px = d.x; d.py = d.y; d.pz = d.z;
                      d.pRot.set(d.rot);
                      mp.set(Mth.floor(d.x), Mth.floor(d.y), Mth.floor(d.z));
                      FluidState fl = lvl.getFluidState(mp);
                      if (!fl.isEmpty()) {
                          Vec3 fw = fl.getFlow(lvl, mp);
                          d.vy += (-0.036F + 0.04F * d.buoy);
                          d.vx = (d.vx + (float) fw.x * 0.02F) * 0.85F;
                          d.vy *= 0.85F;
                          d.vz = (d.vz + (float) fw.z * 0.02F) * 0.85F;
                          d.wx *= 0.84F; d.wy *= 0.84F; d.wz *= 0.84F;
                      } else {
                          d.vy -= 0.038F;
                          d.vx *= 0.99F; d.vy *= 0.99F; d.vz *= 0.99F;
                          d.wx *= 0.97F; d.wy *= 0.97F; d.wz *= 0.97F;
                      }
                      double nx = d.x + d.vx;
                      if (hits(lvl, mp, nx, d.y, d.z)) {
                          d.vx = -d.vx * d.rest;
                          d.wz = -d.vy * 2.5F;
                      } else d.x = nx;
                      double ny = d.y + d.vy;
                      if (hits(lvl, mp, d.x, ny, d.z)) {
                          if (d.vy < 0) {
                              if (-d.vy > 0.22F) spawnRich(lvl, d.x, d.y, d.z, d.st, 3, 0.14F, 0.18F, 0);
                              d.y = Math.floor(d.y) + d.sy * 0.5 + 0.002;
                              d.vy = Math.abs(d.vy) > 0.07F ? -d.vy * d.rest : 0;
                              float dr = 1F - d.fric * 0.35F;
                              d.vx *= dr; d.vz *= dr;
                              d.wx = d.vz * 3.5F; d.wz = -d.vx * 3.5F; d.wy *= 0.85F;
                          } else d.vy = -d.vy * d.rest;
                      } else d.y = ny;
                      double nz = d.z + d.vz;
                      if (hits(lvl, mp, d.x, d.y, nz)) {
                          d.vz = -d.vz * d.rest;
                          d.wx = d.vy * 2.5F;
                      } else d.z = nz;
                      float wm = (float) Math.sqrt(d.wx * d.wx + d.wy * d.wy + d.wz * d.wz);
                      if (wm > 1e-4F) {
                          dq.fromAxisAngleRad(d.wx / wm, d.wy / wm, d.wz / wm, wm);
                          dq.mul(d.rot, nq);
                          d.rot.set(nq).normalize();
                      }
                      if (swung) {
                          double dx = d.x - eye.x, dy = d.y - eye.y, dz = d.z - eye.z, d2 = dx * dx + dy * dy + dz * dz;
                          if (d2 > 0.04 && d2 < 12.25) {
                              double dist = Math.sqrt(d2);
                              if ((dx * look.x + dy * look.y + dz * look.z) / dist > 0.62) {
                                  float f = (float) ((1.0 - dist / 3.5) * 0.55 + 0.16);
                                  d.vx += (float) (look.x * f);
                                  d.vy += (float) (look.y * f + 0.15F);
                                  d.vz += (float) (look.z * f);
                                  d.wx += (RNG.nextFloat() - 0.5F) * 0.9F;
                                  d.wz += (RNG.nextFloat() - 0.5F) * 0.9F;
                              }
                          }
                      }
                      for (Entity ent : ents) {
                          if (ent.getBoundingBox().inflate(0.2).contains(d.x, d.y, d.z)) {
                              double evx = ent.getX() - ent.xo, evz = ent.getZ() - ent.zo, dx = d.x - ent.getX(), dz = d.z - ent.getZ(), dl = Math.max(0.05, Math.sqrt(dx * dx + dz * dz)), sp = Math.sqrt(evx * evx + evz * evz);
                              float k = (float) Math.min(0.45, sp * 1.45 + 0.08);
                              d.vx += (float) ((dx / dl) * k + evx * 0.85);
                              d.vy += 0.07F + (float) Math.min(0.12, sp * 0.4);
                              d.vz += (float) ((dz / dl) * k + evz * 0.85);
                              d.wx += (float) (-(dz / dl) * k * 2F);
                              d.wz += (float) ((dx / dl) * k * 2F);
                          }
                      }
                  }
                  Iterator<P3D> pit = PTS.iterator();
                  while (pit.hasNext()) {
                      P3D p = pit.next();
                      p.age++;
                      if (p.age >= p.max) {
                          pit.remove();
                          continue;
                      }
                      p.px = p.x; p.py = p.y; p.pz = p.z;
                      p.prx = p.rx; p.pry = p.ry; p.prz = p.rz;
                      mp.set(Mth.floor(p.x), Mth.floor(p.y), Mth.floor(p.z));
                      FluidState fl = lvl.getFluidState(mp);
                      if (!fl.isEmpty()) {
                          Vec3 fw = fl.getFlow(lvl, mp);
                          p.vy += (-0.025F + 0.032F * p.buoy);
                          p.vx = (p.vx + (float) fw.x * 0.03F) * 0.84F;
                          p.vy *= 0.84F;
                          p.vz = (p.vz + (float) fw.z * 0.03F) * 0.84F;
                      } else {
                          p.vy -= p.grav;
                          p.vx *= p.drag; p.vy *= p.drag; p.vz *= p.drag;
                      }
                      double nx = p.x + p.vx;
                      if (hits(lvl, mp, nx, p.y, p.z)) {
                          p.vx = -p.vx * p.rest;
                          p.wrz = -p.vy * 4F;
                      } else p.x = nx;
                      double ny = p.y + p.vy;
                      if (hits(lvl, mp, p.x, ny, p.z)) {
                          if (p.vy < 0) {
                              p.y = Math.floor(p.y) + p.sy + 0.002;
                              p.vy = Math.abs(p.vy) > 0.055F ? -p.vy * p.rest : 0;
                              float dr = 1F - p.fric * 0.32F;
                              p.vx *= dr; p.vz *= dr;
                              p.wrx = p.vz * 6.5F; p.wrz = -p.vx * 6.5F; p.wry *= 0.85F;
                          } else p.vy = -p.vy * p.rest;
                      } else p.y = ny;
                      double nz = p.z + p.vz;
                      if (hits(lvl, mp, p.x, p.y, nz)) {
                          p.vz = -p.vz * p.rest;
                          p.wrx = p.vy * 4F;
                      } else p.z = nz;
                      p.rx += p.wrx; p.ry += p.wry; p.rz += p.wrz;
                      if (stomp) {
                          double dx = p.x - pl.getX(), dy = p.y - pl.getY(), dz = p.z - pl.getZ(), d2 = dx * dx + dy * dy + dz * dz;
                          if (d2 > 0.005 && d2 < 9.0) {
                              double dist = Math.sqrt(d2);
                              float f = (float) ((1.0 - dist / 3.0) * 0.34);
                              p.vx += (float) ((dx / dist) * f);
                              p.vy += f + 0.12F;
                              p.vz += (float) ((dz / dist) * f);
                          }
                      }
                      if (swung) {
                          double dx = p.x - eye.x, dy = p.y - eye.y, dz = p.z - eye.z, d2 = dx * dx + dy * dy + dz * dz;
                          if (d2 > 0.04 && d2 < 16.0) {
                              double dist = Math.sqrt(d2);
                              if ((dx * look.x + dy * look.y + dz * look.z) / dist > 0.58) {
                                  float f = (float) ((1.0 - dist / 4.0) * 0.65 + 0.16);
                                  p.vx += (float) (look.x * f) + (RNG.nextFloat() - 0.5F) * 0.18F;
                                  p.vy += (float) (look.y * f) + 0.12F;
                                  p.vz += (float) (look.z * f) + (RNG.nextFloat() - 0.5F) * 0.18F;
                                  p.wrx += (RNG.nextFloat() - 0.5F) * 1.4F;
                                  p.wry += (RNG.nextFloat() - 0.5F) * 1.4F;
                              }
                          }
                      }
                      for (Entity ent : ents) {
                          if (ent.getBoundingBox().inflate(0.30).contains(p.x, p.y, p.z)) {
                              double evx = ent.getX() - ent.xo, evy = ent.getY() - ent.yo, evz = ent.getZ() - ent.zo, dx = p.x - ent.getX(), dz = p.z - ent.getZ(), dl = Math.max(0.04, Math.sqrt(dx * dx + dz * dz)), sp = Math.sqrt(evx * evx + evz * evz);
                              float push = (float) Math.min(0.46, sp * 1.6 + 0.07);
                              p.vx += (float) ((dx / dl) * push + evx * 1.25 - (dz / dl) * sp * 0.55);
                              p.vy += 0.055F + (float) Math.min(0.16, sp * 0.6) + (float) Math.max(0, evy * 0.5);
                              p.vz += (float) ((dz / dl) * push + evz * 1.25 + (dx / dl) * sp * 0.55);
                              p.wrx += (RNG.nextFloat() - 0.5F) * 1.0F;
                              p.wry += (RNG.nextFloat() - 0.5F) * 1.0F;
                          }
                      }
                  }
              }

              private static boolean hits(Level l, BlockPos.MutableBlockPos mp, double x, double y, double z) {
                  mp.set(Mth.floor(x), Mth.floor(y), Mth.floor(z));
                  BlockState s = l.getBlockState(mp);
                  if (s.isAir()) return false;
                  VoxelShape sh = s.getCollisionShape(l, mp);
                  if (sh.isEmpty()) return false;
                  double lx = x - mp.getX(), ly = y - mp.getY(), lz = z - mp.getZ();
                  for (AABB a : sh.toAabbs()) {
                      if (lx >= a.minX && lx <= a.maxX && ly >= a.minY && ly <= a.maxY && lz >= a.minZ && lz <= a.maxZ) return true;
                  }
                  return false;
              }

              @SuppressWarnings("deprecation")
              private static void renderAll(PoseStack ps, Vec3 cam, float pt) {
                  Minecraft mc = Minecraft.getInstance();
                  if (mc.level == null || (DEB.isEmpty() && PTS.isEmpty())) return;
                  MultiBufferSource.BufferSource buf = mc.renderBuffers().bufferSource();
                  BlockRenderDispatcher brd = mc.getBlockRenderer();
                  BlockPos.MutableBlockPos mp = new BlockPos.MutableBlockPos();
                  Quaternionf q = new Quaternionf();
                  ps.pushPose();
                  ps.translate(-cam.x, -cam.y, -cam.z);
                  for (int i = 0; i < DEB.size(); i++) {
                      Debris d = DEB.get(i);
                      double x = Mth.lerp(pt, d.px, d.x), y = Mth.lerp(pt, d.py, d.y), z = Mth.lerp(pt, d.pz, d.z);
                      if (cam.distanceToSqr(x, y, z) > 2304.0) continue;
                      float fade = d.age > d.max - 16 ? Math.max(0.01F, (d.max - d.age - pt) / 16F) : 1F;
                      d.pRot.slerp(d.rot, pt, q).normalize();
                      mp.set(Mth.floor(x), Mth.floor(y), Mth.floor(z));
                      int lgt = LevelRenderer.getLightColor(mc.level, mp);
                      BakedModel mod = brd.getBlockModel(d.st);
                      ps.pushPose();
                      ps.translate(x, y, z);
                      ps.mulPose(q);
                      ps.scale(d.sx * fade, d.sy * fade, d.sz * fade);
                      ps.translate(-0.5, -0.5, -0.5);
                      brd.getModelRenderer().renderModel(ps.last(), buf.getBuffer(ItemBlockRenderTypes.getRenderType(d.st, false)), d.st, mod, d.r, d.g, d.b, lgt, OverlayTexture.NO_OVERLAY);
                      ps.popPose();
                  }
                  if (!PTS.isEmpty()) {
                      VertexConsumer vc = buf.getBuffer(Sheets.cutoutBlockSheet());
                      for (int i = 0; i < PTS.size(); i++) {
                          P3D p = PTS.get(i);
                          double x = Mth.lerp(pt, p.px, p.x), y = Mth.lerp(pt, p.py, p.y), z = Mth.lerp(pt, p.pz, p.z);
                          if (cam.distanceToSqr(x, y, z) > 1800.0) continue;
                          float pop = p.age < 3 ? Mth.clamp((p.age + pt) / 3F, 0.25F, 1F) : 1F;
                          float fade = p.age > p.max - 14 ? Math.max(0.01F, (p.max - p.age - pt) / 14F) : 1F;
                          float sc = pop * fade;
                          mp.set(Mth.floor(x), Mth.floor(y), Mth.floor(z));
                          int lgt = p.glow ? 15728880 : LevelRenderer.getLightColor(mc.level, mp);
                          q.rotationXYZ(Mth.lerp(pt, p.prx, p.rx), Mth.lerp(pt, p.pry, p.ry), Mth.lerp(pt, p.prz, p.rz));
                          ps.pushPose();
                          ps.translate(x, y, z);
                          ps.mulPose(q);
                          drawBox(vc, ps.last(), p.sx * sc, p.sy * sc, p.sz * sc, p.u0, p.u1, p.v0, p.v1, p.r, p.g, p.b, lgt);
                          ps.popPose();
                      }
                  }
                  ps.popPose();
                  buf.endBatch();
              }

              private static void drawBox(VertexConsumer vc, PoseStack.Pose ps, float x, float y, float z, float u0, float u1, float v0, float v1, float r, float g, float b, int l) {
                  Matrix4f m = ps.pose();
                  Matrix3f n = ps.normal();
                  q(vc, m, n, -x, -y, z, x, -y, z, x, y, z, -x, y, z, u0, u1, v0, v1, r * 0.94F, g * 0.94F, b * 0.94F, 0, 0, 1, l);
                  q(vc, m, n, x, -y, -z, -x, -y, -z, -x, y, -z, x, y, -z, u0, u1, v0, v1, r * 0.94F, g * 0.94F, b * 0.94F, 0, 0, -1, l);
                  q(vc, m, n, -x, y, z, x, y, z, x, y, -z, -x, y, -z, u0, u1, v0, v1, r, g, b, 0, 1, 0, l);
                  q(vc, m, n, -x, -y, -z, x, -y, -z, x, -y, z, -x, -y, z, u0, u1, v0, v1, r * 0.65F, g * 0.65F, b * 0.65F, 0, -1, 0, l);
                  q(vc, m, n, x, -y, z, x, -y, -z, x, y, -z, x, y, z, u0, u1, v0, v1, r * 0.82F, g * 0.82F, b * 0.82F, 1, 0, 0, l);
                  q(vc, m, n, -x, -y, -z, -x, -y, z, -x, y, z, -x, y, -z, u0, u1, v0, v1, r * 0.82F, g * 0.82F, b * 0.82F, -1, 0, 0, l);
              }

              private static void q(VertexConsumer vc, Matrix4f m, Matrix3f n, float x1, float y1, float z1, float x2, float y2, float z2, float x3, float y3, float z3, float x4, float y4, float z4, float u0, float u1, float v0, float v1, float r, float g, float b, float nx, float ny, float nz, int l) {
                  vc.vertex(m, x1, y1, z1).color(r, g, b, 1F).uv(u0, v1).overlayCoords(OverlayTexture.NO_OVERLAY).uv2(l).normal(n, nx, ny, nz).endVertex();
                  vc.vertex(m, x2, y2, z2).color(r, g, b, 1F).uv(u1, v1).overlayCoords(OverlayTexture.NO_OVERLAY).uv2(l).normal(n, nx, ny, nz).endVertex();
                  vc.vertex(m, x3, y3, z3).color(r, g, b, 1F).uv(u1, v0).overlayCoords(OverlayTexture.NO_OVERLAY).uv2(l).normal(n, nx, ny, nz).endVertex();
                  vc.vertex(m, x4, y4, z4).color(r, g, b, 1F).uv(u0, v0).overlayCoords(OverlayTexture.NO_OVERLAY).uv2(l).normal(n, nx, ny, nz).endVertex();
              }

              @Mod.EventBusSubscriber(modid = FPMod.MODID, bus = Mod.EventBusSubscriber.Bus.MOD, value = Dist.CLIENT)
              public static class ModBus {
                  @SubscribeEvent
                  public static void reg(EntityRenderersEvent.RegisterRenderers e) {
                      e.registerEntityRenderer(FPMod.FLUID_BLOCK.get(), BlockRend::new);
                      e.registerEntityRenderer(EntityType.ITEM, ItemRend::new);
                  }
              }

              @Mod.EventBusSubscriber(modid = FPMod.MODID, bus = Mod.EventBusSubscriber.Bus.FORGE, value = Dist.CLIENT)
              public static class ForgeBus {
                  @SubscribeEvent
                  public static void tick(TickEvent.ClientTickEvent e) {
                      if (e.phase == TickEvent.Phase.END) tickClient(Minecraft.getInstance());
                  }

                  @SubscribeEvent
                  public static void rend(RenderLevelStageEvent e) {
                      if (e.getStage() == RenderLevelStageEvent.Stage.AFTER_ENTITIES) {
                          renderAll(e.getPoseStack(), e.getCamera().getPosition(), e.getPartialTick());
                      }
                  }

                  @SubscribeEvent
                  public static void out(ClientPlayerNetworkEvent.LoggingOut e) {
                      clear();
                      DPUSH.clear();
                  }

                  @SubscribeEvent(priority = EventPriority.LOWEST)
                  public static void pre(RenderLivingEvent.Pre<?, ?> e) {
                      if (e.isCanceled()) return;
                      LivingEntity ent = e.getEntity();
                      if (ent.deathTime > 0 && !(ent instanceof Player)) {
                          PoseStack ps = e.getPoseStack();
                          ps.pushPose();
                          float t = Mth.clamp((ent.deathTime + e.getPartialTick()) / 14F, 0F, 1F), ease = 1F - (1F - t) * (1F - t);
                          ps.translate(0, Mth.sin(t * (float) Math.PI) * 0.22F * (1F - t), 0);
                          ps.mulPose(Axis.YP.rotationDegrees(((ent.getId() * 73) % 360) * 0.25F * ease));
                          ps.mulPose(Axis.XP.rotationDegrees(32F * ease * ((ent.getId() & 1) == 0 ? 1F : -1F)));
                          DPUSH.push(ent.getId());
                      }
                  }

                  @SubscribeEvent(priority = EventPriority.HIGHEST)
                  public static void post(RenderLivingEvent.Post<?, ?> e) {
                      if (!DPUSH.isEmpty() && DPUSH.peek() == e.getEntity().getId()) {
                          DPUSH.pop();
                          e.getPoseStack().popPose();
                      }
                  }
              }

              public static class BlockRend extends EntityRenderer<FPBlockEntity> {
                  public BlockRend(EntityRendererProvider.Context c) {
                      super(c);
                      shadowRadius = 0.45F;
                  }

                  @Override
                  @SuppressWarnings("deprecation")
                  public void render(FPBlockEntity ent, float yw, float pt, PoseStack ps, MultiBufferSource buf, int lgt) {
                      Minecraft mc = Minecraft.getInstance();
                      BlockRenderDispatcher brd = mc.getBlockRenderer();
                      ps.pushPose();
                      ps.translate(0.0, 0.50, 0.0);
                      ps.mulPose(ent.getInterpQ(pt));
                      for (FPBlockEntity.Part part : ent.getParts()) {
                          if (part.state.getRenderShape() != RenderShape.MODEL) continue;
                          BakedModel mod = brd.getBlockModel(part.state);
                          int col = mc.getBlockColors().getColor(part.state, ent.level(), ent.blockPosition(), 0);
                          float r = col == -1 ? 1F : ((col >> 16) & 255) / 255F;
                          float g = col == -1 ? 1F : ((col >> 8) & 255) / 255F;
                          float b = col == -1 ? 1F : (col & 255) / 255F;
                          ps.pushPose();
                          ps.translate(part.ox - 0.5, part.oy - 0.5, part.oz - 0.5);
                          brd.getModelRenderer().renderModel(ps.last(), buf.getBuffer(ItemBlockRenderTypes.getRenderType(part.state, false)), part.state, mod, r, g, b, lgt, OverlayTexture.NO_OVERLAY);
                          ps.popPose();
                      }
                      ps.popPose();
                      super.render(ent, yw, pt, ps, buf, lgt);
                  }

                  @Override
                  public ResourceLocation getTextureLocation(FPBlockEntity e) {
                      return InventoryMenu.BLOCK_ATLAS;
                  }
              }

              public static class ItemRend extends EntityRenderer<ItemEntity> {
                  static final Map<Integer, Spin> SPINS = new HashMap<>();
                  private final ItemRenderer ir;

                  static class Spin {
                      float p, y, r, vp, vy, vr;
                      long ns;

                      Spin(int s) {
                          y = (s * 137.5F) % 360F;
                          p = (s * 53F) % 360F;
                          r = (s * 29F) % 360F;
                          vp = ((s & 1) == 0 ? 1F : -1F) * (160F + (s % 140));
                          vy = ((s & 2) == 0 ? 1F : -1F) * (140F + (s % 120));
                          vr = ((s & 4) == 0 ? 1F : -1F) * (120F + (s % 100));
                          ns = System.nanoTime();
                      }
                  }

                  public ItemRend(EntityRendererProvider.Context c) {
                      super(c);
                      ir = c.getItemRenderer();
                      shadowRadius = 0.15F;
                      shadowStrength = 0.72F;
                  }

                  @Override
                  public void render(ItemEntity ent, float yr, float pt, PoseStack ps, MultiBufferSource buf, int lgt) {
                      ItemStack st = ent.getItem();
                      if (st.isEmpty()) return;
                      long now = System.nanoTime();
                      if (SPINS.size() > 512) SPINS.values().removeIf(s -> now - s.ns > 5000000000L);
                      Spin sp = SPINS.computeIfAbsent(ent.getId(), Spin::new);
                      float dt = Mth.clamp((now - sp.ns) / 1000000000F, 0F, 0.05F);
                      sp.ns = now;
                      BakedModel m = ir.getModel(st, ent.level(), null, ent.getId());
                      boolean d3 = m.isGui3d();
                      Vec3 v = ent.getDeltaMovement();
                      float hs = (float) v.horizontalDistance();
                      if (ent.isInWater()) {
                          float w = Mth.sin((ent.tickCount + pt) * 0.14F + ent.getId()) * 16F;
                          sp.p = Mth.lerp(Math.min(1F, dt * 6F), sp.p, (d3 ? 0F : 90F) + w);
                          sp.r = Mth.lerp(Math.min(1F, dt * 6F), sp.r, w * 0.7F);
                          sp.y += (18F + hs * 180F) * dt;
                      } else if (ent.onGround()) {
                          sp.p = Mth.lerp(Math.min(1F, dt * 14F), sp.p, d3 ? Math.round(sp.p / 90F) * 90F : 90F);
                          sp.r = Mth.lerp(Math.min(1F, dt * 14F), sp.r, d3 ? Math.round(sp.r / 90F) * 90F : 0F);
                          sp.y += hs * 420F * dt;
                      } else {
                          sp.p += (sp.vp + (float) v.y * 180F) * dt;
                          sp.y += (sp.vy + hs * 220F) * dt;
                          sp.r += sp.vr * dt;
                      }
                      int cp = st.getCount() > 48 ? 4 : (st.getCount() > 16 ? 3 : (st.getCount() > 1 ? 2 : 1));
                      ps.pushPose();
                      ps.translate(0, ent.isInWater() ? 0.12F + Mth.sin((ent.tickCount + pt) * 0.15F + ent.getId()) * 0.03F : (d3 ? 0.12F : 0.035F), 0);
                      ps.mulPose(Axis.YP.rotationDegrees(sp.y));
                      ps.mulPose(Axis.XP.rotationDegrees(sp.p));
                      ps.mulPose(Axis.ZP.rotationDegrees(sp.r));
                      for (int i = 0; i < cp; i++) {
                          ps.pushPose();
                          if (i > 0) {
                              float o = i * 0.04F;
                              ps.translate((i & 1) == 0 ? o : -o, 0, d3 ? o * 0.6F : -o * 0.85F);
                              ps.mulPose(Axis.ZP.rotationDegrees(i * 19F));
                          }
                          ir.render(st, ItemDisplayContext.GROUND, false, ps, buf, lgt, OverlayTexture.NO_OVERLAY, m);
                          ps.popPose();
                      }
                      ps.popPose();
                      super.render(ent, yr, pt, ps, buf, lgt);
                  }

                  @Override
                  public ResourceLocation getTextureLocation(ItemEntity e) {
                      return InventoryMenu.BLOCK_ATLAS;
                  }
              }
          }
          EOF

      - name: Build JAR
        run: gradle build --no-daemon --console=plain && ls -lh build/libs/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluidPhysics-V2-1.20.1-Forge
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v2.0.$GITHUB_RUN_NUMBER" build/libs/*.jar \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Fluid Physics V2.$GITHUB_RUN_NUMBER" \
            --notes "Fluid Physics V2 (Minecraft 1.20.1 Forge) - Itens: Physical e Super Glue (/physics items)"
