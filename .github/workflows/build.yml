              private void interactEntities(ServerLevel sLvl, BlockState st, float spd) {
                  float r = getRad();
                  List<Entity> list = sLvl.getEntities(this, getBoundingBox().inflate(0.35));
                  for (Entity ent : list) {
                      if (ent instanceof FPBlockEntity other && other.getId() > getId()) {
                          double dx = px - other.px, dy = py - other.py, dz = pz - other.pz;
                          double d2 = dx * dx + dy * dy + dz * dz;
