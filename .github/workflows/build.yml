                  ServerLevel sLevel = (ServerLevel) this.level();
                  if (this.getY() < sLevel.getMinBuildHeight() - 16) {
                      this.discard();
                      return;
                  }

                  int mode = getMode();
                  if (mode == MODE_PLACEMENT_SETTLE) {
                      tickPlacementSettle(sLevel);
                  } else {
                      tickRigidBody(sLevel, mode);
                  }
