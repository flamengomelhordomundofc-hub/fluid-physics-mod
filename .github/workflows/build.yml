          package com.fluidphysics.client;

          import com.fluidphysics.physics.OBBPhysicsSolver;
          import com.fluidphysics.physics.PhysicsConfig;
          import com.mojang.blaze3d.vertex.PoseStack;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.multiplayer.ClientLevel;
          import net.minecraft.client.renderer.LevelRenderer;
          import net.minecraft.client.renderer.MultiBufferSource;
          import net.minecraft.client.renderer.block.BlockRenderDispatcher;
          import net.minecraft.client.renderer.texture.OverlayTexture;
          import net.minecraft.core.BlockPos;
          import net.minecraft.util.Mth;
          import net.minecraft.util.RandomSource;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.level.block.Block;
          import net.minecraft.world.level.block.state.BlockState;
          import net.minecraft.world.phys.Vec3;
          import net.minecraftforge.client.event.RenderLevelStageEvent;
          import org.joml.Quaternionf;

          import java.util.ArrayList;
          import java.util.Iterator;
          import java.util.List;

          public final class ClientPhysicsManager {

              private static final class Fragment {
                  final OBBPhysicsSolver.RigidBody body = new OBBPhysicsSolver.RigidBody();
                  final Quaternionf prevRot = new Quaternionf();
                  double prevX, prevY, prevZ;
                  final BlockState state;
                  final float baseScale;
                  int age = 0;
                  final int maxAge;

                  Fragment(BlockState state, double x, double y, double z, float scale, int maxAge) {
                      this.state = state;
                      this.baseScale = scale;
                      this.maxAge = maxAge;
                      this.body.x = x;
                      this.body.y = y;
                      this.body.z = z;
                      this.prevX = x;
                      this.prevY = y;
                      this.prevZ = z;
                      float half = scale * 0.5F;
                      this.body.hx = half;
                      this.body.hy = half;
                      this.body.hz = half;
                      this.body.mass = Math.max(0.25F, PhysicsConfig.getMass(state) * scale);
                      this.body.restitution = PhysicsConfig.getRestitution(state);
                      this.body.friction = PhysicsConfig.getFriction(state);
                      this.body.buoyancy = PhysicsConfig.getBuoyancy(state);
                      this.body.highPrecision = false;
                  }
              }

              private static final List<Fragment> FRAGMENTS = new ArrayList<>();

              public static void clearAll() {
                  FRAGMENTS.clear();
              }

              private static void addFragment(Fragment f) {
                  int limit = PhysicsConfig.getMaxFragments();
                  while (FRAGMENTS.size() >= limit && !FRAGMENTS.isEmpty()) {
                      FRAGMENTS.remove(0);
                  }
                  FRAGMENTS.add(f);
              }

              public static void spawnBlockBreak(BlockPos pos, BlockState state, float dx, float dy, float dz) {
                  ClientLevel level = Minecraft.getInstance().level;
                  if (level == null || state.isAir()) return;
                  RandomSource rand = level.random;

                  int count = PhysicsConfig.qualityLevel == 0 ? 6 : (PhysicsConfig.qualityLevel == 2 ? 18 : 11);
                  for (int i = 0; i < count; i++) {
                      float scale = 0.16F + rand.nextFloat() * 0.14F;
                      double fx = pos.getX() + 0.18 + rand.nextDouble() * 0.64;
                      double fy = pos.getY() + 0.18 + rand.nextDouble() * 0.64;
                      double fz = pos.getZ() + 0.18 + rand.nextDouble() * 0.64;

                      Fragment f = new Fragment(state, fx, fy, fz, scale, 70 + rand.nextInt(50));
                      f.body.vx = dx + (rand.nextFloat() - 0.5F) * 0.28F;
                      f.body.vy = dy + 0.08F + rand.nextFloat() * 0.22F;
                      f.body.vz = dz + (rand.nextFloat() - 0.5F) * 0.28F;
                      f.body.wx = (rand.nextFloat() - 0.5F) * 0.7F;
                      f.body.wy = (rand.nextFloat() - 0.5F) * 0.7F;
                      f.body.wz = (rand.nextFloat() - 0.5F) * 0.7F;
                      addFragment(f);
                  }
              }

              public static void spawnPlaceImpact(BlockPos pos, BlockState state) {
                  ClientLevel level = Minecraft.getInstance().level;
                  if (level == null || state.isAir()) return;
                  RandomSource rand = level.random;

                  int count = PhysicsConfig.qualityLevel == 0 ? 3 : 6;
                  for (int i = 0; i < count; i++) {
                      float angle = rand.nextFloat() * ((float) Math.PI * 2.0F);
                      float speed = 0.08F + rand.nextFloat() * 0.10F;
                      float scale = 0.09F + rand.nextFloat() * 0.06F;
                      Fragment f = new Fragment(state, pos.getX() + 0.5, pos.getY() + 0.12, pos.getZ() + 0.5, scale, 30 + rand.nextInt(20));
                      f.body.vx = Mth.cos(angle) * speed;
                      f.body.vy = 0.07F + rand.nextFloat() * 0.09F;
                      f.body.vz = Mth.sin(angle) * speed;
                      f.body.wx = (rand.nextFloat() - 0.5F) * 0.6F;
                      f.body.wz = (rand.nextFloat() - 0.5F) * 0.6F;
                      addFragment(f);
                  }
              }

              public static void spawnBounceParticles(double x, double y, double z, BlockState state, float intensity) {
                  ClientLevel level = Minecraft.getInstance().level;
                  if (level == null || state.isAir()) return;
                  RandomSource rand = level.random;

                  int count = Math.min(12, Math.max(3, (int) (intensity * 10)));
                  for (int i = 0; i < count; i++) {
                      float scale = 0.10F + rand.nextFloat() * 0.09F;
                      Fragment f = new Fragment(state, x, y + 0.1, z, scale, 40 + rand.nextInt(30));
                      f.body.vx = (rand.nextFloat() - 0.5F) * 0.25F * intensity;
                      f.body.vy = (0.10F + rand.nextFloat() * 0.20F) * intensity;
                      f.body.vz = (rand.nextFloat() - 0.5F) * 0.25F * intensity;
                      f.body.wx = (rand.nextFloat() - 0.5F) * 0.8F;
                      f.body.wy = (rand.nextFloat() - 0.5F) * 0.8F;
                      f.body.wz = (rand.nextFloat() - 0.5F) * 0.8F;
                      addFragment(f);
                  }
              }

              public static void spawnExplosion(double x, double y, double z, float radius, int[] sampleBlockIds) {
                  ClientLevel level = Minecraft.getInstance().level;
                  if (level == null || sampleBlockIds == null || sampleBlockIds.length == 0) return;
                  RandomSource rand = level.random;

                  int count = PhysicsConfig.qualityLevel == 0 ? 16 : (PhysicsConfig.qualityLevel == 2 ? 48 : 28);
                  for (int i = 0; i < count; i++) {
                      BlockState st = Block.stateById(sampleBlockIds[rand.nextInt(sampleBlockIds.length)]);
                      if (st.isAir()) continue;

                      float scale = 0.16F + rand.nextFloat() * 0.18F;
                      double ox = (rand.nextDouble() - 0.5) * radius * 0.6;
                      double oy = (rand.nextDouble() - 0.5) * radius * 0.4;
                      double oz = (rand.nextDouble() - 0.5) * radius * 0.6;

                      Fragment f = new Fragment(st, x + ox, y + oy, z + oz, scale, 80 + rand.nextInt(60));
                      f.body.vx = (float) (ox * 0.35 + (rand.nextFloat() - 0.5F) * 0.45F);
                      f.body.vy = 0.25F + rand.nextFloat() * 0.45F;
                      f.body.vz = (float) (oz * 0.35 + (rand.nextFloat() - 0.5F) * 0.45F);
                      f.body.wx = (rand.nextFloat() - 0.5F) * 1.1F;
                      f.body.wy = (rand.nextFloat() - 0.5F) * 1.1F;
                      f.body.wz = (rand.nextFloat() - 0.5F) * 1.1F;
                      addFragment(f);
                  }
              }

              public static void tick() {
                  Minecraft mc = Minecraft.getInstance();
                  ClientLevel level = mc.level;
                  if (level == null || mc.isPaused() || FRAGMENTS.isEmpty()) return;

                  Player player = mc.player;
                  Vec3 pPos = player != null ? player.position() : null;
                  Vec3 pVel = player != null ? player.getDeltaMovement() : Vec3.ZERO;
                  double pSpeed = pVel.length();

                  Iterator<Fragment> it = FRAGMENTS.iterator();
                  while (it.hasNext()) {
                      Fragment f = it.next();
                      f.age++;
                      if (f.age >= f.maxAge) {
                          it.remove();
                          continue;
                      }

                      f.prevX = f.body.x;
                      f.prevY = f.body.y;
                      f.prevZ = f.body.z;
                      f.prevRot.set(f.body.rot);

                      if (pPos != null && pSpeed > 0.03) {
                          double dx = f.body.x - pPos.x;
                          double dy = f.body.y - (pPos.y + 0.5);
                          double dz = f.body.z - pPos.z;
                          double distSq = dx * dx + dy * dy + dz * dz;
                          if (distSq > 0.0004 && distSq < 0.95) {
                              double dist = Math.sqrt(distSq);
                              float kick = (float) Math.min(0.32, pSpeed * 0.9 + 0.06);
                              f.body.vx += (float) ((dx / dist) * kick + pVel.x * 0.5);
                              f.body.vy += 0.08F;
                              f.body.vz += (float) ((dz / dist) * kick + pVel.z * 0.5);
                              f.body.wx += (float) (-(dz / dist) * kick * 1.5);
                              f.body.wz += (float) ((dx / dist) * kick * 1.5);
                          }
                      }

                      OBBPhysicsSolver.step(level, f.body, 1.0F);
                  }
              }

              public static void render(RenderLevelStageEvent event) {
                  if (event.getStage() != RenderLevelStageEvent.Stage.AFTER_ENTITIES) return;
                  Minecraft mc = Minecraft.getInstance();
                  ClientLevel level = mc.level;
                  if (level == null || FRAGMENTS.isEmpty()) return;

                  PoseStack poseStack = event.getPoseStack();
                  Vec3 cam = event.getCamera().getPosition();
                  float partialTick = event.getPartialTick();
                  MultiBufferSource.BufferSource bufferSource = mc.renderBuffers().bufferSource();
                  BlockRenderDispatcher dispatcher = mc.getBlockRenderer();

                  Quaternionf interpQuat = new Quaternionf();
                  BlockPos.MutableBlockPos lightPos = new BlockPos.MutableBlockPos();

                  for (Fragment f : FRAGMENTS) {
                      float lifeFrac = (float) f.age / (float) f.maxAge;
                      float shrink = lifeFrac > 0.78F ? Mth.clamp(1.0F - (lifeFrac - 0.78F) / 0.22F, 0.0F, 1.0F) : 1.0F;
                      float scale = f.baseScale * shrink;
                      if (scale <= 0.01F) continue;

                      double rx = Mth.lerp(partialTick, f.prevX, f.body.x) - cam.x;
                      double ry = Mth.lerp(partialTick, f.prevY, f.body.y) - cam.y;
                      double rz = Mth.lerp(partialTick, f.prevZ, f.body.z) - cam.z;

                      lightPos.set(Mth.floor(f.body.x), Mth.floor(f.body.y), Mth.floor(f.body.z));
                      int packedLight = LevelRenderer.getLightColor(level, lightPos);

                      f.prevRot.slerp(f.body.rot, partialTick, interpQuat).normalize();

                      poseStack.pushPose();
                      poseStack.translate(rx, ry, rz);
                      poseStack.mulPose(interpQuat);
                      poseStack.scale(scale, scale, scale);
                      poseStack.translate(-0.5, -0.5, -0.5);

                      dispatcher.renderSingleBlock(f.state, poseStack, bufferSource, packedLight, OverlayTexture.NO_OVERLAY);
                      poseStack.popPose();
                  }

                  bufferSource.endBatch();
              }
          }
