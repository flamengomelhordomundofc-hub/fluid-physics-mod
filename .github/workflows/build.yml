              public record BlockBreakPacket(BlockPos pos, int stateId, float dx, float dy, float dz) {
                  public static void encode(BlockBreakPacket msg, FriendlyByteBuf buf) {
                      buf.writeBlockPos(msg.pos);
                      buf.writeInt(msg.stateId);
                      buf.writeFloat(msg.dx);
                      buf.writeFloat(msg.dy);
                      buf.writeFloat(msg.dz);
                  }
                  public static BlockBreakPacket decode(FriendlyByteBuf buf) {
                      return new BlockBreakPacket(buf.readBlockPos(), buf.readInt(), buf.readFloat(), buf.readFloat(), buf.readFloat());
                  }
                  public static void handle(BlockBreakPacket msg, Supplier<NetworkEvent.Context> ctx) {
                      ctx.get().enqueueWork(() -> DistExecutor.unsafeRunWhenOn(Dist.CLIENT, () -> () -> ClientPacketHandler.handleBlockBreak(msg)));
