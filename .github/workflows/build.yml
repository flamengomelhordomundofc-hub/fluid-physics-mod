              private void tickPlacementSettle(ServerLevel sLevel) {
                  BlockPos target = getTargetPos();
                  int duration = 5;
                  float t = Mth.clamp((float) this.age / (float) duration, 0.0F, 1.0F);

                  float ease = 1.0F - (1.0F - t) * (1.0F - t) * (1.0F - t);
                  float wobble = (float) Math.exp(-t * 3.5) * Mth.cos(t * 9.0F);
                  float remaining = 1.0F - ease;

                  body.x = target.getX() + 0.5 + startOffsetX * remaining;
                  body.y = target.getY() + 0.5 + startOffsetY * remaining;
                  body.z = target.getZ() + 0.5 + startOffsetZ * remaining;

                  float angle = startTiltAngle * wobble;
                  if (Math.abs(angle) > 0.002F) {
                      body.rot.fromAxisAngleRad(tiltAxisX, 0.1F, tiltAxisZ, angle).normalize();
                  } else {
                      body.rot.identity();
                  }
                  syncBodyToEntity();

                  if (this.age >= duration) {
                      BlockState state = getBlockState();
                      if (sLevel.getBlockState(target).canBeReplaced()) {
                          sLevel.setBlock(target, state, 3);
                          SoundType sound = state.getSoundType();
                          sLevel.playSound(
                              null, target.getX() + 0.5, target.getY() + 0.5, target.getZ() + 0.5,
                              sound.getPlaceSound(), SoundSource.BLOCKS, 0.85F, 0.92F + sLevel.random.nextFloat() * 0.16F
                          );
                          ModNetwork.sendPlaceImpact(sLevel, target, state);
                      } else if (dropItem) {
                          Block.popResource(sLevel, target, new ItemStack(state.getBlock()));
                      }
                      this.discard();
                  }
              }

              private void tickRigidBody(ServerLevel sLevel, int mode) {
                  BlockState state = getBlockState();
                  if (bounceCooldown > 0) bounceCooldown--;

                  body.mass = PhysicsConfig.getMass(state);
                  body.restitution = PhysicsConfig.getRestitution(state);
                  body.friction = PhysicsConfig.getFriction(state);
                  body.buoyancy = PhysicsConfig.getBuoyancy(state);

                  OBBPhysicsSolver.step(sLevel, body, 1.0F);

                  if (body.lastImpactSpeed > 0.22F && bounceCooldown == 0) {
                      bounceCooldown = 3;
                      SoundType sound = state.getSoundType();
                      float vol = Mth.clamp(body.lastImpactSpeed * 1.1F, 0.25F, 1.1F);
                      float pitch = 0.82F + sLevel.random.nextFloat() * 0.28F;
                      sLevel.playSound(null, body.x, body.y, body.z, sound.getFallSound(), SoundSource.BLOCKS, vol, pitch);
                      ModNetwork.sendBounceParticles(sLevel, body.x, body.y - 0.35, body.z, state, body.lastImpactSpeed);

                      if (mode == MODE_EXPLOSION_DEBRIS && !settleAsBlock && body.lastImpactSpeed > 0.52F) {
                          ModNetwork.sendBlockBreak(sLevel, BlockPos.containing(body.x, body.y, body.z), state, body.vx, body.vy, body.vz);
                          this.discard();
                          return;
                      }
                  }

                  List<Entity> nearby = sLevel.getEntities(this, this.getBoundingBox().inflate(0.28), e -> e instanceof LivingEntity && e.isAlive());
                  float speed = (float) Math.sqrt(body.vx * body.vx + body.vy * body.vy + body.vz * body.vz);
                  for (Entity ent : nearby) {
                      Vec3 entVel = ent.getDeltaMovement();
                      double dx = body.x - ent.getX();
                      double dy = body.y - (ent.getY() + ent.getBbHeight() * 0.5);
                      double dz = body.z - ent.getZ();
                      double distSq = dx * dx + dy * dy + dz * dz;
                      if (distSq < 0.001) continue;
                      double dist = Math.sqrt(distSq);

                      if (speed > 0.45F && body.vy < -0.25F && body.mass >= 1.5F && this.age > 4) {
                          float dmg = Mth.clamp(speed * body.mass * 3.8F, 2.0F, 18.0F);
                          boolean isAnvil = state.getSoundType() == SoundType.ANVIL;
                          ent.hurt(isAnvil ? this.damageSources().anvil(this) : this.damageSources().fallingBlock(this), dmg);
                          body.vy = Math.abs(body.vy) * 0.35F + 0.12F;
                          body.wx += (sLevel.random.nextFloat() - 0.5F) * 0.5F;
                          body.wz += (sLevel.random.nextFloat() - 0.5F) * 0.5F;
                      } else {
                          double entSpeed = entVel.length();
                          if (entSpeed > 0.04) {
                              float push = (float) Math.min(0.45, entSpeed * 0.85 + 0.08);
                              body.vx += (float) ((dx / dist) * push + entVel.x * 0.55);
                              body.vy += 0.06F;
                              body.vz += (float) ((dz / dist) * push + entVel.z * 0.55);
                              body.wx += (float) (-(dz / dist) * push * 0.9);
                              body.wz += (float) ((dx / dist) * push * 0.9);
                              this.restTicks = 0;
                          }
                      }
                  }

                  float angSpeed = (float) Math.sqrt(body.wx * body.wx + body.wy * body.wy + body.wz * body.wz);
                  if (body.onGround && speed < 0.055F && angSpeed < 0.065F) {
                      restTicks++;
                      if (settleAsBlock && restTicks >= 9) {
                          Quaternionf identity = new Quaternionf();
                          body.rot.slerp(identity, 0.32F).normalize();
                      }
                  } else {
                      restTicks = 0;
                  }

                  syncBodyToEntity();

                  int maxLife = (mode == MODE_EXPLOSION_DEBRIS) ? 140 : 220;
                  if (restTicks >= 15 || this.age >= maxLife) {
                      finishRigidBody(sLevel, state);
                  }
              }

              private void finishRigidBody(ServerLevel sLevel, BlockState state) {
                  BlockPos placePos = BlockPos.containing(body.x, body.y, body.z);
                  if (settleAsBlock) {
                      if (!sLevel.getBlockState(placePos).canBeReplaced() && sLevel.getBlockState(placePos.above()).canBeReplaced()) {
                          placePos = placePos.above();
                      }
                      if (sLevel.getBlockState(placePos).canBeReplaced()) {
                          sLevel.setBlock(placePos, state, 3);
                          SoundType sound = state.getSoundType();
                          sLevel.playSound(
                              null, placePos.getX() + 0.5, placePos.getY() + 0.5, placePos.getZ() + 0.5,
                              sound.getPlaceSound(), SoundSource.BLOCKS, 0.8F, 0.95F
                          );
                          ModNetwork.sendPlaceImpact(sLevel, placePos, state);
                      } else if (dropItem) {
                          Block.popResource(sLevel, placePos, new ItemStack(state.getBlock()));
                      } else {
                          ModNetwork.sendBlockBreak(sLevel, placePos, state, 0, 0.1F, 0);
                      }
                  } else {
                      ModNetwork.sendBlockBreak(sLevel, placePos, state, body.vx, 0.15F, body.vz);
                  }
                  this.discard();
              }

              public void wakeUp() {
                  this.restTicks = 0;
                  this.body.onGround = false;
              }

              @Override
              public boolean isPickable() {
                  return false;
              }

              @Override
              public boolean isAttackable() {
                  return false;
              }

              @Override
              public boolean shouldRenderAtSqrDistance(double distance) {
                  return distance < 128.0 * 128.0;
              }

              @Override
              protected void readAdditionalSaveData(CompoundTag tag) {
                  if (tag.contains("BlockState")) {
                      setBlockState(NbtUtils.readBlockState(this.level().holderLookup(Registries.BLOCK), tag.getCompound("BlockState")));
                  }
                  setMode(tag.getInt("Mode"));
                  if (tag.contains("TargetPos")) {
                      setTargetPos(NbtUtils.readBlockPos(tag.getCompound("TargetPos")));
                  }
                  this.dropItem = !tag.contains("DropItem") || tag.getBoolean("DropItem");
                  this.settleAsBlock = !tag.contains("SettleAsBlock") || tag.getBoolean("SettleAsBlock");
                  this.age = tag.getInt("Age");
                  this.body.x = this.getX();
                  this.body.y = this.getY() + 0.5;
                  this.body.z = this.getZ();
                  this.body.vx = (float) this.getDeltaMovement().x;
                  this.body.vy = (float) this.getDeltaMovement().y;
                  this.body.vz = (float) this.getDeltaMovement().z;
                  this.body.wx = tag.getFloat("Wx");
                  this.body.wy = tag.getFloat("Wy");
                  this.body.wz = tag.getFloat("Wz");
                  if (tag.contains("Qw")) {
                      this.body.rot.set(tag.getFloat("Qx"), tag.getFloat("Qy"), tag.getFloat("Qz"), tag.getFloat("Qw")).normalize();
                  }
                  syncBodyToEntity();
              }

              @Override
              protected void addAdditionalSaveData(CompoundTag tag) {
                  tag.put("BlockState", NbtUtils.writeBlockState(getBlockState()));
                  tag.putInt("Mode", getMode());
                  tag.put("TargetPos", NbtUtils.writeBlockPos(getTargetPos()));
                  tag.putBoolean("DropItem", this.dropItem);
                  tag.putBoolean("SettleAsBlock", this.settleAsBlock);
                  tag.putInt("Age", this.age);
                  tag.putFloat("Wx", this.body.wx);
                  tag.putFloat("Wy", this.body.wy);
                  tag.putFloat("Wz", this.body.wz);
                  tag.putFloat("Qx", this.body.rot.x);
                  tag.putFloat("Qy", this.body.rot.y);
                  tag.putFloat("Qz", this.body.rot.z);
                  tag.putFloat("Qw", this.body.rot.w);
              }

              @Override
              public Packet<ClientGamePacketListener> getAddEntityPacket() {
                  return NetworkHooks.getEntitySpawningPacket(this);
              }
          }
