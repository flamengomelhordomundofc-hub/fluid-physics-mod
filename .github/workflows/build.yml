              @Override
              public boolean hurt(DamageSource src, float amt) {
                  if (!level().isClientSide() && isPersistent() && src.getEntity() instanceof Player pl) {
                      ServerLevel sLvl = (ServerLevel) level();
                      List<Part> plist = getParts();
                      if (pl.isShiftKeyDown()) {
                          for (Part pt : plist) {
                              BlockPos bp = BlockPos.containing(px + pt.ox, py + pt.oy, pz + pt.oz);
                              FPMod.sendBrk(sLvl, bp, pt.state, 0, 0.12F, 0);
                              Block.popResource(sLvl, bp, new ItemStack(pt.state.getBlock()));
                          }
                          discard();
                          return true;
                      }
                      Vec3 lk = pl.getLookAngle();
                      float mScale = 1.0F / Math.max(0.8F, (float) Math.sqrt(mass));
                      vx += (float) (lk.x * 0.56 * mScale);
                      vy += (float) (Math.max(0.18, lk.y * 0.45 + 0.16) * mScale);
                      vz += (float) (lk.z * 0.56 * mScale);
                      wx += (float) (-lk.z * 0.55 * mScale + (sLvl.random.nextFloat() - 0.5F) * 0.25F);
                      wy += (sLvl.random.nextFloat() - 0.5F) * 0.35F;
                      wz += (float) (lk.x * 0.55 * mScale + (sLvl.random.nextFloat() - 0.5F) * 0.25F);
                      restTicks = 0;
                      BlockState mainSt = plist.get(0).state;
                      sLvl.playSound(null, px, py, pz, mainSt.getSoundType().getHitSound(), SoundSource.BLOCKS, 0.9F, 0.95F);
                      FPMod.sendBnc(sLvl, px, py, pz, mainSt, 0.65F, 1);
                      return true;
                  }
                  return false;
              }

              private void finishNatural(ServerLevel l, BlockState st) {
                  BlockPos bp = BlockPos.containing(px, py, pz);
                  if (settle) {
                      if (!l.getBlockState(bp).canBeReplaced() && l.getBlockState(bp.above()).canBeReplaced()) bp = bp.above();
                      if (l.getBlockState(bp).canBeReplaced()) {
                          l.setBlock(bp, st, 3);
                          l.playSound(null, bp.getX() + 0.5, bp.getY() + 0.5, bp.getZ() + 0.5, st.getSoundType().getPlaceSound(), SoundSource.BLOCKS, 0.8F, 0.95F);
                          FPMod.sendPlc(l, bp, st);
                      } else if (dropItem) {
                          Block.popResource(l, bp, new ItemStack(st.getBlock()));
                      } else {
                          FPMod.sendBrk(l, bp, st, 0, 0.1F, 0);
                      }
                  } else {
                      FPMod.sendBrk(l, bp, st, vx, 0.15F, vz);
                  }
                  discard();
              }

              public void wake() {
                  restTicks = 0;
                  grounded = false;
              }

              @Override
              public boolean isPickable() {
                  return isPersistent();
              }

              @Override
              public boolean isAttackable() {
                  return isPersistent();
              }

              @Override
              public boolean shouldRenderAtSqrDistance(double d) {
                  return d < 160.0 * 160.0;
              }

              @Override
              protected void readAdditionalSaveData(CompoundTag t) {
                  if (t.contains("Parts")) entityData.set(D_PARTS, t.getCompound("Parts"));
                  entityData.set(D_PERS, t.getBoolean("Pers"));
                  entityData.set(D_RAD, Math.max(0.5F, t.getFloat("Rad")));
                  dropItem = !t.contains("Drop") || t.getBoolean("Drop");
                  settle = !t.contains("Settle") || t.getBoolean("Settle");
                  px = getX();
                  py = getY() + 0.5;
                  pz = getZ();
                  vx = (float) getDeltaMovement().x;
                  vy = (float) getDeltaMovement().y;
                  vz = (float) getDeltaMovement().z;
                  wx = t.getFloat("Wx");
                  wy = t.getFloat("Wy");
                  wz = t.getFloat("Wz");
                  if (t.contains("Qw")) rot.set(t.getFloat("Qx"), t.getFloat("Qy"), t.getFloat("Qz"), t.getFloat("Qw")).normalize();
                  setParts(getParts());
                  syncAll();
              }

              @Override
              protected void addAdditionalSaveData(CompoundTag t) {
                  t.put("Parts", entityData.get(D_PARTS).copy());
                  t.putBoolean("Pers", isPersistent());
                  t.putFloat("Rad", getRad());
                  t.putBoolean("Drop", dropItem);
                  t.putBoolean("Settle", settle);
                  t.putFloat("Wx", wx);
                  t.putFloat("Wy", wy);
                  t.putFloat("Wz", wz);
                  t.putFloat("Qx", rot.x);
                  t.putFloat("Qy", rot.y);
                  t.putFloat("Qz", rot.z);
                  t.putFloat("Qw", rot.w);
              }

              @Override
              public Packet<ClientGamePacketListener> getAddEntityPacket() {
                  return NetworkHooks.getEntitySpawningPacket(this);
              }
          }
