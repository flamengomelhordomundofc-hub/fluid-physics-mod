          cat << 'EOF' > src/main/java/com/fluidphysics/client/ClientPacketHandler.java
          package com.fluidphysics.client;

          import com.fluidphysics.network.ModNetwork;
          import com.fluidphysics.physics.PhysicsConfig;
          import net.minecraft.world.level.block.Block;

          public final class ClientPacketHandler {

              public static void handleBlockBreak(ModNetwork.BlockBreakPacket msg) {
                  ClientPhysicsManager.spawnBlockBreak(msg.pos(), Block.stateById(msg.stateId()), msg.dx(), msg.dy(), msg.dz());
              }

              public static void handlePlaceImpact(ModNetwork.BlockPlaceImpactPacket msg) {
                  ClientPhysicsManager.spawnPlaceImpact(msg.pos(), Block.stateById(msg.stateId()));
              }

              public static void handleBounceParticles(ModNetwork.BounceParticlesPacket msg) {
                  ClientPhysicsManager.spawnBounceParticles(msg.x(), msg.y(), msg.z(), Block.stateById(msg.stateId()), msg.intensity());
              }

              public static void handleExplosion(ModNetwork.ExplosionPhysicsPacket msg) {
                  ClientPhysicsManager.spawnExplosion(msg.x(), msg.y(), msg.z(), msg.radius(), msg.sampleBlockIds());
              }

              public static void handleSyncSettings(ModNetwork.SyncSettingsPacket msg) {
                  PhysicsConfig.fullGravity = msg.fullGravity();
                  PhysicsConfig.placementPhysics = msg.placePhysics();
                  PhysicsConfig.qualityLevel = msg.quality();
                  if (msg.clearAll()) {
                      ClientPhysicsManager.clearAll();
                  }
              }
          }
