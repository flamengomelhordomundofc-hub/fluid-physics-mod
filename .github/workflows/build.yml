              private static int testBox(Level l, BlockPos.MutableBlockPos np, int bx, int by, int bz, double x0, double y0, double z0, double x1, double y1, double z1, double px, double py, double pz, float rx, float ry, float rz, float[] cRx, float[] cRy, float[] cRz, float[] cNx, float[] cNy, float[] cNz, float[] cPen, int nc) {
