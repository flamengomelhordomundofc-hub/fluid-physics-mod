                              float dmg = Mth.clamp(spd * Math.min(4F, mass) * 3.5F, 2F, 16F);
                              ent.hurt(st.getSoundType() == SoundType.ANVIL ? damageSources().anvil(this) : damageSources().fallingBlock(this), dmg);
