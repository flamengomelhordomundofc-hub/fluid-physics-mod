          public class ServerPhysicsEvents {

            @SubscribeEvent
            public void onBlockBreak(BlockEvent.BreakEvent e) {
              if (!(e.getLevel() instanceof ServerLevel lvl)) return;
              BlockPos pos = e.getPos();
              BlockState st = e.getState();
              if (st.isAir()) return;
              Vec3 dir = e.getPlayer() != null ? e.getPlayer().getLookAngle().scale(0.14) : Vec3.ZERO;
              ModNetwork.sendBreak(lvl, pos, st, (float) dir.x, (float) dir.y, (float) dir.z);

              for (FluidBlockEntity f : lvl.getEntitiesOfClass(FluidBlockEntity.class, new AABB(pos).inflate(2.0))) f.wakeUp();
              if (PhysicsConfig.fullGravity) lvl.getServer().execute(() -> collapseAbove(lvl, pos.above(), 0));
            }

            private void collapseAbove(ServerLevel lvl, BlockPos pos, int depth) {
              if (depth > 14) return;
              BlockState st = lvl.getBlockState(pos);
              if (!PhysicsConfig.isSafePhysicsBlock(st, lvl, pos) || !noSupportBelow(lvl, pos)) return;
              lvl.setBlock(pos, Blocks.AIR.defaultBlockState(), 3);
              Vec3 v = new Vec3((lvl.random.nextDouble() - 0.5) * 0.08, -0.02, (lvl.random.nextDouble() - 0.5) * 0.08);
              Vec3 w = new Vec3((lvl.random.nextDouble() - 0.5) * 0.28, (lvl.random.nextDouble() - 0.5) * 0.16, (lvl.random.nextDouble() - 0.5) * 0.28);
              lvl.addFreshEntity(FluidBlockEntity.createFalling(lvl, pos.getX() + 0.5, pos.getY() + 0.5, pos.getZ() + 0.5, st, v, w, true));
              collapseAbove(lvl, pos.above(), depth + 1);
            }

            @SubscribeEvent
            public void onBlockPlace(BlockEvent.EntityPlaceEvent e) {
              if (!(e.getLevel() instanceof ServerLevel lvl)) return;
              BlockPos pos = e.getPos();
              BlockState st = e.getPlacedBlock();
              Entity placer = e.getEntity();
              boolean sneak = placer != null && placer.isShiftKeyDown();

              if (!PhysicsConfig.isSafePhysicsBlock(st, lvl, pos)) {
                ModNetwork.sendPlaceImpact(lvl, pos, st);
                return;
              }

              if (noSupportBelow(lvl, pos) && (PhysicsConfig.isNaturalGravity(st) || (PhysicsConfig.fullGravity && !sneak))) {
                lvl.setBlock(pos, Blocks.AIR.defaultBlockState(), 3);
                double tx = 0, tz = 0;
                for (Direction d : Direction.Plane.HORIZONTAL) {
                  if (!lvl.getBlockState(pos.relative(d)).getCollisionShape(lvl, pos.relative(d)).isEmpty()) {
                    tx -= d.getStepX(); tz -= d.getStepZ();
                  }
                }
                if (tx == 0 && tz == 0) { tx = lvl.random.nextDouble() - 0.5; tz = lvl.random.nextDouble() - 0.5; }
                double len = Math.max(0.01, Math.sqrt(tx * tx + tz * tz));
                tx /= len; tz /= len;
                Vec3 v = new Vec3(tx * 0.085, -0.02, tz * 0.085);
                Vec3 w = new Vec3(tz * 0.30 + (lvl.random.nextDouble() - 0.5) * 0.1, (lvl.random.nextDouble() - 0.5) * 0.14, -tx * 0.30 + (lvl.random.nextDouble() - 0.5) * 0.1);
                lvl.addFreshEntity(FluidBlockEntity.createFalling(lvl, pos.getX() + 0.5, pos.getY() + 0.5, pos.getZ() + 0.5, st, v, w, true));
                ModNetwork.sendPlaceImpact(lvl, pos, st);
                return;
              }

              if (PhysicsConfig.placementPhysics && !sneak) {
                lvl.setBlock(pos, Blocks.AIR.defaultBlockState(), 3);
                Vec3 app = new Vec3(0, 0.34, 0);
                if (placer != null) {
                  Vec3 diff = placer.getEyePosition().subtract(pos.getX() + 0.5, pos.getY() + 0.5, pos.getZ() + 0.5);
                  if (diff.lengthSqr() > 0.01) {
                    Vec3 d = diff.normalize();
                    app = new Vec3(d.x * 0.14, Math.max(0.24, d.y * 0.22 + 0.18), d.z * 0.14);
                  }
                }
                lvl.addFreshEntity(FluidBlockEntity.createPlacementSettle(lvl, pos, st, app));
              } else {
                ModNetwork.sendPlaceImpact(lvl, pos, st);
              }
            }

            @SubscribeEvent
            public void onEntityJoin(EntityJoinLevelEvent e) {
              if (!(e.getLevel() instanceof ServerLevel lvl)) return;
              if (e.getEntity() instanceof FallingBlockEntity fbe) {
                BlockState st = fbe.getBlockState();
                if (st.isAir()) return;
                e.setCanceled(true);
                double cx = fbe.getX(), cy = fbe.getY() + 0.5, cz = fbe.getZ();
                Vec3 bv = fbe.getDeltaMovement();
                Vec3 v = new Vec3(bv.x + (lvl.random.nextDouble() - 0.5) * 0.08, bv.y, bv.z + (lvl.random.nextDouble() - 0.5) * 0.08);
                Vec3 w = new Vec3((lvl.random.nextDouble() - 0.5) * 0.34, (lvl.random.nextDouble() - 0.5) * 0.22, (lvl.random.nextDouble() - 0.5) * 0.34);
                boolean drop = fbe.dropItem;
                lvl.getServer().execute(() -> lvl.addFreshEntity(FluidBlockEntity.createFalling(lvl, cx, cy, cz, st, v, w, drop)));
              }
            }

            @SubscribeEvent
            public void onExplosion(ExplosionEvent.Detonate e) {
              if (!(e.getLevel() instanceof ServerLevel lvl)) return;
              Vec3 c = e.getExplosion().getPosition();
              List<BlockPos> aff = e.getAffectedBlocks();
              if (aff.isEmpty()) return;
              float radius = Math.max(2.5F, (float) Math.cbrt(aff.size()) * 1.15F);
              List<BlockPos> cands = new ArrayList<>();
              List<Integer> samples = new ArrayList<>();
              for (BlockPos bp : aff) {
                BlockState st = lvl.getBlockState(bp);
                if (st.isAir() || st.getBlock() instanceof TntBlock || st.hasBlockEntity()) continue;
                if (samples.size() < 24) samples.add(Block.getId(st));
                if (st.isCollisionShapeFullBlock(lvl, bp) && st.getDestroySpeed(lvl, bp) >= 0) cands.add(bp);
              }
              Collections.shuffle(cands, new Random(lvl.random.nextLong()));
              int maxFly = Math.min(cands.size(), PhysicsConfig.qualityLevel == 0 ? 12 : (PhysicsConfig.qualityLevel == 2 ? 32 : 20));
              List<BlockPos> conv = new ArrayList<>(maxFly);
              for (int i = 0; i < maxFly; i++) {
                BlockPos bp = cands.get(i);
                BlockState st = lvl.getBlockState(bp);
                conv.add(bp);
                lvl.setBlock(bp, Blocks.AIR.defaultBlockState(), 3);
                double dx = bp.getX() + 0.5 - c.x, dy = bp.getY() + 0.5 - c.y, dz = bp.getZ() + 0.5 - c.z;
                double dist = Math.max(0.5, Math.sqrt(dx * dx + dy * dy + dz * dz));
                double pwr = Math.min(1.35, (radius / dist) * 0.42 + 0.25);
                Vec3 v = new Vec3((dx / dist) * pwr + (lvl.random.nextDouble() - 0.5) * 0.22,
                  Math.max(0.28, (dy / dist) * pwr + 0.38 + lvl.random.nextDouble() * 0.26),
                  (dz / dist) * pwr + (lvl.random.nextDouble() - 0.5) * 0.22);
                Vec3 w = new Vec3((lvl.random.nextDouble() - 0.5) * 0.95, (lvl.random.nextDouble() - 0.5) * 0.75, (lvl.random.nextDouble() - 0.5) * 0.95);
                lvl.addFreshEntity(FluidBlockEntity.createExplosionDebris(lvl, bp.getX() + 0.5, bp.getY() + 0.5, bp.getZ() + 0.5, st, v, w, i % 2 == 0));
              }
              aff.removeAll(conv);

              for (FluidBlockEntity f : lvl.getEntitiesOfClass(FluidBlockEntity.class, new AABB(c, c).inflate(radius * 2.5))) {
                if (f.getMode() == FluidBlockEntity.MODE_PLACEMENT_SETTLE) continue;
                Vec3 diff = f.position().subtract(c);
                double d = Math.max(0.5, diff.length());
                float imp = (float) Math.min(1.6, (radius / d) * 0.75);
                f.body.vx += (float) ((diff.x / d) * imp); f.body.vy += (float) ((diff.y / d) * imp + 0.35); f.body.vz += (float) ((diff.z / d) * imp);
                f.body.wx += (lvl.random.nextFloat() - 0.5F) * 0.9F; f.body.wz += (lvl.random.nextFloat() - 0.5F) * 0.9F;
                f.wakeUp();
              }
              ModNetwork.sendExplode(lvl, c.x, c.y, c.z, radius, samples.stream().mapToInt(Integer::intValue).toArray());
            }

            @SubscribeEvent
            public void onMobDeath(LivingDeathEvent e) {
              if (!(e.getEntity().level() instanceof ServerLevel lvl)) return;
              Entity ent = e.getEntity();
              BlockState floor = lvl.getBlockState(ent.blockPosition().below());
              if (floor.isAir()) floor = Blocks.RED_CONCRETE.defaultBlockState();
              ModNetwork.sendBounce(lvl, ent.getX(), ent.getY() + ent.getBbHeight() * 0.5, ent.getZ(), floor, 0.75F);
            }

            @SubscribeEvent
            public void onPlayerTick(TickEvent.PlayerTickEvent e) {
              if (e.phase != TickEvent.Phase.END || e.player.level().isClientSide()) return;
              Player p = e.player;
              if ((p.tickCount & 1) != 0) return;
              Vec3 pv = p.getDeltaMovement();
              if (pv.horizontalDistanceSqr() < 0.004) return;
              for (ItemEntity item : p.level().getEntitiesOfClass(ItemEntity.class, p.getBoundingBox().inflate(0.35))) {
                item.setDeltaMovement(item.getDeltaMovement().add(pv.x * 0.65, 0.07, pv.z * 0.65));
              }
            }

            private boolean noSupportBelow(ServerLevel lvl, BlockPos pos) {
              BlockPos b = pos.below();
              return lvl.getBlockState(b).getCollisionShape(lvl, b).isEmpty();
            }

